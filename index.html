<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CRM Pipeline — Fundación Industrial Navarra</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;font-family:"Calibri","Segoe UI","Helvetica Neue",Arial,sans-serif;background:#EEF5F7;color:#040D17;font-size:clamp(13px,1vw,16px);}
:root{--fp:#0C5580;--fm:#25618B;--fl:#B0D1D7;--fb:#EEF5F7;--fd:#040D17;--fr:#BC262E;--fn:#1F4E79;--fmu:#757575;}
#wrap{display:flex;flex-direction:column;min-height:100vh;}
.hdr{background:var(--fp);padding:10px clamp(12px,2vw,32px);display:flex;align-items:center;justify-content:space-between;border-bottom:3px solid var(--fr);flex-wrap:wrap;gap:8px;}
.hdr-left{display:flex;align-items:center;gap:14px;}
.hdr-logo{height:38px;}
.hdr-title{color:#fff;font-weight:700;font-size:17px;line-height:1.2;}
.hdr-sub{color:#B0D1D7;font-size:11px;margin-top:2px;}
.hdr-right{display:flex;gap:8px;}
.nav{background:var(--fp);padding:5px clamp(12px,2vw,32px);display:flex;gap:6px;border-bottom:1px solid var(--fm);flex-wrap:wrap;}
.kpibar{background:var(--fp);padding:6px clamp(12px,2vw,32px);display:flex;gap:8px;flex-wrap:wrap;border-bottom:1px solid var(--fm);}
.kpi{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);border-radius:6px;padding:4px clamp(10px,1.2vw,18px);text-align:center;}
.kpi-v{color:#fff;font-size:clamp(14px,1.2vw,20px);font-weight:700;line-height:1;}
.kpi-v.red{color:#F5A0A0;}
.kpi-l{color:#B0D1D7;font-size:9px;text-transform:uppercase;letter-spacing:.05em;margin-top:2px;}
.main{flex:1;padding:clamp(12px,1.5vw,24px) clamp(12px,2vw,32px);overflow-y:auto;}
.btn{border:none;border-radius:5px;padding:6px 14px;font-size:12px;cursor:pointer;font-family:inherit;font-weight:600;transition:opacity .15s;}
.btn:hover{opacity:.85;}
.btn-primary{background:var(--fp);color:#fff;}
.btn-danger{background:var(--fr);color:#fff;}
.btn-ghost{background:rgba(255,255,255,.08);color:#fff;border:1px solid rgba(255,255,255,.25);}
.btn-ghost.active{background:rgba(255,255,255,.25);border-color:rgba(255,255,255,.5);}
.btn-outline{background:var(--fb);color:var(--fp);border:1px solid var(--fl);}
.btn-lostout{background:#FFF0F0;color:var(--fr);border:1px solid #F5C0C0;}
.btn-sm{padding:4px 10px;font-size:11px;}
.kanban{display:flex;gap:clamp(6px,0.8vw,14px);align-items:flex-start;width:100%;}
.kcol{flex:1;min-width:0;}
.kcol.lost-col{flex:0 0 clamp(160px,14vw,240px);}
.col-hdr{background:var(--fp);color:#fff;font-size:clamp(8px,0.7vw,11px);font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding:6px clamp(6px,0.6vw,10px);border-radius:6px 6px 0 0;display:flex;justify-content:space-between;align-items:center;}
.col-hdr.lost{background:#C0392B;}
.col-badge{background:rgba(255,255,255,.22);border-radius:8px;padding:1px 7px;font-size:10px;font-weight:700;}
.col-body{border:1px solid var(--fl);border-top:none;border-radius:0 0 6px 6px;padding:clamp(4px,0.5vw,8px) clamp(4px,0.4vw,6px);min-height:clamp(120px,20vh,300px);display:flex;flex-direction:column;gap:5px;background:rgba(12,85,128,.03);transition:background .15s,border .15s;}
.col-body.over{background:rgba(12,85,128,.12);border:2px dashed var(--fp);padding:6px 4px;}
.col-body.over-lost{background:rgba(192,57,43,.1);border:2px dashed #C0392B;padding:6px 4px;}
.card{background:#fff;border:1px solid var(--fl);border-left:3px solid var(--fp);border-radius:6px;padding:clamp(6px,0.6vw,10px) clamp(7px,0.7vw,12px);cursor:grab;user-select:none;transition:box-shadow .15s;}
.card:hover{box-shadow:0 2px 10px rgba(12,85,128,.14);}
.card.dragging{opacity:.3;cursor:grabbing;}
.card.warn{border-left-color:#E67E22;}
.card.lostcard{background:#FFF8F8;border-left-color:#C0392B;cursor:pointer;}
.card-co{font-size:clamp(11px,0.85vw,14px);font-weight:700;color:var(--fn);margin-bottom:2px;}
.card-sec{font-size:clamp(9px,0.7vw,11px);color:var(--fmu);margin-bottom:4px;}
.card-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:3px;}
.card-com{font-size:10px;color:var(--fp);}
.card-pip{font-size:9px;background:var(--fb);color:var(--fp);padding:1px 5px;border-radius:5px;font-weight:700;}
.card-bot{display:flex;justify-content:space-between;align-items:center;}
.card-days{font-size:10px;color:var(--fmu);}
.card-days.al{color:#C0392B;font-weight:700;}
.card-prob{font-size:11px;font-weight:700;color:var(--fm);}
.card-prob.cust{color:var(--fr);}
.card-imp{font-size:11px;color:var(--fp);font-weight:700;margin-top:4px;padding-top:4px;border-top:1px solid var(--fl);}
.card-lreason{font-size:10px;color:#922B21;font-style:italic;margin-bottom:4px;}
.add-btn{background:transparent;border:1px dashed var(--fl);border-radius:5px;color:var(--fmu);font-size:20px;cursor:pointer;padding:5px;width:100%;margin-top:2px;font-family:inherit;}
.add-btn:hover{background:rgba(12,85,128,.05);}
.recover-btn{font-size:10px;color:var(--fm);background:var(--fb);border:1px solid var(--fl);border-radius:4px;padding:3px 8px;cursor:pointer;width:100%;margin-top:4px;font-family:inherit;}
.overlay{position:fixed;inset:0;background:rgba(4,13,23,.6);z-index:1000;display:flex;align-items:center;justify-content:center;padding:20px;}
.modal{background:#fff;border-radius:10px;width:100%;max-width:580px;max-height:92vh;overflow-y:auto;border-top:4px solid var(--fr);}
.modal.btop{border-top-color:var(--fp);}
.mhdr{background:var(--fp);padding:14px 18px;display:flex;justify-content:space-between;align-items:flex-start;border-radius:6px 6px 0 0;}
.mhdr-co{color:#fff;font-size:16px;font-weight:700;}
.mhdr-sub{color:#B0D1D7;font-size:12px;margin-top:2px;}
.mbadge{display:inline-block;padding:2px 8px;border-radius:8px;font-size:10px;font-weight:700;margin-top:6px;margin-right:4px;}
.mclose{background:none;border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:4px;padding:2px 9px;cursor:pointer;font-size:17px;line-height:1.2;font-family:inherit;}
.mbody{padding:18px 20px;}
.stitle{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--fp);margin-bottom:8px;padding-bottom:5px;border-bottom:1px solid var(--fl);margin-top:0;}
.mt16{margin-top:16px;}
.stagebar{display:flex;gap:3px;margin:7px 0 5px;}
.sdot{height:6px;flex:1;border-radius:3px;background:var(--fl);}
.sdot.done{background:var(--fp);}
.sdot.cur{background:var(--fr);}
.slabel{font-size:12px;color:var(--fp);font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:6px;}
.snum{background:var(--fp);color:#fff;border-radius:50%;width:20px;height:20px;display:inline-flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0;}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-bottom:4px;}
.fgrp{display:flex;flex-direction:column;gap:3px;}
.flbl{font-size:10px;color:var(--fmu);text-transform:uppercase;letter-spacing:.04em;}
.fval{font-size:13px;color:var(--fd);font-weight:600;}
.fval.al{color:#C0392B;}
.inp{width:100%;font-size:12px;padding:5px 8px;border:1px solid var(--fl);border-radius:4px;color:var(--fd);background:#fff;outline:none;font-family:inherit;}
.inp:focus{border-color:var(--fp);}
.inp.cust{border-color:var(--fr);color:var(--fr);font-weight:700;}
.prob-row{display:flex;gap:6px;align-items:center;}
.prob-inp{width:70px!important;}
.prob-reset{font-size:10px;color:var(--fm);background:var(--fb);border:1px solid var(--fl);border-radius:4px;padding:3px 8px;cursor:pointer;white-space:nowrap;font-family:inherit;}
.obs-list{display:flex;flex-direction:column;gap:6px;max-height:180px;overflow-y:auto;margin-bottom:8px;}
.obs-e{border-left:3px solid var(--fp);border-radius:0 5px 5px 0;padding:7px 10px;background:var(--fb);}
.obs-e.sys{border-left-color:var(--fl);background:#f9f9f9;}
.obs-e.al{border-left-color:var(--fr);background:#FFF5F5;}
.obs-meta{font-size:10px;color:var(--fmu);margin-bottom:2px;display:flex;gap:6px;align-items:center;}
.obs-auth{font-weight:700;color:var(--fp);}
.obs-badge{font-size:8px;padding:1px 4px;border-radius:3px;}
.obs-badge.s{background:var(--fb);color:var(--fp);}
.obs-badge.a{background:#FFF0F0;color:var(--fr);}
.obs-txt{font-size:12px;color:var(--fd);line-height:1.5;}
.obs-ta{width:100%;border:1px solid var(--fl);border-radius:5px;padding:8px 10px;font-size:12px;font-family:inherit;color:var(--fd);resize:vertical;min-height:60px;outline:none;}
.obs-ta:focus{border-color:var(--fp);}
.mactions{display:flex;gap:8px;margin-top:14px;padding-top:12px;border-top:1px solid var(--fl);align-items:center;flex-wrap:wrap;}
.dash-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(clamp(100px,12vw,180px),1fr));gap:clamp(8px,0.8vw,14px);margin-bottom:clamp(12px,1.2vw,20px);}
.dash-kpi{background:#fff;border:1px solid var(--fl);border-radius:8px;padding:14px;text-align:center;}
.dash-kpi-v{font-size:22px;font-weight:700;color:var(--fp);line-height:1;}
.dash-kpi-v.red{color:#C0392B;}
.dash-kpi-l{font-size:10px;color:var(--fmu);text-transform:uppercase;letter-spacing:.05em;margin-top:5px;}
.dash-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:12px;margin-bottom:12px;}
.dash-card{background:#fff;border:1px solid var(--fl);border-radius:8px;padding:14px 16px;}
.dash-ct{font-size:13px;font-weight:700;color:var(--fn);margin-bottom:12px;}
.brow{margin-bottom:10px;}
.blbl{display:flex;justify-content:space-between;font-size:11px;margin-bottom:3px;}
.btrack{background:var(--fb);border-radius:4px;height:10px;overflow:hidden;position:relative;}
.bbg{position:absolute;height:100%;width:100%;background:var(--fl);border-radius:4px;}
.bfill{position:absolute;height:100%;background:var(--fp);border-radius:4px;}
.bsub{font-size:9px;color:var(--fmu);margin-top:2px;}
.crow{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
.cav{width:32px;height:32px;border-radius:50%;background:var(--fb);border:1px solid var(--fl);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:var(--fp);flex-shrink:0;}
.cname{font-size:12px;font-weight:700;color:var(--fd);}
.csub{font-size:10px;color:var(--fmu);}
.cimp{font-size:12px;font-weight:700;color:var(--fp);text-align:right;}
.cpond{font-size:10px;color:var(--fmu);text-align:right;}
.lost-reasons{display:flex;flex-wrap:wrap;gap:7px;}
.lrc{background:#fff;border:1px solid #F5C0C0;border-radius:5px;padding:5px 12px;font-size:11px;}
.lrn{font-weight:700;color:var(--fr);}
.eq-row{display:flex;gap:8px;align-items:center;margin-bottom:8px;}
.eq-val{flex:1;font-size:12px;padding:5px 8px;background:var(--fb);border-radius:4px;color:var(--fd);}
.eq-inp{flex:1;font-size:12px;padding:5px 8px;border:1px solid var(--fp);border-radius:4px;outline:none;font-family:inherit;color:var(--fd);}

.config-section{background:#fff;border:1px solid var(--fl);border-radius:8px;padding:16px 20px;margin-bottom:14px;}
.config-section-title{font-size:13px;font-weight:700;color:var(--fn);margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--fl);}
.config-table{width:100%;border-collapse:collapse;font-size:12px;}
.config-table th{background:var(--fp);color:#fff;padding:7px 10px;text-align:left;font-weight:600;}
.config-table td{padding:6px 10px;border-bottom:1px solid var(--fl);vertical-align:middle;}
.config-table tr:nth-child(even) td{background:#F7FBFC;}
.config-table tr:hover td{background:#EEF5F7;}
.days-inp{width:60px;font-size:12px;padding:3px 6px;border:1px solid var(--fl);border-radius:4px;text-align:center;font-family:inherit;color:var(--fd);}
.days-inp:focus{border-color:var(--fp);outline:none;}
.auto-rule{display:flex;align-items:flex-start;gap:12px;padding:10px 0;border-bottom:1px solid var(--fl);}
.auto-rule:last-child{border-bottom:none;}
.auto-rule-icon{font-size:18px;flex-shrink:0;margin-top:2px;}
.auto-rule-title{font-size:12px;font-weight:700;color:var(--fn);margin-bottom:3px;}
.auto-rule-desc{font-size:11px;color:var(--fmu);line-height:1.5;}
.auto-badge{display:inline-block;font-size:9px;font-weight:700;padding:2px 6px;border-radius:4px;margin-right:4px;}
.auto-badge.p1{background:#EEF5F7;color:var(--fp);}
.auto-badge.p2{background:#EAF2FF;color:#2E75B6;}
.auto-badge.p3{background:#E8F5E9;color:#1D9E75;}
.auto-badge.p4{background:#FFF0F0;color:var(--fr);}

.notif-active{position:relative;}
.notif-badge{position:absolute;top:-4px;right:-4px;background:var(--fr);color:#fff;border-radius:50%;width:16px;height:16px;font-size:9px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;line-height:1;}
.notif-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
.notif-header-title{font-size:16px;font-weight:700;color:var(--fn);}
.notif-header-actions{display:flex;gap:8px;}
.notif-item{background:#fff;border:1px solid var(--fl);border-radius:8px;padding:12px 14px;margin-bottom:8px;border-left:4px solid var(--fp);display:flex;gap:12px;align-items:flex-start;transition:opacity .2s;}
.notif-item.unread{background:#FAFCFF;}
.notif-item.read{opacity:.7;}
.notif-item.overdue{border-left-color:var(--fr);}
.notif-item.automation{border-left-color:#2E75B6;}
.notif-item.alert{border-left-color:#E67E22;}
.notif-icon{font-size:18px;flex-shrink:0;margin-top:1px;}
.notif-content{flex:1;}
.notif-title{font-size:12px;font-weight:700;color:var(--fd);margin-bottom:3px;display:flex;align-items:center;gap:6px;}
.notif-unread-dot{width:7px;height:7px;border-radius:50%;background:var(--fr);flex-shrink:0;}
.notif-body{font-size:11px;color:var(--fmu);line-height:1.5;margin-bottom:4px;}
.notif-meta{font-size:10px;color:var(--fl);display:flex;gap:8px;align-items:center;}
.notif-pip-badge{font-size:9px;font-weight:700;padding:1px 5px;border-radius:4px;background:var(--fb);color:var(--fp);}
.notif-clear-btn{background:none;border:none;color:var(--fmu);cursor:pointer;font-size:14px;padding:0 4px;flex-shrink:0;line-height:1;}
.notif-clear-btn:hover{color:var(--fr);}
.notif-empty{text-align:center;padding:48px 20px;color:var(--fmu);}
.notif-empty-icon{font-size:40px;margin-bottom:12px;}
.notif-empty-text{font-size:13px;}

.help-wrap{max-width:900px;margin:0 auto;}
.help-hero{background:var(--fp);border-radius:10px;padding:28px 32px;margin-bottom:20px;display:flex;align-items:center;gap:24px;}
.help-hero-icon{font-size:48px;flex-shrink:0;}
.help-hero-title{color:#fff;font-size:22px;font-weight:700;margin-bottom:4px;}
.help-hero-sub{color:var(--fl);font-size:13px;line-height:1.6;}
.help-section{background:#fff;border:1px solid var(--fl);border-radius:8px;padding:20px 24px;margin-bottom:14px;}
.help-section-title{font-size:15px;font-weight:700;color:var(--fn);margin-bottom:14px;padding-bottom:10px;border-bottom:2px solid var(--fl);display:flex;align-items:center;gap:8px;}
.help-section-icon{font-size:18px;}
.help-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:12px;}
.help-card{background:var(--fb);border:1px solid var(--fl);border-radius:7px;padding:14px 16px;}
.help-card-title{font-size:12px;font-weight:700;color:var(--fp);margin-bottom:6px;display:flex;align-items:center;gap:6px;}
.help-card-badge{font-size:9px;font-weight:700;padding:2px 7px;border-radius:4px;color:#fff;}
.help-card-badge.p1{background:var(--fp);}
.help-card-badge.p2{background:#2E75B6;}
.help-card-badge.p3{background:#1D9E75;}
.help-card-badge.p4{background:var(--fr);}
.help-card-text{font-size:11px;color:var(--fmu);line-height:1.6;}
.help-steps{display:flex;flex-direction:column;gap:8px;}
.help-step{display:flex;align-items:flex-start;gap:12px;}
.help-step-num{background:var(--fp);color:#fff;border-radius:50%;width:24px;height:24px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;margin-top:1px;}
.help-step-content{flex:1;}
.help-step-title{font-size:12px;font-weight:700;color:var(--fd);margin-bottom:2px;}
.help-step-text{font-size:11px;color:var(--fmu);line-height:1.5;}
.help-auto-row{display:flex;align-items:flex-start;gap:12px;padding:10px 0;border-bottom:1px solid var(--fl);}
.help-auto-row:last-child{border-bottom:none;padding-bottom:0;}
.help-auto-arrow{display:flex;align-items:center;gap:6px;flex-shrink:0;min-width:110px;}
.help-auto-from{font-size:10px;font-weight:700;padding:2px 7px;border-radius:4px;color:#fff;}
.help-auto-to{font-size:10px;font-weight:700;padding:2px 7px;border-radius:4px;color:#fff;}
.help-auto-sep{font-size:14px;color:var(--fmu);}
.help-auto-content{}
.help-auto-title{font-size:12px;font-weight:700;color:var(--fd);margin-bottom:2px;}
.help-auto-text{font-size:11px;color:var(--fmu);line-height:1.5;}
.help-auto-trigger{display:inline-block;font-size:9px;background:#EEF5F7;color:var(--fp);border:1px solid var(--fl);border-radius:4px;padding:1px 6px;margin-top:4px;font-weight:600;}
.help-tip{background:#FFFBEA;border:1px solid #F0D060;border-radius:6px;padding:10px 14px;margin-top:10px;font-size:11px;color:#7A5C00;display:flex;gap:8px;align-items:flex-start;}
.help-tip-icon{font-size:14px;flex-shrink:0;}
.help-kpi-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px;}
.help-kpi-chip{background:var(--fb);border:1px solid var(--fl);border-radius:6px;padding:8px 14px;flex:1;min-width:120px;}
.help-kpi-label{font-size:10px;color:var(--fmu);text-transform:uppercase;letter-spacing:.04em;margin-bottom:3px;}
.help-kpi-desc{font-size:11px;color:var(--fd);line-height:1.4;}
.help-shortcut-table{width:100%;border-collapse:collapse;font-size:11px;}
.help-shortcut-table td{padding:6px 10px;border-bottom:1px solid var(--fl);}
.help-shortcut-table tr:last-child td{border-bottom:none;}
.help-shortcut-table td:first-child{font-weight:700;color:var(--fp);width:40%;}
.help-shortcut-table tr:nth-child(even) td{background:var(--fb);}

@media(min-width:1600px){
  .card-co{font-size:14px;}
  .card-sec{font-size:11px;}
  .col-hdr{font-size:11px;}
  .kpi-v{font-size:20px;}
}
@media(max-width:1100px){
  .kanban{overflow-x:auto;padding-bottom:8px;}
  .kcol{min-width:140px;flex:0 0 clamp(140px,18vw,200px);}
  .kcol.lost-col{flex:0 0 clamp(150px,18vw,200px);}
}
@media(max-width:768px){
  .hdr-right{width:100%;justify-content:flex-start;}
  .hdr{padding:8px 12px;}
  .nav,.kpibar{padding:4px 10px;}
  .main{padding:10px 10px;}
  .modal{max-width:98vw;}
  .fgrid{grid-template-columns:1fr;}
}
.footer{background:var(--fp);color:#B0D1D7;font-size:10px;padding:7px clamp(12px,2vw,32px);display:flex;justify-content:space-between;}
</style>
</head>
<body>
<div id="wrap">
  <header class="hdr">
    <div class="hdr-left">
      <img class="hdr-logo" id="fin-logo" alt="Fundacion Industrial Navarra">
      <div>
        <div class="hdr-title">CRM Pipeline &mdash; Fundaci&oacute;n Industrial Navarra</div>
        <div class="hdr-sub">Director Comercial y Marketing &middot; 2026</div>
      </div>
    </div>
    <div class="hdr-right">

var notifications = [];
var notifIdCounter = 1;

function addNotif(type, title, body, pipeline, company, action) {
  notifications.unshift({
    id: notifIdCounter++,
    type: type,       // 'overdue' | 'automation' | 'alert'
    title: title,
    body: body,
    pipeline: pipeline || null,
    company: company || null,
    action: action || null,
    date: nowStr(),
    read: false
  });
  updateNotifBadge();
}

function markAllRead() {
  notifications.forEach(function(n){ n.read = true; });
  updateNotifBadge();
  renderNotifications();
}

function clearNotif(id) {
  notifications = notifications.filter(function(n){ return n.id !== id; });
  updateNotifBadge();
  renderNotifications();
}

function clearAllNotifs() {
  notifications = [];
  updateNotifBadge();
  renderNotifications();
}

function updateNotifBadge() {
  var unread = notifications.filter(function(n){ return !n.read; }).length;
  var badge = document.getElementById("notif-badge");
  if(badge) {
    badge.textContent = unread > 0 ? unread : "";
    badge.style.display = unread > 0 ? "inline-flex" : "none";
  }
  var btn = document.getElementById("btn-notif");
  if(btn) {
    btn.className = "btn btn-ghost" + (currentView==="notif"?" active":"") + (unread>0?" notif-active":"");
  }
}

function checkOverdueNotifications() {
  var active = leads.filter(function(l){ return !l.lost && l.stage >= 0; });
  active.forEach(function(lead){
    if(isOverdue(lead)) {
      var key = "overdue-" + lead.id + "-" + lead.stage;
      var alreadyNotified = notifications.find(function(n){ return n.body && n.body.indexOf(key) !== -1; });
      if(!alreadyNotified) {

          'P2/P3',
          lead.company,
          lead.id
        );

    }

function renderLeadModal(id){
  var lead=getLead(id); if(!lead)return;
  var pipeline=PIPELINES[lead.pipeline];

    return '<div class="obs-e'+(o.type==="system"?" sys":o.type==="alert"?" al":"")+'">'

      +(o.type==="system"?'<span class="obs-badge s">AUTO</span>':"")

      +'<span style="font-size:13px;color:var(--fmu)">%</span>'
      +(isC?'<button class="prob-reset" onclick="resetProb('+id+')">&#8617; Restablecer ('+cur.prob+'%)</button>':"")
      +'</div></div>';
  }

  var importeField=pipeline.economic
    ?'<div class="fgrp"><div class="flbl">Importe (&euro;)</div><input class="inp" id="lead-importe-'+id+'" type="number" value="'+(lead.importe||"")+'" placeholder="0" oninput="liveSetImporte('+id+',this.value)"></div>'
    :"";

  var concOptions='<option value="">-- Sin especificar --</option>'+conceptosIngreso.map(function(c){
    return '<option value="'+esc(c)+'"'+(c===lead.concepto?' selected':'')+'>'+esc(c)+'</option>';
  }).join("");
  var conceptoField=pipeline.economic
    ?'<div class="fgrp"><div class="flbl">Concepto de ingreso</div><select class="inp" id="concepto-sel-'+id+'" onchange="liveSetConcepto('+id+',this.value)">'+concOptions+'</select></div>'
    :"";
  var showMat=lead.concepto&&conceptosConMatriculas.indexOf(lead.concepto)!==-1;
  var matriculasField=pipeline.economic
    ?'<div id="mat-wrap-'+id+'" style="'+(showMat?'':'display:none')+'">'
      +'<div class="fgrp"><div class="flbl">N&ordm; matr&iacute;culas</div>'
      +'<input class="inp" type="number" min="1" id="mat-inp-'+id+'" value="'+(lead.matriculas||"")+'" placeholder="Ej: 10" oninput="liveSetMatriculas('+id+',this.value)">'
      +'</div></div>'
    :"";

  var pondVal=(lead.importe&&prob!=null)?fmt(lead.importe*prob/100):"—";
  var ponderadoField=pipeline.economic
    ?'<div class="fgrp"><div class="flbl">Importe ponderado</div><div class="fval" id="lead-pond-'+id+'" style="color:var(--fp)">'+pondVal+'</div></div>'
    :"";

  var html='<div class="mhdr"><div>'
    +'<div class="mhdr-co">'+esc(lead.company)+'</div>'
    +'<div class="mhdr-sub">'+esc(lead.sector)+' &middot; '+esc(lead.contact)+'</div>'
    +'<span class="mbadge" style="background:var(--fr);color:#fff">'+lead.pipeline+'</span>'
    +'<span class="mbadge" style="background:rgba(255,255,255,.2);color:#fff">'+esc(pipeline.label)+'</span>'
    +'</div><button class="mclose" onclick="closeModal()">&times;</button></div>'
    +'<div class="mbody">'
    +'<div class="stitle">Situaci&oacute;n actual</div>'
    +'<div class="stagebar">'+stageBar+'</div>'
    +'<div class="slabel"><span class="snum">'+(lead.stage+1)+'</span>'+(cur?esc(cur.label):"&mdash;")+'</div>'
    +'<div class="fgrid"><div class="fgrp"><div class="flbl">Comercial asignado</div><select class="inp" id="lead-comercial-'+id+'" onchange="liveSetComercial('+id+',this.value)">'+comOptions+'</select></div>'
    +'<div class="fgrp"><div class="flbl">D&iacute;as en etapa</div><div class="fval'+(isOverdue(lead)?" al":"")+'">'+lead.days+' d&iacute;as'+(lead.days>14?" &#9888;":"")+'</div></div>'
    +importeField+conceptoField+matriculasField+probField+ponderadoField+'</div>'
    +'<div class="stitle mt16">Observaciones y trazabilidad</div>'

    +'<div style="display:flex;justify-content:flex-end;margin-top:6px;margin-bottom:4px"><button class="btn btn-primary" onclick="addObs('+id+')">&#9998; Guardar nota</button></div>'
    +'<div class="mactions"><button class="btn btn-lostout" onclick="openLostModalFromLead('+id+')">&#10005; Marcar como perdida</button>'
    +'<button class="btn btn-danger" onclick="confirmDeleteLead('+id+')" style="background:#7B0000;margin-left:6px">&#128465; Eliminar ficha</button>'
    +(nxt?'<button class="btn btn-danger" onclick="advanceStage('+id+')" style="margin-left:auto">&rarr; Avanzar a: '+esc(nxt.short)+'</button>':"")
    +'</div></div>';
  showModal(html);
}

// Live setters — save immediately and update ponderado inline without re-rendering the modal
function refreshPonderado(id){
  var l=getLead(id); if(!l)return;
  var el=document.getElementById("lead-pond-"+id); if(!el)return;
  var p=getProb(l);
  el.textContent=(l.importe&&p!=null)?fmt(l.importe*p/100):"—";
}
function liveSetComercial(id,val){ var l=getLead(id);if(l)l.comercial=val; renderKPIs(); if(currentView==="kanban")renderKanban(); }
function liveSetImporte(id,val){ var l=getLead(id);if(!l)return; l.importe=val?Number(val):null; refreshPonderado(id); renderKPIs(); if(currentView==="kanban")renderKanban(); }
function liveSetProb(id,val){ var l=getLead(id);if(!l)return; l.probCustom=val!==""?Number(val):null; refreshPonderado(id); renderKPIs(); if(currentView==="kanban")renderKanban(); }
function liveSetConcepto(id,val){
  var l=getLead(id); if(!l)return;
  l.concepto=val||null;
  if(!val||conceptosConMatriculas.indexOf(val)===-1){ l.matriculas=null; }
  var wrap=document.getElementById("mat-wrap-"+id);
  if(wrap) wrap.style.display=(val&&conceptosConMatriculas.indexOf(val)!==-1)?"block":"none";
  renderKPIs(); if(currentView==="kanban")renderKanban();
}
function liveSetMatriculas(id,val){ var l=getLead(id);if(!l)return; l.matriculas=val?Number(val):null; renderKPIs(); if(currentView==="kanban")renderKanban(); }
window.liveSetComercial=liveSetComercial;
window.liveSetImporte=liveSetImporte;
window.liveSetProb=liveSetProb;
window.liveSetConcepto=liveSetConcepto;
window.liveSetMatriculas=liveSetMatriculas;

function setComercial(id,val){ var l=getLead(id);if(l){l.comercial=val;}renderKPIs(); }
function setImporte(id,val){ var l=getLead(id);if(l){l.importe=val?Number(val):null;}renderKPIs(); }
function setProb(id,val){ var l=getLead(id);if(l){l.probCustom=val!==""?Number(val):null;}renderKPIs(); }
function resetProb(id){
  var l=getLead(id);if(!l)return;
  l.probCustom=null;
  if(selectedLeadId===id) renderLeadModal(id);
  renderKPIs();
}
function setConcepto(id,val){
  var l=getLead(id); if(!l)return;
  l.concepto=val||null;
  if(!val||conceptosConMatriculas.indexOf(val)===-1) l.matriculas=null;
  renderKPIs();
}
function setMatriculas(id,val){
  var l=getLead(id); if(!l)return;
  l.matriculas=val?Number(val):null;
  renderKPIs();
}
function confirmDeleteLead(id){
  var l=getLead(id); if(!l)return;
  var html='<div class="mhdr" style="border-radius:6px 6px 0 0;background:#7B0000"><div><div class="mhdr-co">&#128465; Eliminar ficha</div><div class="mhdr-sub">'+esc(l.company)+'</div></div><button class="mclose" onclick="openLead('+id+')">&times;</button></div>'
    +'<div class="mbody"><div style="background:#FFF0F0;border-left:3px solid var(--fr);border-radius:0 5px 5px 0;padding:12px 14px;margin-bottom:16px;font-size:13px;color:#7B0000">'
    +'&#9888; Esta acci&oacute;n es <strong>irreversible</strong>. La ficha de <strong>'+esc(l.company)+'</strong> y todo su historial de observaciones ser&aacute;n eliminados permanentemente.</div>'
    +'<div style="display:flex;gap:8px;justify-content:flex-end">'
    +'<button class="btn btn-outline" onclick="openLead('+id+')">Cancelar</button>'
    +'<button class="btn btn-danger" onclick="deleteLead('+id+')" style="background:#7B0000">&#128465; S&iacute;, eliminar</button>'
    +'</div></div>';
  showModal(html, true);
}
function deleteLead(id){
  leads=leads.filter(function(l){return l.id!==id;});
  closeModal();
  refresh();
}
window.confirmDeleteLead=confirmDeleteLead;
window.deleteLead=deleteLead;
function addObs(id){
  var txt=inp?inp.value.trim():"";
  if(!txt)return;
  var l=getLead(id);
  if(l){l.obs.push({author:"R. Izquierdo",date:nowStr(),type:"user",text:txt});}
  inp.value="";
  var list=document.getElementById("obs-list-"+id);
  if(list){
    var div=document.createElement("div");
    div.className="obs-e";
    div.innerHTML='<div class="obs-meta"><span class="obs-auth">R. Izquierdo</span><span>'+nowStr()+'</span></div><div class="obs-txt">'+esc(txt)+'</div>';
    list.appendChild(div);
    list.scrollTop=list.scrollHeight;
  }
}
function advanceStage(id){
  var l=getLead(id);if(!l)return;
  var max=PIPELINES[l.pipeline].stages.length-1;
  if(l.stage<max){l.stage++;l.days=0;}
  closeModal();refresh();
  setTimeout(function(){checkAndTriggerAutomations(l);},100);
}
function recoverLead(id){
  var l=getLead(id);if(!l)return;
  l.lost=false;l.stage=0;l.lostReason="";
  l.obs.push({author:"Sistema",date:nowStr(),type:"system",text:"Oportunidad recuperada y devuelta a primera etapa."});
  refresh();
  setTimeout(function(){ checkAndTriggerAutomations(l); },150);
}

  showModal(html,true);
}
function editEq(i){
  var row=document.getElementById("eq-row-"+i);
  if(!row)return;
  var cur=comerciales[i];
  row.innerHTML='<input class="eq-inp" id="eq-inp-'+i+'" value="'+esc(cur)+'" onblur="saveEq('+i+')" onkeydown="if(event.key===\'Enter\')saveEq('+i+')">'
    +'<button class="btn btn-outline btn-sm" onclick="saveEq('+i+')">&#10003; OK</button>';
  var inp=document.getElementById("eq-inp-"+i);
  if(inp)inp.focus();
}
function saveEq(i){
  var inp=document.getElementById("eq-inp-"+i);
  if(inp&&inp.value.trim())comerciales[i]=inp.value.trim();
  renderEquipoModal();
}
function removeEq(i){ comerciales.splice(i,1); renderEquipoModal(); }
function addEq(){
  var inp=document.getElementById("eq-new");
  if(inp&&inp.value.trim()){comerciales.push(inp.value.trim());}
  renderEquipoModal();
}

function exportPDF(opts){
  if(!opts) opts={kpis:true,alerts:true,funnel:true,opps:true,comercial:true,activity:false,lost:true,traceability:false};
  var active=leads.filter(function(l){return !l.lost;});
  var lostAll=leads.filter(function(l){return l.lost;});
  var eco=active.filter(function(l){return PIPELINES[l.pipeline].economic&&l.importe;});
  var total=eco.reduce(function(s,l){return s+l.importe;},0);
  var weighted=eco.reduce(function(s,l){var p=getProb(l);return s+(p!=null?l.importe*p/100:0);},0);
  var lostTotal=lostAll.filter(function(l){return l.importe;}).reduce(function(s,l){return s+l.importe;},0);
  var pm=total>0?Math.round(weighted/total*100):0;

  var css = "body{font-family:Calibri,Arial,sans-serif;padding:28px;color:#040D17;font-size:12px;}"
    +".hdr{background:#0C5580;color:#fff;padding:14px 22px;margin:-28px -28px 20px;border-bottom:3px solid #BC262E;display:flex;justify-content:space-between;align-items:center;}"
    +".krow{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;}"
    +".kc{background:#EEF5F7;padding:8px 14px;border-radius:5px;min-width:100px;}"
    +".kv{font-size:16px;font-weight:700;color:#0C5580;}.kl{font-size:9px;color:#757575;text-transform:uppercase;letter-spacing:.04em;margin-top:2px;}"
    +"h2{color:#0C5580;font-size:13px;margin:18px 0 6px;padding-bottom:5px;border-bottom:2px solid #B0D1D7;}"
    +"table{width:100%;border-collapse:collapse;font-size:11px;margin-bottom:16px;}"
    +"th{background:#0C5580;color:#fff;padding:6px 8px;text-align:left;font-weight:600;}"
    +"td{padding:5px 8px;border-bottom:1px solid #EEF5F7;vertical-align:top;}"
    +"tr:nth-child(even) td{background:#F7FBFC;}"
    +".alert-box{background:#FFF5F5;border:1px solid #F5C0C0;border-left:4px solid #BC262E;border-radius:5px;padding:8px 12px;margin-bottom:8px;font-size:11px;}"
    +".alert-title{font-weight:700;color:#922B21;margin-bottom:2px;font-size:11px;}"
    +".alert-body{color:#555;}"
    +".obs-block{background:#F7FBFC;border-left:3px solid #0C5580;padding:6px 10px;margin-bottom:5px;border-radius:0 4px 4px 0;}"
    +".obs-meta{font-size:9px;color:#757575;margin-bottom:2px;}"
    +".obs-text{font-size:11px;color:#040D17;}"
    +".obs-block.al{border-left-color:#BC262E;background:#FFF5F5;}"
    +".obs-block.sy{border-left-color:#B0D1D7;background:#f9f9f9;}"
    +".company-block{margin-bottom:16px;padding:12px 14px;border:1px solid #B0D1D7;border-radius:6px;break-inside:avoid;}"
    +".company-title{font-size:13px;font-weight:700;color:#1F4E79;margin-bottom:6px;}"
    +".company-meta{font-size:10px;color:#757575;margin-bottom:8px;}"
    +".funnel-row{display:flex;align-items:center;gap:10px;margin-bottom:6px;}"
    +".funnel-bar-wrap{flex:1;background:#EEF5F7;border-radius:3px;height:8px;overflow:hidden;}"
    +".funnel-bar{height:100%;background:#0C5580;border-radius:3px;}"
    +".ft{color:#757575;font-size:9px;text-align:center;margin-top:20px;padding-top:10px;border-top:1px solid #B0D1D7;}";

  var w = window.open("","_blank");
  w.document.write("<!DOCTYPE html><html><head><meta charset='utf-8'><title>CRM FIN \u2014 Informe</title><style>"+css+"</style></head><body>");
  w.document.write("<div class='hdr'><strong style='font-size:15px'>CRM Pipeline \u2014 Informe Ejecutivo</strong><span style='font-size:11px;color:#B0D1D7'>Fundaci\u00f3n Industrial Navarra \u00b7 "+new Date().toLocaleDateString("es-ES")+"</span></div>");

  // KPIs
  if(opts.kpis){
    w.document.write("<h2>KPIs ejecutivos</h2><div class='krow'>"
      +"<div class='kc'><div class='kv'>"+active.length+"</div><div class='kl'>Activas</div></div>"
      +"<div class='kc'><div class='kv'>"+fmt(total)+"</div><div class='kl'>Total pipeline</div></div>"
      +"<div class='kc'><div class='kv'>"+fmt(weighted)+"</div><div class='kl'>Ponderado</div></div>"
      +"<div class='kc'><div class='kv'>"+pm+"%</div><div class='kl'>Prob. media</div></div>"
      +"<div class='kc'><div class='kv'>"+lostAll.length+"</div><div class='kl'>Perdidas</div></div>"
      +"<div class='kc'><div class='kv'>"+fmt(lostTotal)+"</div><div class='kl'>Importe perdido</div></div>"
      +"</div>");
  }

  // ALERTS
  if(opts.alerts){
    var overdueLeads = active.filter(function(l){ return isOverdue(l); });
    var p2NoP3 = active.filter(function(l){
      if(l.pipeline!=="P2"||l.days<21)return false;
      return !leads.find(function(x){return x.pipeline==="P3"&&x.company===l.company&&!x.lost;});
    });
    var pendingAuto = notifications.filter(function(n){ return n.type==="automation"&&!n.read; });
    if(overdueLeads.length>0||p2NoP3.length>0||pendingAuto.length>0){
      w.document.write("<h2>\u26a0 Alertas activas</h2>");
      overdueLeads.forEach(function(l){
        var st=PIPELINES[l.pipeline].stages[l.stage];
        var maxD=getMaxDays(l.pipeline,l.stage);
        w.document.write("<div class='alert-box'><div class='alert-title'>Retraso \u00b7 "+esc(l.pipeline)+" \u00b7 "+esc(l.company)+"</div>"
          +"<div class='alert-body'>"+l.days+" d\u00edas en \""+esc(st?st.label:"")+"\" (m\u00e1x. "+maxD+"d) \u00b7 Comercial: "+esc(l.comercial)+"</div></div>");
      });
      p2NoP3.forEach(function(l){
        w.document.write("<div class='alert-box'><div class='alert-title'>P2 sin P3 \u00b7 "+esc(l.company)+"</div>"
          +"<div class='alert-body'>"+l.days+" d\u00edas en onboarding sin oportunidad de formaci\u00f3n activa \u00b7 Comercial: "+esc(l.comercial)+"</div></div>");
      });
      if(overdueLeads.length===0&&p2NoP3.length===0){
        w.document.write("<p style='color:#757575;font-size:11px'>No hay alertas de retraso activas.</p>");
      }
    } else {
      w.document.write("<h2>\u26a0 Alertas activas</h2><p style='color:#757575;font-size:11px'>\u2713 Sin alertas activas en este momento.</p>");
    }

  // FUNNEL BY STAGE
  if(opts.funnel){

      var pLeads=active.filter(function(l){return l.pipeline===p.id;});

      var pTotal=p.economic?pLeads.reduce(function(s,l){return s+(l.importe||0);},0):null;
      w.document.write("<div style='margin-bottom:12px'><div style='font-weight:700;font-size:12px;color:#0C5580;margin-bottom:5px'>"+p.id+" \u00b7 "+esc(p.label)+(pTotal!=null?" \u00b7 "+fmt(pTotal):"")+"</div>");
      p.stages.forEach(function(stage){
        var sl=pLeads.filter(function(l){return l.stage===stage.id;});
        if(sl.length===0)return;
        var stageImp=p.economic?sl.reduce(function(s,l){return s+(l.importe||0);},0):null;
        var pct2=Math.round(sl.length/pLeads.length*100);
        w.document.write("<div class='funnel-row'>"
          +"<div style='width:160px;font-size:10px;color:#040D17'>"+(stage.id+1)+". "+esc(stage.label)+"</div>"
          +"<div class='funnel-bar-wrap'><div class='funnel-bar' style='width:"+pct2+"%'></div></div>"
          +"<div style='width:70px;font-size:10px;color:#0C5580;font-weight:700;text-align:right'>"+sl.length+" op."+(stageImp!=null?" / "+fmt(stageImp):"")+"</div>"
          +"</div>");
      });

    });
  }

  // ACTIVE OPPS TABLE
  if(opts.opps){
    var rows=active.map(function(l){
      var p=PIPELINES[l.pipeline];var st=p.stages[l.stage];var prob=getProb(l);
      var pond=p.economic&&l.importe&&prob!=null?l.importe*prob/100:null;
      var overdue=isOverdue(l)?"style='color:#C0392B;font-weight:700'":"";

        +"<td>"+esc(l.comercial)+"</td>"
        +"<td style='text-align:right'>"+(p.economic?fmt(l.importe):"&mdash;")+"</td>"
        +"<td style='text-align:right'>"+(prob!=null?prob+"%":"&mdash;")+"</td>"
        +"<td style='text-align:right'>"+(pond!=null?fmt(pond):"&mdash;")+"</td>"
        +"<td "+overdue+">"+l.days+"d"+(isOverdue(l)?" \u26a0":"")+"</td></tr>";
    }).join("");
    w.document.write("<h2>Oportunidades activas</h2><table><thead><tr><th>Empresa</th><th>Pipeline</th><th>Etapa</th><th>Comercial</th><th>Importe</th><th>Prob.</th><th>Ponderado</th><th>D\u00edas</th></tr></thead><tbody>"+rows+"</tbody></table>");
  }

  // COMERCIAL PERFORMANCE
  if(opts.comercial){
    var byC={};
    active.forEach(function(l){
      if(!byC[l.comercial])byC[l.comercial]={n:0,imp:0,pond:0,lost:0};
      byC[l.comercial].n++;
      var p=PIPELINES[l.pipeline];
      if(p.economic&&l.importe){byC[l.comercial].imp+=l.importe;var pr=getProb(l);if(pr!=null)byC[l.comercial].pond+=l.importe*pr/100;}
    });
    lostAll.forEach(function(l){if(!byC[l.comercial])byC[l.comercial]={n:0,imp:0,pond:0,lost:0};byC[l.comercial].lost++;});
    var cRows=Object.entries(byC).sort(function(a,b){return b[1].imp-a[1].imp;}).map(function(e){
      var conv=e[1].imp>0?Math.round(e[1].pond/e[1].imp*100):0;
      return "<tr><td>"+esc(e[0])+"</td><td style='text-align:center'>"+e[1].n+"</td><td style='text-align:right'>"+fmt(e[1].imp)+"</td><td style='text-align:right'>"+fmt(e[1].pond)+"</td><td style='text-align:center'>"+conv+"%</td><td style='text-align:center;color:#BC262E'>"+e[1].lost+"</td></tr>";
    }).join("");
    w.document.write("<h2>Rendimiento por comercial</h2><table><thead><tr><th>Comercial</th><th>Activas</th><th>Importe total</th><th>Ponderado</th><th>% Conversi\u00f3n</th><th>Perdidas</th></tr></thead><tbody>"+cRows+"</tbody></table>");
  }

  // RECENT ACTIVITY
  if(opts.activity){
    var recent = active.filter(function(l){
      return l.obs && l.obs.some(function(o){ return o.type==="user"; });
    }).slice(0,15);
    if(recent.length>0){
      var aRows=recent.map(function(l){
        var lastObs=l.obs.filter(function(o){return o.type==="user";}).slice(-1)[0];
        return "<tr><td>"+esc(l.company)+"</td><td>"+esc(PIPELINES[l.pipeline].label)+"</td><td>"+esc(l.comercial)+"</td>"
          +"<td>"+esc(lastObs?lastObs.date:"")+"</td><td>"+esc(lastObs?lastObs.text:"")+"</td></tr>";
      }).join("");
      w.document.write("<h2>Actividad reciente</h2><table><thead><tr><th>Empresa</th><th>Pipeline</th><th>Comercial</th><th>Fecha</th><th>\u00daltima observaci\u00f3n</th></tr></thead><tbody>"+aRows+"</tbody></table>");
    }
  }

  // LOST WITH ANALYSIS
  if(opts.lost && lostAll.length>0){
    var lostReasons={};
    lostAll.forEach(function(l){var r=l.lostReason||"Sin especificar";if(!lostReasons[r])lostReasons[r]=0;lostReasons[r]++;});
    var reasonsHtml=Object.entries(lostReasons).sort(function(a,b){return b[1]-a[1];}).map(function(e){
      return "<tr><td>"+esc(e[0])+"</td><td style='text-align:center;font-weight:700;color:#BC262E'>"+e[1]+"</td></tr>";
    }).join("");
    var lostRows=lostAll.map(function(l){
      return "<tr style='background:#FFF5F5'><td>"+esc(l.company)+"</td><td>"+esc(PIPELINES[l.pipeline].label)+"</td>"
        +"<td>"+esc(l.comercial)+"</td><td style='text-align:right'>"+fmt(l.importe)+"</td><td>"+esc(l.lostReason||"&mdash;")+"</td></tr>";
    }).join("");
    w.document.write("<h2>Oportunidades perdidas</h2>"
      +"<table><thead><tr><th>Motivo</th><th>Frecuencia</th></tr></thead><tbody>"+reasonsHtml+"</tbody></table>"
      +"<table><thead><tr><th>Empresa</th><th>Pipeline</th><th>Comercial</th><th>Importe</th><th>Motivo</th></tr></thead><tbody>"+lostRows+"</tbody></table>");
  }

  // TRACEABILITY
  if(opts.traceability){
    w.document.write("<h2>Trazabilidad de observaciones</h2>");
    active.forEach(function(l){
      if(!l.obs||l.obs.length===0)return;
      var p=PIPELINES[l.pipeline];var st=p.stages[l.stage];
      var prob=getProb(l);
      w.document.write("<div class='company-block'>"
        +"<div class='company-title'>"+esc(l.company)+"</div>"
        +"<div class='company-meta'>"+esc(p.label)+" \u00b7 Etapa: "+esc(st?st.label:"")+" \u00b7 Comercial: "+esc(l.comercial)
        +(p.economic&&l.importe?" \u00b7 Importe: "+fmt(l.importe):"")
        +(prob!=null?" \u00b7 Prob.: "+prob+"%":"")+"</div>");
      l.obs.forEach(function(o){
        var cls=o.type==="system"?"sy":o.type==="alert"?"al":"";
        w.document.write("<div class='obs-block "+cls+"'>"
          +"<div class='obs-meta'>"+esc(o.author)+" \u00b7 "+esc(o.date)+(o.type==="system"?" \u00b7 AUTO":o.type==="alert"?" \u00b7 ALERTA":"")+"</div>"
          +"<div class='obs-text'>"+esc(o.text)+"</div></div>");
      });
      w.document.write("</div>");
    });
  }

  w.document.write("<div class='ft'>Fundaci\u00f3n Industrial Navarra \u00b7 fundacionindustrialnavarra.com \u00b7 "+new Date().toLocaleDateString("es-ES")+"</div>");
  w.document.write("<scr"+"ipt>window.onload=function(){window.print()};<\/scr"+"ipt></body></html>");
  w.document.close();
}

// ============================================================
function checkAndTriggerAutomations(lead) {
  var pipeline = PIPELINES[lead.pipeline];
  var stage = pipeline.stages[lead.stage];
  if(!stage) return;

  // P1 -> P2: When reaching last stage (Asociada)
  if(lead.pipeline === "P1" && lead.stage === pipeline.stages.length - 1) {
    var alreadyInP2 = leads.find(function(l){ return l.pipeline==="P2" && l.company===lead.company && !l.lost; });
    if(!alreadyInP2) {
      leads.push({
        id: nextId++, pipeline:"P2", company:lead.company, sector:lead.sector,
        stage:0, days:0, comercial:lead.comercial, importe:null, probCustom:null,
        contact:lead.contact, lost:false, lostReason:"",
        obs:[{author:"Sistema",date:nowStr(),type:"system",text:"Ficha creada automáticamente al cerrar P1 como Asociada. Inicio del proceso de onboarding."}]
      });
      showAutomationAlert("P1 → P2", lead.company + " ha sido añadida automáticamente al pipeline de Onboarding (P2) en la primera etapa.");
    }
  }

  // P2 paso 3 (Mesas activadas) -> suggest P4
  if(lead.pipeline === "P2" && lead.stage === 3) {
    var alreadyInP4 = leads.find(function(l){ return l.pipeline==="P4" && l.company===lead.company && !l.lost; });
    if(!alreadyInP4) {
      showAutomationConfirm(
        "P2 → P4",
        lead.company + " ha activado Mesas (P2 paso 3). ¿Deseas abrir una oportunidad de Captación FIINCA (P4) para esta empresa?",
        function() {
          leads.push({
            id: nextId++, pipeline:"P4", company:lead.company, sector:lead.sector,
            stage:0, days:0, comercial:lead.comercial, importe:3200, probCustom:null,
            contact:lead.contact, lost:false, lostReason:"",
            obs:[{author:"Sistema",date:nowStr(),type:"system",text:"Oportunidad P4 abierta automáticamente desde P2 paso 3 (Mesas activadas)."}]
          });
          refresh();
        }
      );
    }
  }

  // P3 empresa no asociada -> suggest P1
  if(lead.pipeline === "P3") {
    var inP1 = leads.find(function(l){ return l.pipeline==="P1" && l.company===lead.company && !l.lost; });
    var closedP1 = leads.find(function(l){ return l.pipeline==="P1" && l.company===lead.company && l.stage===6; });
    if(!inP1 && !closedP1) {
      showAutomationConfirm(
        "P3 → P1",
        lead.company + " está en Venta Formación (P3) pero no está en el pipeline de Captación Asociada. ¿Deseas abrir una oportunidad en P1?",
        function() {
          leads.push({
            id: nextId++, pipeline:"P1", company:lead.company, sector:lead.sector,

// ---- Pipeline stage editing functions ----
function renameStage(pid, idx, val){
  if(PIPELINES[pid]&&PIPELINES[pid].stages[idx]) PIPELINES[pid].stages[idx].label=val.trim()||PIPELINES[pid].stages[idx].label;
}
function removeStage(pid, idx){
  var p=PIPELINES[pid]; if(!p||p.stages.length<=1)return;
  p.stages.splice(idx,1);
  // Re-index ids
  p.stages.forEach(function(s,i){s.id=i;});
  // Clamp leads stage
  leads.forEach(function(l){if(l.pipeline===pid&&l.stage>=p.stages.length)l.stage=p.stages.length-1;});
  renderConfig();
}
function addStage(pid){
  var p=PIPELINES[pid]; if(!p)return;
  var lastProb=p.stages.length>0?p.stages[p.stages.length-1].prob:null;
  var newId=p.stages.length;
  var newLabel="Nueva etapa "+(newId+1);
  p.stages.push({id:newId,label:newLabel,short:newLabel,prob:p.economic?lastProb:null});
  if(!stageConfig[pid]) stageConfig[pid]=[];
  stageConfig[pid][newId]=14;
  renderConfig();
}
window.renameStage=renameStage;
window.removeStage=removeStage;
window.addStage=addStage;

// ---- Stage probability functions ----
function setStageProbability(pid, stageId, val){
  if(PIPELINES[pid]&&PIPELINES[pid].stages[stageId]!=null)
    PIPELINES[pid].stages[stageId].prob=Math.min(100,Math.max(0,Number(val)||0));
  renderKPIs();
}
window.setStageProbability=setStageProbability;

// ---- Income concept management functions ----
function renameConcepto(idx,val){
  var old=conceptosIngreso[idx];
  var newVal=val.trim();
  if(!newVal)return;
  conceptosIngreso[idx]=newVal;
  // Update leads
  leads.forEach(function(l){if(l.concepto===old)l.concepto=newVal;});
  // Update conceptosConMatriculas
  var mi=conceptosConMatriculas.indexOf(old);
  if(mi!==-1) conceptosConMatriculas[mi]=newVal;
}
function toggleConceptoMat(idx,checked){
  var c=conceptosIngreso[idx];
  var mi=conceptosConMatriculas.indexOf(c);
  if(checked&&mi===-1) conceptosConMatriculas.push(c);
  if(!checked&&mi!==-1) conceptosConMatriculas.splice(mi,1);
}
function removeConcepto(idx){
  var c=conceptosIngreso[idx];
  conceptosIngreso.splice(idx,1);
  var mi=conceptosConMatriculas.indexOf(c);
  if(mi!==-1) conceptosConMatriculas.splice(mi,1);
  renderConfig();
}
function addConcepto(){
  var inp=document.getElementById("new-concepto-inp");
  var chk=document.getElementById("new-concepto-mat");
  if(!inp||!inp.value.trim())return;
  var newC=inp.value.trim();
  if(conceptosIngreso.indexOf(newC)===-1){
    conceptosIngreso.push(newC);
    if(chk&&chk.checked) conceptosConMatriculas.push(newC);
  }
  renderConfig();
}
window.renameConcepto=renameConcepto;
window.toggleConceptoMat=toggleConceptoMat;
window.removeConcepto=removeConcepto;
window.addConcepto=addConcepto;

function setMaxDays(pipelineId, stageId, val) {
  if(!stageConfig[pipelineId]) stageConfig[pipelineId] = [];
  stageConfig[pipelineId][stageId] = Number(val) || 14;

}
