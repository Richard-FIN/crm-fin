function checkAndTriggerAutomations(lead) {
  var pipeline = PIPELINES[lead.pipeline];
  var stage = pipeline.stages[lead.stage];
  if(!stage) return;

  // P1 -> P2: When reaching last stage (Asociada)
  if(lead.pipeline === "P1" && lead.stage === pipeline.stages.length - 1) {
    var alreadyInP2 = leads.find(function(l){ return l.pipeline==="P2" && l.company===lead.company && !l.lost; });
    if(!alreadyInP2) {
      var newP2 = {
        pipeline:"P2", company:lead.company, sector:lead.sector,
        stage:0, days:0, comercial:lead.comercial, importe:null, probCustom:null,
        concepto:null, matriculas:null, contact:lead.contact, lost:false, lostReason:"",
        obs:[{author:"Sistema",date:nowStr(),type:"system",text:"Ficha creada automáticamente al cerrar P1 como Asociada. Inicio del proceso de onboarding."}]
      };
      stampLeadStageEntry(newP2,todayISO());
      sbPost("leads", leadToDb(newP2)).then(function(rows){
        var saved=Array.isArray(rows)?rows[0]:rows;
        if(saved&&saved.id){ newP2.id=saved.id; leads.push(newP2); refresh(); }
      });
      showAutomationAlert("P1 -> P2", lead.company + " ha sido añadida automáticamente al pipeline de Onboarding (P2) en la primera etapa.");
    }
  }

  // P2 paso 3 (Mesas activadas) -> suggest P4
  if(lead.pipeline === "P2" && lead.stage === 3) {
    var alreadyInP4 = leads.find(function(l){ return l.pipeline==="P4" && l.company===lead.company && !l.lost; });
    if(!alreadyInP4) {
      showAutomationConfirm(
        "P2 -> P4",
        lead.company + " ha activado Mesas (P2 paso 3). ¿Deseas abrir una oportunidad de Captación FIINCA (P4) para esta empresa?",
        function() {
          var newP4={
            pipeline:"P4", company:lead.company, sector:lead.sector,
            stage:0, days:0, comercial:lead.comercial, importe:3200, probCustom:null,
            concepto:"Directivo FIINCA", matriculas:null, contact:lead.contact, lost:false, lostReason:"",
            obs:[{author:"Sistema",date:nowStr(),type:"system",text:"Oportunidad P4 abierta automáticamente desde P2 paso 3 (Mesas activadas)."}]
          };
          stampLeadStageEntry(newP4,todayISO());
          sbPost("leads", leadToDb(newP4)).then(function(rows){
            var saved=Array.isArray(rows)?rows[0]:rows;
            if(saved&&saved.id){ newP4.id=saved.id; leads.push(newP4); refresh(); }
          });
        }
      );
    }
  }

  // P3 empresa no asociada -> suggest P1
  if(lead.pipeline === "P3") {
    var inP1 = leads.find(function(l){ return l.pipeline==="P1" && l.company===lead.company && !l.lost; });
    var closedP1 = leads.find(function(l){ return l.pipeline==="P1" && l.company===lead.company && l.stage===6; });
    if(!inP1 && !closedP1) {
      showAutomationConfirm(
        "P3 -> P1",
        lead.company + " está en Venta Formación (P3) pero no está en el pipeline de Captación Asociada. ¿Deseas abrir una oportunidad en P1?",
        function() {
          var newP1={
            pipeline:"P1", company:lead.company, sector:lead.sector,
            stage:0, days:0, comercial:lead.comercial, importe:4800, probCustom:null,
            concepto:"Captación", matriculas:null, contact:lead.contact, lost:false, lostReason:"",
            obs:[{author:"Sistema",date:nowStr(),type:"system",text:"Oportunidad P1 sugerida automáticamente desde P3. Empresa activa en formación sin ser asociada."}]
          };
          stampLeadStageEntry(newP1,todayISO());
          sbPost("leads", leadToDb(newP1)).then(function(rows){
            var saved=Array.isArray(rows)?rows[0]:rows;
            if(saved&&saved.id){ newP1.id=saved.id; leads.push(newP1); refresh(); }
          });
        }
      );
    }
  }
}

function setAnnualObjective(area,key,val){
  if(!annualObjectives[area])annualObjectives[area]={};
  annualObjectives[area][key]=Number(val)||0;
  annualObjectives=mergeAnnualObjectives(annualObjectives);
  sbPatchConfig("annualObjectives", annualObjectives);
  renderKPIs();
  if(currentView==="dashboard")renderDashboard();

function setAnnualObjectiveMeta(area,key,val){
  if(!annualObjectives[area])annualObjectives[area]={};
  annualObjectives[area][key]=String(val||"");
  annualObjectives=mergeAnnualObjectives(annualObjectives);
  sbPatchConfig("annualObjectives", annualObjectives);
  renderKPIs();
  if(currentView==="dashboard")renderDashboard();
  if(currentView==="config")renderConfig();
}

function setActivityObjective(scope,key,val){
  if(!activityObjectives[scope])activityObjectives[scope]={};
  activityObjectives[scope][key]=key==="mediaNotasMin"?(parseFloat(val)||0):(Number(val)||0);
  activityObjectives=mergeActivityObjectives(activityObjectives);
  sbPatchConfig("activityObjectives",activityObjectives);
  renderKPIs();
  if(currentView==="dashboard")renderDashboard();
  if(currentView==="config")renderConfig();
}
function actObjInput(scope,key,label,step){

    +'<input class="objective-input" type="number" min="0" step="'+(step||1)+'" value="'+val+'" onchange="setActivityObjective(\''+scope+'\',\''+key+'\',this.value)">'
    +'</div>';

function actObjInputDec(scope,key,label){

// ---- Program edition management functions ----
function addProgramEdition(programIdx){
  var program=trainingEditionPrograms[programIdx];
  var inp=document.getElementById("new-edition-"+programIdx);
  var name=inp?String(inp.value||"").trim():"";
  if(!program||!name)return;
  if(programEditions.some(function(e){return normKey(e.program)===normKey(program)&&normKey(e.name)===normKey(name);}))return;
  var id=editionIdFromName(program+" "+name);
  var suffix=2;
  var base=id;
  while(programEditions.some(function(e){return normKey(e.id)===normKey(id);}))id=base+"-"+(suffix++);
  programEditions.push({id:id,program:program,name:name});
  persistProgramEditions();
  renderConfig();
}
function renameProgramEdition(id,val){
  var e=getProgramEdition(id);
  if(!e)return;
  var name=String(val||"").trim();
  if(!name){renderConfig();return;}
  e.name=name;
  persistProgramEditions();
  renderKPIs();
  if(currentView==="dashboard")renderDashboard();
}
function removeProgramEdition(id){
  var key=normKey(id);
  programEditions=programEditions.filter(function(e){return normKey(e.id)!==key;});
  persistProgramEditions();
  leads.forEach(function(l){
    if(l.pipeline!=="P3")return;
    var ids=getLeadProgramEditionIds(l).filter(function(x){return normKey(x)!==key;});
    if(ids.length!==getLeadProgramEditionIds(l).length){
      setLeadProgramEditionsMeta(l,ids);
      sbPatch("leads",l.id,{obs:l.obs});
    }
  });
  renderMain();
}
window.addProgramEdition=addProgramEdition;
window.renameProgramEdition=renameProgramEdition;
window.removeProgramEdition=removeProgramEdition;

// ---- Pipeline stage editing functions ----
function renameStage(pid, idx, val){
  var p=PIPELINES[pid];
  if(!p||!p.stages[idx]) return;
  var next=stageShortLabel(val||p.stages[idx].label);
  p.stages[idx].label=next;
  p.stages[idx].short=next;
  persistPipelineStages();
  renderNav();
  renderConfig();
}
function removeStage(pid, idx){
  var p=PIPELINES[pid]; if(!p||p.stages.length<=1)return;
  p.stages.splice(idx,1);
  // Re-index ids
  p.stages.forEach(function(s,i){s.id=i;});
  if(stageConfig[pid]) stageConfig[pid].splice(idx,1);
  normalizeAllStageConfig();
  // Move affected opportunities to the matching new stage index
  leads.forEach(function(l){
    if(l.pipeline!==pid || l.lost || l.stage<0) return;
    var oldStage=l.stage;
    if(l.stage===idx) l.stage=Math.min(idx,p.stages.length-1);
    else if(l.stage>idx) l.stage--;
    if(l.stage!==oldStage) sbPatch("leads",l.id,{stage:l.stage});
  });
  persistPipelineStages();
  sbPatchConfig("stageConfig", stageConfig);
  renderNav();
  renderConfig();
}
function addStage(pid){
  var p=PIPELINES[pid]; if(!p)return;
  var lastProb=p.stages.length>0?p.stages[p.stages.length-1].prob:null;
  var newId=p.stages.length;
  var newLabel="Nueva etapa "+(newId+1);
  p.stages.push({id:newId,label:newLabel,short:newLabel,prob:p.economic?lastProb:null});
  if(!stageConfig[pid]) stageConfig[pid]=[];
  stageConfig[pid][newId]=14;
  normalizeAllStageConfig();
  persistPipelineStages();
  sbPatchConfig("stageConfig", stageConfig);
  renderNav();
  renderConfig();
}
window.renameStage=renameStage;
window.removeStage=removeStage;
window.addStage=addStage;

// ---- Stage probability functions ----
function setStageProbability(pid, stageId, val){
  if(PIPELINES[pid]&&PIPELINES[pid].stages[stageId]!=null)
    PIPELINES[pid].stages[stageId].prob=Math.min(100,Math.max(0,Number(val)||0));
  // Persist pipeline stage probs as config
  persistPipelineStages();
  renderKPIs();
}
window.setStageProbability=setStageProbability;

// ---- Income concept management functions ----
function renameConcepto(idx,val){
  var old=conceptosIngreso[idx];
  var newVal=val.trim();
  if(!newVal)return;
  conceptosIngreso[idx]=newVal;
  leads.forEach(function(l){
    var details=leadConceptDetails(l);
    var changed=false;
    details.forEach(function(d){if(normKey(d.concepto)===normKey(old)){d.concepto=newVal;changed=true;}});
    if(changed){
      var ser=serializeConceptDetails(details);
      l.concepto=ser.concepto;
      l.matriculas=ser.matriculas;
      recalcLeadIncomeFromConcepts(l);
      sbPatch("leads",l.id,{concepto:l.concepto,matriculas:l.matriculas,importe:l.importe});
    }
  });
  var mi=conceptosConMatriculas.indexOf(old);
  if(mi!==-1) conceptosConMatriculas[mi]=newVal;
  var oldKey=Object.keys(importesConcepto).find(function(k){return normKey(k)===normKey(old);});
  if(oldKey!=null){ importesConcepto[newVal]=importesConcepto[oldKey]; delete importesConcepto[oldKey]; }
  sbPatchConfig("conceptosIngreso", conceptosIngreso);
  sbPatchConfig("conceptosConMatriculas", conceptosConMatriculas);
  sbPatchConfig("importesConcepto", importesConcepto);
}
function setConceptImporte(idx,val){
  var c=conceptosIngreso[idx];
  if(!c)return;
  if(val===""||val==null)delete importesConcepto[c];
  else importesConcepto[c]=Number(val)||0;
  sbPatchConfig("importesConcepto", importesConcepto);
  leads.forEach(function(l){
    if(leadConceptDetails(l).some(function(d){return normKey(d.concepto)===normKey(c);})){
      recalcLeadIncomeFromConcepts(l);
      sbPatch("leads",l.id,{importe:l.importe,matriculas:l.matriculas});
    }
  });
  renderKPIs();
  if(currentView==="pricing")renderPricing();
}
function toggleConceptoMat(idx,checked){
  var c=conceptosIngreso[idx];
  var mi=conceptosConMatriculas.indexOf(c);
  if(checked&&mi===-1) conceptosConMatriculas.push(c);
  if(!checked&&mi!==-1) conceptosConMatriculas.splice(mi,1);
  sbPatchConfig("conceptosConMatriculas", conceptosConMatriculas);
}
function removeConcepto(idx){
  var c=conceptosIngreso[idx];
  conceptosIngreso.splice(idx,1);
  var mi=conceptosConMatriculas.indexOf(c);
  if(mi!==-1) conceptosConMatriculas.splice(mi,1);
  delete importesConcepto[c];
  sbPatchConfig("conceptosIngreso", conceptosIngreso);
  sbPatchConfig("conceptosConMatriculas", conceptosConMatriculas);
  sbPatchConfig("importesConcepto", importesConcepto);
  renderMain();
}
function addConcepto(){
  var inp=document.getElementById("new-concepto-inp");
  var chk=document.getElementById("new-concepto-mat");
  if(!inp||!inp.value.trim())return;
  var newC=inp.value.trim();
  if(conceptosIngreso.indexOf(newC)===-1){
    conceptosIngreso.push(newC);
    if(chk&&chk.checked) conceptosConMatriculas.push(newC);
  }
  sbPatchConfig("conceptosIngreso", conceptosIngreso);
  sbPatchConfig("conceptosConMatriculas", conceptosConMatriculas);
  renderConfig();
}
window.renameConcepto=renameConcepto;
window.setConceptImporte=setConceptImporte;
window.toggleConceptoMat=toggleConceptoMat;
window.removeConcepto=removeConcepto;
window.addConcepto=addConcepto;
