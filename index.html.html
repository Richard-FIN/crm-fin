<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CRM Pipeline - Fundación Industrial Navarra</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;font-family:"Calibri","Segoe UI","Helvetica Neue",Arial,sans-serif;background:#EEF5F7;color:#040D17;font-size:clamp(13px,1vw,16px);}
:root{--fp:#0C5580;--fm:#25618B;--fl:#B0D1D7;--fb:#EEF5F7;--fd:#040D17;--fr:#BC262E;--fn:#1F4E79;--fmu:#757575;}
#wrap{display:flex;flex-direction:column;min-height:100vh;}
.hdr{background:var(--fp);padding:10px clamp(12px,2vw,32px);display:flex;align-items:center;justify-content:space-between;border-bottom:3px solid var(--fr);flex-wrap:wrap;gap:8px;}
.hdr-left{display:flex;align-items:center;gap:14px;}
.hdr-logo{height:38px;}
.hdr-title{color:#fff;font-weight:700;font-size:17px;line-height:1.2;}
.hdr-sub{color:#B0D1D7;font-size:11px;margin-top:2px;}
.hdr-right{display:flex;gap:8px;}
.nav{background:var(--fp);padding:5px clamp(12px,2vw,32px);display:flex;gap:6px;border-bottom:1px solid var(--fm);flex-wrap:wrap;}
.kpibar{display:none;}
.home-shortcuts{background:#fff;border-bottom:1px solid var(--fl);padding:10px clamp(12px,2vw,32px);display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.home-shortcuts-label{font-size:10px;color:var(--fmu);font-weight:800;text-transform:uppercase;letter-spacing:.06em;margin-right:4px;}
.home-shortcuts .btn{min-height:30px;}
.kpi-row{display:flex;gap:8px;min-width:max-content;}
.kpi-row.empresas .kpi{border-color:rgba(176,209,215,.45);background:rgba(176,209,215,.12);}
.kpi-row.formacion .kpi{border-color:rgba(29,158,117,.42);background:rgba(29,158,117,.14);}
.kpi-row.total .kpi{border-color:rgba(255,255,255,.18);background:rgba(255,255,255,.10);}
.kpi-area{min-width:118px;border-radius:6px;padding:4px 10px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:#fff;}
.kpi-row.empresas .kpi-area{background:#1F4E79;}
.kpi-row.formacion .kpi-area{background:#1D9E75;}
.kpi-row.total .kpi-area{background:#BC262E;}
.kpi{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);border-radius:6px;padding:4px clamp(10px,1.2vw,18px);text-align:center;flex:1 0 auto;min-width:112px;}
.kpi-v{color:#fff;font-size:clamp(14px,1.2vw,20px);font-weight:700;line-height:1;}
.kpi-v.red{color:#F5A0A0;}
.kpi-v.ok{color:#6ee7b7;}.kpi-v.warn{color:#fcd34d;}.kpi-v.over{color:#c4b5fd;}
.kpi-row.actividad .kpi{border-color:rgba(167,139,250,.4);background:rgba(167,139,250,.12);}
.kpi-row.actividad .kpi-area{background:#5b21b6;}
.kpi-bar{height:3px;border-radius:2px;background:rgba(255,255,255,.15);margin-top:5px;}
.kpi-bar-fill{height:100%;border-radius:2px;}
.kpi-bar-fill.ok{background:#6ee7b7;}.kpi-bar-fill.warn{background:#fcd34d;}.kpi-bar-fill.bad{background:#f87171;}.kpi-bar-fill.over{background:#c4b5fd;}
.kpi-l{color:#B0D1D7;font-size:9px;text-transform:uppercase;letter-spacing:.05em;margin-top:2px;}
.main{flex:1;padding:clamp(12px,1.5vw,24px) clamp(12px,2vw,32px);overflow-y:auto;}
.btn{border:none;border-radius:5px;padding:6px 14px;font-size:12px;cursor:pointer;font-family:inherit;font-weight:600;transition:opacity .15s;}
.btn:hover{opacity:.85;}
.btn-primary{background:var(--fp);color:#fff;}
.btn-danger{background:var(--fr);color:#fff;}
.btn-ghost{background:rgba(255,255,255,.08);color:#fff;border:1px solid rgba(255,255,255,.25);}
.btn-ghost.active{background:rgba(255,255,255,.25);border-color:rgba(255,255,255,.5);}
.btn-outline{background:var(--fb);color:var(--fp);border:1px solid var(--fl);}
.btn-lostout{background:#FFF0F0;color:var(--fr);border:1px solid #F5C0C0;}
.btn-sm{padding:4px 10px;font-size:11px;}
.kanban{display:flex;gap:clamp(6px,0.8vw,14px);align-items:stretch;width:100%;}
.kcol{flex:1;min-width:0;display:flex;flex-direction:column;}
.kcol.lost-col{flex:0 0 clamp(160px,14vw,240px);}
.kcol.baja-col{flex:0 0 clamp(180px,16vw,260px);}
.kanban.uniform-cols .kcol,
.kanban.uniform-cols .kcol.lost-col,
.kanban.uniform-cols .kcol.baja-col{flex:1 1 0;min-width:0;}
.col-hdr{background:var(--fp);color:#fff;font-size:clamp(8px,0.7vw,11px);font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding:6px clamp(6px,0.6vw,10px);border-radius:6px 6px 0 0;display:flex;justify-content:space-between;align-items:center;}
.col-hdr.lost{background:#C0392B;}
.col-hdr.baja{background:#7B0000;}
.col-badge{background:rgba(255,255,255,.22);border-radius:8px;padding:1px 7px;font-size:10px;font-weight:700;}
.col-body{border:1px solid var(--fl);border-top:none;border-radius:0 0 6px 6px;padding:clamp(4px,0.5vw,8px) clamp(4px,0.4vw,6px);flex:1;min-height:80px;max-height:calc(100vh - 230px);overflow-y:auto;overscroll-behavior:contain;display:flex;flex-direction:column;gap:5px;background:rgba(12,85,128,.03);transition:background .15s,border .15s;scrollbar-width:thin;scrollbar-color:var(--fl) rgba(12,85,128,.04);}
.col-body::-webkit-scrollbar{width:8px;}
.col-body::-webkit-scrollbar-track{background:rgba(12,85,128,.04);border-radius:0 0 6px 0;}
.col-body::-webkit-scrollbar-thumb{background:var(--fl);border-radius:8px;border:2px solid rgba(12,85,128,.04);}
.col-body::-webkit-scrollbar-thumb:hover{background:var(--fm);}
.col-body.over{background:rgba(12,85,128,.12);border:2px dashed var(--fp);padding:6px 4px;}
.col-body.over-lost{background:rgba(192,57,43,.1);border:2px dashed #C0392B;padding:6px 4px;}
.card{background:#fff;border:1px solid var(--fl);border-left:3px solid var(--fp);border-radius:6px;padding:clamp(6px,0.6vw,10px) clamp(7px,0.7vw,12px);cursor:grab;user-select:none;transition:box-shadow .15s;}
.card:hover{box-shadow:0 2px 10px rgba(12,85,128,.14);}
.card.dragging{opacity:.3;cursor:grabbing;}
.card.warn{border-left-color:#E67E22;}
.card.lostcard{background:#FFF8F8;border-left-color:#C0392B;cursor:pointer;}
.card.bajacard{background:#FFF8F8;border-left-color:#7B0000;cursor:pointer;}
.card-co{font-size:clamp(11px,0.85vw,14px);font-weight:700;color:var(--fn);margin-bottom:2px;}
.card-sec{font-size:clamp(9px,0.7vw,11px);color:var(--fmu);margin-bottom:4px;}
.email-link{color:var(--fp);font-weight:700;text-decoration:none;}
.email-link:hover{text-decoration:underline;}
.mhdr-sub .email-link{color:#fff;}
.email-field-row{display:flex;gap:6px;align-items:center;}
.email-field-row .inp{flex:1;}
.email-open{font-size:10px;color:var(--fp);background:var(--fb);border:1px solid var(--fl);border-radius:4px;padding:5px 8px;text-decoration:none;font-weight:700;white-space:nowrap;}
.email-open:hover{background:#fff;text-decoration:underline;}
.card-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:3px;}
.card-com{font-size:10px;color:var(--fp);}
.card-pip{font-size:9px;background:var(--fb);color:var(--fp);padding:1px 5px;border-radius:5px;font-weight:700;}
.card-bot{display:flex;justify-content:space-between;align-items:center;}
.card-days{font-size:10px;color:var(--fmu);}
.card-days.al{color:#C0392B;font-weight:700;}
.card-prob{font-size:11px;font-weight:700;color:var(--fm);}
.card-prob.cust{color:var(--fr);}
.card-imp{font-size:11px;color:var(--fp);font-weight:700;margin-top:4px;padding-top:4px;border-top:1px solid var(--fl);}
.card-income{font-size:10px;color:var(--fmu);font-weight:600;margin-top:2px;line-height:1.35;}
.card-income strong{color:var(--fp);font-weight:700;}
.cpill{display:inline-block;padding:1px 7px;border-radius:10px;font-size:9px;font-weight:700;color:#fff;margin-right:3px;margin-bottom:1px;letter-spacing:.01em;vertical-align:middle;white-space:nowrap;}
.card-next{font-size:10px;margin-top:4px;padding:3px 6px;border-radius:4px;background:#EEF5F7;color:var(--fp);font-weight:700;}
.card-next.due{background:#FFF0F0;color:#BC262E;border:1px solid #F5C0C0;}
.card-note{font-size:10px;line-height:1.35;color:var(--fd);background:#F7FBFC;border-left:2px solid var(--fl);border-radius:0 4px 4px 0;padding:4px 6px;margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.card-note strong{color:var(--fp);font-weight:700;}
.card-lreason{font-size:10px;color:#922B21;font-style:italic;margin-bottom:4px;}
.add-btn{background:transparent;border:1px dashed var(--fl);border-radius:5px;color:var(--fmu);font-size:20px;cursor:pointer;padding:5px;width:100%;margin-top:2px;font-family:inherit;}
.add-btn.top-add{position:sticky;top:0;z-index:3;background:#fff;margin-top:0;margin-bottom:3px;box-shadow:0 2px 5px rgba(12,85,128,.06);}
.add-btn:hover{background:rgba(12,85,128,.05);}
.kanban-tools{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;flex-wrap:wrap;}
.kanban-search{position:relative;flex:1;min-width:min(100%,260px);max-width:520px;}
.kanban-search input{width:100%;font-size:12px;padding:7px 34px 7px 30px;border:1px solid var(--fl);border-radius:6px;color:var(--fd);background:#fff;outline:none;font-family:inherit;}
.kanban-search input:focus{border-color:var(--fp);box-shadow:0 0 0 2px rgba(12,85,128,.08);}
.kanban-search-ico{position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:12px;color:var(--fmu);}
.kanban-search-clear{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:none;background:transparent;color:var(--fmu);font-size:15px;line-height:1;cursor:pointer;padding:2px 5px;font-family:inherit;}
.kanban-search-count{font-size:10px;color:var(--fmu);text-transform:uppercase;letter-spacing:.04em;}
.kanban-tool-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.recover-btn{font-size:10px;color:var(--fm);background:var(--fb);border:1px solid var(--fl);border-radius:4px;padding:3px 8px;cursor:pointer;width:100%;margin-top:4px;font-family:inherit;}
.rep-p3-btn{font-size:10px;color:#059669;background:#F0FDF4;border:1px solid #A7F3D0;border-radius:4px;padding:3px 8px;cursor:pointer;width:100%;margin-top:4px;font-family:inherit;}
.rep-p3-btn:hover{background:#D1FAE5;}
.cmp-bar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:11px;color:var(--fmu);}
.cmp-lbl{font-weight:600;}
.cmp-btn{font-size:11px;font-family:inherit;color:var(--fp);background:#fff;border:1px solid var(--fl);border-radius:999px;padding:3px 10px;cursor:pointer;}
.cmp-btn:hover{background:#EEF5F7;}
.cmp-btn.on{background:var(--fp);color:#fff;border-color:var(--fp);}
.cmp-inp{width:58px;font-size:11px;font-family:inherit;border:1px solid var(--fl);border-radius:5px;padding:3px 6px;color:var(--fp);}
.fdl{display:inline-block;min-width:30px;margin-left:6px;text-align:left;font-size:10px;font-weight:700;}
.fdl.up{color:#059669;}
.fdl.down{color:#DC2626;}
.card-na{font-size:10px;margin-top:4px;color:var(--fp);line-height:1.3;font-weight:600;}
.card-na.due{color:var(--fr);font-weight:700;}
.card-na.none{color:#D97706;font-style:italic;font-weight:600;}
.na-cur{font-size:12px;color:var(--fp);background:#F0F7FA;border:1px solid var(--fl);border-radius:5px;padding:7px 10px;margin-bottom:6px;line-height:1.4;}
.na-cur.due{color:var(--fr);border-color:#F5B8B8;background:#FFF5F5;}
.na-cur.none{color:#D97706;border-color:#F3D9A4;background:#FFFAF0;font-style:italic;}
.na-cur span{font-weight:400;color:var(--fmu);}
.na-new{background:#F7FBFC;border:1px solid var(--fl);border-radius:6px;padding:10px 12px;margin-top:8px;}
.na-new.err{border-color:var(--fr);background:#FFF5F5;}
.na-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:6px;font-size:11px;color:var(--fmu);}
.na-q{font-size:11px;font-family:inherit;color:var(--fp);background:#fff;border:1px solid var(--fl);border-radius:999px;padding:2px 9px;cursor:pointer;}
.na-q:hover{background:#EEF5F7;}
.obs-na{font-size:11px;color:var(--fp);font-weight:600;margin-top:3px;}
.dc-banner{background:#FFF5F5;border:1px solid #F5B8B8;border-left:4px solid var(--fr);border-radius:6px;padding:10px 12px;margin-bottom:12px;font-size:12px;color:var(--fd);}
.dc-btns{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;}
.dc-item{border:1px solid var(--fl);border-radius:6px;padding:10px 12px;margin-bottom:8px;background:#fff;}
.dc-co{font-size:13px;font-weight:800;color:var(--fp);cursor:pointer;text-decoration:none;}
.dc-co:hover{text-decoration:underline;}
.dc-meta{font-size:10px;color:var(--fmu);margin-left:8px;}
.dc-sub{font-size:11px;color:var(--fmu);margin-top:3px;}
.dc-days{color:var(--fr);font-weight:700;}
.dc-note{font-size:11px;color:#757575;font-style:italic;margin-top:3px;}
#rep-p3-popup button:hover{background:#D0E4EC!important;}
.overlay{position:fixed;inset:0;background:rgba(4,13,23,.6);z-index:1000;display:flex;align-items:center;justify-content:center;padding:20px;}
.modal{background:#fff;border-radius:10px;width:100%;max-width:580px;max-height:92vh;overflow-y:auto;border-top:4px solid var(--fr);}
.modal.btop{border-top-color:var(--fp);}
.mhdr{background:var(--fp);padding:14px 18px;display:flex;justify-content:space-between;align-items:flex-start;border-radius:6px 6px 0 0;}
.mhdr-co{color:#fff;font-size:16px;font-weight:700;}
.mhdr-sub{color:#B0D1D7;font-size:12px;margin-top:2px;}
.mbadge{display:inline-block;padding:2px 8px;border-radius:8px;font-size:10px;font-weight:700;margin-top:6px;margin-right:4px;}
.mclose{background:none;border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:4px;padding:2px 9px;cursor:pointer;font-size:17px;line-height:1.2;font-family:inherit;}
.mbody{padding:18px 20px;}
.stitle{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--fp);margin-bottom:8px;padding-bottom:5px;border-bottom:1px solid var(--fl);margin-top:0;}
.mt16{margin-top:16px;}
.stagebar{display:flex;gap:3px;margin:7px 0 5px;}
.sdot{height:6px;flex:1;border-radius:3px;background:var(--fl);}
.sdot.done{background:var(--fp);}
.sdot.cur{background:var(--fr);}
.slabel{font-size:12px;color:var(--fp);font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:6px;}
.snum{background:var(--fp);color:#fff;border-radius:50%;width:20px;height:20px;display:inline-flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0;}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-bottom:4px;}
.fgrp{display:flex;flex-direction:column;gap:3px;}
.flbl{font-size:10px;color:var(--fmu);text-transform:uppercase;letter-spacing:.04em;}
.fval{font-size:13px;color:var(--fd);font-weight:600;}
.fval.al{color:#C0392B;}
.next-contact-row{display:flex;gap:6px;align-items:center;}
.next-contact-clear{font-size:10px;color:var(--fr);background:#FFF0F0;border:1px solid #F5C0C0;border-radius:4px;padding:4px 7px;cursor:pointer;font-family:inherit;white-space:nowrap;}
.inp{width:100%;font-size:12px;padding:5px 8px;border:1px solid var(--fl);border-radius:4px;color:var(--fd);background:#fff;outline:none;font-family:inherit;}
.inp:focus{border-color:var(--fp);}
.inp.cust{border-color:var(--fr);color:var(--fr);font-weight:700;}
.prob-row{display:flex;gap:6px;align-items:center;}
.prob-inp{width:70px!important;}
.prob-reset{font-size:10px;color:var(--fm);background:var(--fb);border:1px solid var(--fl);border-radius:4px;padding:3px 8px;cursor:pointer;white-space:nowrap;font-family:inherit;}
.obs-list{display:flex;flex-direction:column;gap:6px;max-height:180px;overflow-y:auto;margin-bottom:8px;}
.obs-e{border-left:3px solid var(--fp);border-radius:0 5px 5px 0;padding:7px 10px;background:var(--fb);}
.obs-e.sys{border-left-color:var(--fl);background:#f9f9f9;}
.obs-e.al{border-left-color:var(--fr);background:#FFF5F5;}
.obs-meta{font-size:10px;color:var(--fmu);margin-bottom:2px;display:flex;gap:6px;align-items:center;}
.obs-auth{font-weight:700;color:var(--fp);}
.obs-badge{font-size:8px;padding:1px 4px;border-radius:3px;}
.obs-badge.s{background:var(--fb);color:var(--fp);}
.obs-badge.a{background:#FFF0F0;color:var(--fr);}
.obs-txt{font-size:12px;color:var(--fd);line-height:1.5;}
.latest-note{border-left:3px solid var(--fp);border-radius:0 5px 5px 0;background:#F7FBFC;padding:9px 11px;margin:8px 0 14px;}
.latest-note-meta{font-size:10px;color:var(--fmu);font-weight:700;text-transform:uppercase;letter-spacing:.04em;margin-bottom:3px;}
.latest-note-text{font-size:12px;color:var(--fd);line-height:1.45;}
.obs-ta{width:100%;border:1px solid var(--fl);border-radius:5px;padding:8px 10px;font-size:12px;font-family:inherit;color:var(--fd);resize:vertical;min-height:60px;outline:none;}
.obs-ta:focus{border-color:var(--fp);}
.mactions{display:flex;gap:8px;margin-top:14px;padding-top:12px;border-top:1px solid var(--fl);align-items:center;flex-wrap:wrap;}
.dash-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(clamp(100px,12vw,180px),1fr));gap:clamp(8px,0.8vw,14px);margin-bottom:clamp(12px,1.2vw,20px);}
.dash-kpi{background:#fff;border:1px solid var(--fl);border-radius:8px;padding:14px;text-align:center;}
.dash-kpi-v{font-size:22px;font-weight:700;color:var(--fp);line-height:1;}
.dash-kpi-v.red{color:#C0392B;}
.dash-kpi-l{font-size:10px;color:var(--fmu);text-transform:uppercase;letter-spacing:.05em;margin-top:5px;}
.dash-kpi-sub{font-size:10px;color:var(--fp);font-weight:700;margin-top:4px;}
.dash-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:12px;margin-bottom:12px;}
.dash-card{background:#fff;border:1px solid var(--fl);border-radius:8px;padding:14px 16px;}
.dash-ct{font-size:13px;font-weight:700;color:var(--fn);margin-bottom:12px;}
.brow{margin-bottom:10px;}
.blbl{display:flex;justify-content:space-between;font-size:11px;margin-bottom:3px;}
.btrack{background:var(--fb);border-radius:4px;height:10px;overflow:hidden;position:relative;}
.bbg{position:absolute;height:100%;width:100%;background:var(--fl);border-radius:4px;}
.bfill{position:absolute;height:100%;background:var(--fp);border-radius:4px;}
.bsub{font-size:9px;color:var(--fmu);margin-top:2px;}
.crow{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
.cav{width:32px;height:32px;border-radius:50%;background:var(--fb);border:1px solid var(--fl);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:var(--fp);flex-shrink:0;}
.cname{font-size:12px;font-weight:700;color:var(--fd);}
.csub{font-size:10px;color:var(--fmu);}
.pc-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:12px;}
.pc-title{font-size:20px;font-weight:700;color:var(--fn);line-height:1.15;}
.pc-sub{font-size:11px;color:var(--fmu);margin-top:3px;}
.pc-cards{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;margin-bottom:12px;}
@media (max-width:1250px){.pc-cards{grid-template-columns:repeat(3,minmax(0,1fr));}}
@media (max-width:700px){.pc-cards{grid-template-columns:repeat(2,minmax(0,1fr));}}
.pc-card{background:#fff;border:1px solid var(--fl);border-radius:8px;padding:10px 11px;border-top:4px solid var(--fl);min-width:0;}
.pc-card.ok{border-top-color:#2E7D32;}.pc-card.warn{border-top-color:#D97706;}.pc-card.red{border-top-color:#C62828;}

function sbHeaders(extra){
  var h={"Content-Type":"application/json","apikey":SB_KEY,"Authorization":"Bearer "+SB_KEY};
  if(extra)Object.assign(h,extra);
  return h;
}

// Generic fetch helpers
function sbGet(table, params){
  var url=SB_URL+"/rest/v1/"+table+(params?"?"+params:"");
  return fetch(url,{headers:sbHeaders({"Prefer":"return=representation"})}).then(function(r){return r.json();});
}
function sbPost(table, body){
  return fetch(SB_URL+"/rest/v1/"+table,{method:"POST",headers:sbHeaders({"Prefer":"return=representation"}),body:JSON.stringify(body)}).then(function(r){return r.json();});
}
function sbPatch(table, id, body){
  _savingCount++;
  _updateSaveStatus();
  return fetch(SB_URL+"/rest/v1/"+table+"?id=eq."+id,{method:"PATCH",headers:sbHeaders({"Prefer":"return=representation"}),body:JSON.stringify(body)})
    .then(function(r){return r.json();})
    .then(function(res){_savingCount=Math.max(0,_savingCount-1);_updateSaveStatus(true);return res;})
    .catch(function(err){_savingCount=Math.max(0,_savingCount-1);_updateSaveStatus(false);throw err;});
}
function sbDelete(table, id){
  return fetch(SB_URL+"/rest/v1/"+table+"?id=eq."+id,{method:"DELETE",headers:sbHeaders()}).then(function(r){return r.ok;});
}
function sbPatchConfig(key, value){
  return fetch(SB_URL+"/rest/v1/config?key=eq."+encodeURIComponent(key),{method:"PATCH",headers:sbHeaders({"Prefer":"return=representation"}),body:JSON.stringify({value:value})}).then(function(r){return r.json();}).then(function(rows){
    if(Array.isArray(rows)&&rows.length===0){
      return sbPost("config",{key:key,value:value});
    }
    return rows;
  });
}

// Convert DB row -> local lead object
function dbToLead(row){
  return {
    id: row.id,
    pipeline: row.pipeline,
    company: row.company,
    sector: row.sector||"",
    stage: row.stage,
    days: row.days,
    comercial: row.comercial||"",
    importe: row.importe!=null?Number(row.importe):null,
    probCustom: row.prob_custom!=null?Number(row.prob_custom):null,
    concepto: row.concepto||null,
    matriculas: row.matriculas!=null?Number(row.matriculas):null,
    contact: row.contact||"",
    lost: row.lost||false,
    lostReason: row.lost_reason||"",
    obs: normalizeObsArray(row.obs),
    nextContactDate: getNextContactDateFromObs(normalizeObsArray(row.obs)),
    createdAt: row.created_at||null,
    updatedAt: row.updated_at||null
  };
}
// Convert local lead -> DB row
function leadToDb(l){
  return {
    pipeline: l.pipeline,
    company: l.company,
    sector: l.sector||"",
    stage: l.stage,
    days: l.days,
    comercial: l.comercial||"",
    importe: l.importe!=null?l.importe:null,
    prob_custom: l.probCustom!=null?l.probCustom:null,
    concepto: l.concepto||null,
    matriculas: l.matriculas!=null?l.matriculas:null,
    contact: l.contact||"",
    lost: l.lost||false,
    lost_reason: l.lostReason||"",
    obs: l.obs||[]
  };
}

// ============================================================
// INIT: load all data from Supabase then start app
// ============================================================
function initApp(){
  // Show loading state
  document.getElementById("main-content").innerHTML='<div style="display:flex;align-items:center;justify-content:center;height:200px;gap:12px;color:#fff"><span style="font-size:22px">⏳</span><span style="font-size:14px;color:var(--fl)">Conectando con Supabase...</span></div>';

  Promise.all([
    sbGet("leads","order=id.asc"),
    sbGet("comerciales","order=id.asc"),
    sbGet("config","select=key,value")
  ]).then(function(results){
    var dbLeads=results[0], dbComs=results[1], dbConfig=results[2];

    // Load leads
    leads = Array.isArray(dbLeads) ? dbLeads.map(dbToLead) : [];
    if(leads.length>0) nextId = Math.max.apply(null, leads.map(function(l){return l.id;}))+1;

    // Load comerciales
    if(Array.isArray(dbComs)&&dbComs.length>0)
      comerciales = dbComs.map(function(r){return r.nombre;});

    // Load config
    var loadedPipelineStages = null;
    var loadedPipelineProbs = null;
    if(Array.isArray(dbConfig)){
      dbConfig.forEach(function(row){
        var v=row.value;
        if(row.key==="stageConfig") stageConfig=v;
        if(row.key==="decisionCutoff") decisionCutoff=(v&&v.date)||"";
        if(row.key==="planComercial"&&v) planCfg=Object.assign({},planCfg,v);
        if(row.key==="planFLNL"&&v) flnlCfg=Object.assign({},flnlCfg,v);
        if(row.key==="visitasChat"&&v){ if(v.url)visitasChatUrl=v.url; if(v.prompt)visitasChatPrompt=v.prompt; if(v.weeks!=null)visitasChatWeeks=v.weeks; }
        if(row.key==="pipelineStages") loadedPipelineStages=v;
        if(row.key==="pipelineProbs") loadedPipelineProbs=v;
        if(row.key==="conceptosIngreso") conceptosIngreso=v;
        if(row.key==="conceptosConMatriculas") conceptosConMatriculas=v;
        if(row.key==="conceptosAreaEmpresas") conceptosAreaEmpresas=v;
        if(row.key==="importesConcepto") importesConcepto=v||{};
        if(row.key==="annualObjectives") annualObjectives=mergeAnnualObjectives(v);
        if(row.key==="activityObjectives") activityObjectives=mergeActivityObjectives(v);
        if(row.key==="programEditions") programEditions=normalizeProgramEditions(v);
        if(row.key==="comerciales_emails") comercialesEmails=v||{};
      });
    }
    if(loadedPipelineStages) applyPipelineStagesConfig(loadedPipelineStages);
    else if(loadedPipelineProbs) applyPipelineProbsConfig(loadedPipelineProbs);
    ensureRequiredIncomeConcepts();
    normalizeAllStageConfig();
    syncLeadStageDays(true);

    lastSyncTime = new Date();
    refresh();
    // Pesta\xf1a abierta desde un bot\xf3n de informe (CMI comercial DG / Plan comercial): se abre directamente en esa vista
    (function(){
      var hv=(location.hash||"").replace("#","");
      if(hv==="plan"||hv==="dashboard"||hv==="flnl"){window.__isReportTab=true;setView(hv);}
    })();
    var el=document.getElementById("last-sync-label");
    if(el){var d=lastSyncTime;el.textContent="Última actualización: "+pad(d.getDate())+"/"+pad(d.getMonth()+1)+"/"+d.getFullYear()+" "+pad(d.getHours())+":"+pad(d.getMinutes());}
    setTimeout(function(){ checkOverdueNotifications(); updateNotifBadge(); }, 300);
    setTimeout(function(){ startupDecisionAlert(); }, 1200);
  }).catch(function(err){
    document.getElementById("main-content").innerHTML='<div style="padding:24px;color:var(--fr)">&#9888; Error conectando con Supabase: '+err.message+'</div>';
  });
}

function silentRefresh(){
  if(selectedLeadId!==null)return;
  Promise.all([
    sbGet("leads","order=id.asc"),
    sbGet("comerciales","order=id.asc"),
    sbGet("config","select=key,value")
  ]).then(function(results){
    var dbLeads=results[0],dbComs=results[1],dbConfig=results[2];
    leads=Array.isArray(dbLeads)?dbLeads.map(dbToLead):[];
    if(leads.length>0)nextId=Math.max.apply(null,leads.map(function(l){return l.id;}))+1;
    if(Array.isArray(dbComs)&&dbComs.length>0)
      comerciales=dbComs.map(function(r){return r.nombre;});
    var loadedPipelineStages=null,loadedPipelineProbs=null;
    if(Array.isArray(dbConfig)){
      dbConfig.forEach(function(row){
        var v=row.value;
        if(row.key==="stageConfig")stageConfig=v;
        if(row.key==="decisionCutoff")decisionCutoff=(v&&v.date)||"";
        if(row.key==="planComercial"&&v)planCfg=Object.assign({},planCfg,v);
        if(row.key==="planFLNL"&&v)flnlCfg=Object.assign({},flnlCfg,v);
        if(row.key==="visitasChat"&&v){if(v.url)visitasChatUrl=v.url;if(v.prompt)visitasChatPrompt=v.prompt;if(v.weeks!=null)visitasChatWeeks=v.weeks;}
        if(row.key==="pipelineStages")loadedPipelineStages=v;
        if(row.key==="pipelineProbs")loadedPipelineProbs=v;
        if(row.key==="conceptosIngreso")conceptosIngreso=v;
        if(row.key==="conceptosConMatriculas")conceptosConMatriculas=v;
        if(row.key==="conceptosAreaEmpresas")conceptosAreaEmpresas=v;
        if(row.key==="importesConcepto")importesConcepto=v||{};
        if(row.key==="annualObjectives")annualObjectives=mergeAnnualObjectives(v);
        if(row.key==="activityObjectives")activityObjectives=mergeActivityObjectives(v);
        if(row.key==="programEditions")programEditions=normalizeProgramEditions(v);
        if(row.key==="comerciales_emails")comercialesEmails=v||{};
      });
    }
    if(loadedPipelineStages)applyPipelineStagesConfig(loadedPipelineStages);
    else if(loadedPipelineProbs)applyPipelineProbsConfig(loadedPipelineProbs);
    ensureRequiredIncomeConcepts();
    normalizeAllStageConfig();
    syncLeadStageDays(true);
    lastSyncTime=new Date();
    refresh();
    var el=document.getElementById("last-sync-label");
    if(el){var d=lastSyncTime;el.textContent="Última actualización: "+pad(d.getDate())+"/"+pad(d.getMonth()+1)+"/"+d.getFullYear()+" "+pad(d.getHours())+":"+pad(d.getMinutes());}
  }).catch(function(err){console.warn("Auto-refresh:",err);});
}

var notifications = [];
var notifIdCounter = 1;

function addNotif(type, title, body, pipeline, company, action) {
  notifications.unshift({
    id: notifIdCounter++,
    type: type,       // 'overdue' | 'automation' | 'alert'
    title: title,
    body: body,
    pipeline: pipeline || null,
    company: company || null,
    action: action || null,
    date: nowStr(),
    read: false
  });
  updateNotifBadge();
}

function markAllRead() {
  notifications.forEach(function(n){ n.read = true; });
  updateNotifBadge();
  renderNotifications();
}

function clearNotif(id) {
  notifications = notifications.filter(function(n){ return n.id !== id; });
  updateNotifBadge();
  renderNotifications();
}

function clearAllNotifs() {
  notifications = [];
  updateNotifBadge();
  renderNotifications();
}

function updateNotifBadge() {
  var unread = notifications.filter(function(n){ return !n.read; }).length;
  var badge = document.getElementById("notif-badge");
  if(badge) {
    badge.textContent = unread > 0 ? unread : "";
    badge.style.display = unread > 0 ? "inline-flex" : "none";
  }
  var btn = document.getElementById("btn-notif");
  if(btn) {
    btn.className = "btn btn-ghost" + (currentView==="notif"?" active":"") + (unread>0?" notif-active":"");
  }
}

function checkOverdueNotifications() {
  var active = leads.filter(function(l){ return !l.lost && l.stage >= 0; });
  active.forEach(function(lead){
    if(isOverdue(lead)) {
      var key = "overdue-" + lead.id + "-" + lead.stage;
      var alreadyNotified = notifications.find(function(n){ return n.body && n.body.indexOf(key) !== -1; });
      if(!alreadyNotified) {
        var maxD = getMaxDays(lead.pipeline, lead.stage);
        var stageName = PIPELINES[lead.pipeline].stages[lead.stage] ? PIPELINES[lead.pipeline].stages[lead.stage].label : "";
        var pipelineLabel = PIPELINES[lead.pipeline].label;
        addNotif(
          'overdue',
          'Retraso · ' + lead.pipeline + ' · ' + lead.company,
          '[' + key + '] Pipeline ' + lead.pipeline + ' (' + pipelineLabel + ') - ' + lead.company + ' lleva ' + lead.days + ' días en la etapa "' + stageName + '" (máximo configurado: ' + maxD + ' días). Comercial responsable: ' + lead.comercial + '.',
          lead.pipeline,
          lead.company,
          lead.id
        );
      }
    }
  });

  // P2 -> P3 alert: company in P2 for 21+ days with no active P3
  var p2leads = leads.filter(function(l){ return l.pipeline==="P2" && !l.lost && l.days >= 21; });
  p2leads.forEach(function(lead){
    var hasP3 = leads.find(function(l){ return l.pipeline==="P3" && l.company===lead.company && !l.lost; });
    if(!hasP3) {
      var key = "p2p3-" + lead.id;
      var alreadyNotified = notifications.find(function(n){ return n.body && n.body.indexOf(key) !== -1; });
      if(!alreadyNotified) {
        var stageName = PIPELINES["P2"].stages[lead.stage] ? PIPELINES["P2"].stages[lead.stage].label : "";
        addNotif(
          'alert',
          'Alerta P2 -> P3 · ' + lead.company,
          '[' + key + '] Pipeline P2 (Onboarding) - ' + lead.company + ' lleva ' + lead.days + ' días en onboarding (etapa: "' + stageName + '") sin ninguna oportunidad activa en P3 (Venta Formación). Comercial responsable: ' + lead.comercial + '. Considera iniciar una conversación de formación.',
          'P2/P3',
          lead.company,
          lead.id
        );
      }
    }
  });
}
function todayISO(){
  var d=new Date();
  return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
}
function dateOnlyISO(value){
  if(!value)return null;
  var s=String(value).trim();
  if(/^\d{4}-\d{2}-\d{2}/.test(s))return s.slice(0,10);
  var m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if(m)return m[3]+"-"+pad(m[2])+"-"+pad(m[1]);
  var d=new Date(s);
  if(!isNaN(d.getTime()))return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
  return null;
}
function localDateFromISO(iso){
  var p=String(iso||"").split("-");
  return p.length===3 ? new Date(Number(p[0]),Number(p[1])-1,Number(p[2])) : null;
}
function addDaysISO(iso,days){
  var d=localDateFromISO(iso);
  if(!d)return null;
  d.setDate(d.getDate()+Number(days||0));
  return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
}
function daysSinceISO(iso){
  var from=localDateFromISO(dateOnlyISO(iso));
  var to=localDateFromISO(todayISO());
  if(!from||!to)return 0;
  return Math.max(0,Math.floor((to-from)/86400000));
}
function isoToDisplay(iso){
  if(!iso)return "";
  var p=String(iso).split("-");
  return p.length===3 ? (p[2]+"/"+p[1]+"/"+p[0]) : iso;
}
function getLatestStageEntryFromObs(obs){
  var entries=(obs||[]).filter(function(o){return o&&o.type==="stage_meta"&&o.enteredAt;});
  return entries.length?entries[entries.length-1]:null;
}
function getCreationDateFromObs(obs){
  var entry=(obs||[]).find(function(o){
    return o&&o.date&&o.type==="system"&&/cread/i.test(String(o.text||""));
  });
  return entry?dateOnlyISO(entry.date):null;
}
function inferStageEntryISO(lead){
  var latest=getLatestStageEntryFromObs(lead.obs);
  if(latest&&latest.pipeline===lead.pipeline&&Number(latest.stage)===Number(lead.stage))return dateOnlyISO(latest.enteredAt);
  if(Number(lead.days)>0&&lead.updatedAt)return addDaysISO(dateOnlyISO(lead.updatedAt),-Number(lead.days));
  if(Number(lead.stage)===0&&lead.createdAt)return dateOnlyISO(lead.createdAt);
  if(lead.updatedAt)return dateOnlyISO(lead.updatedAt);
  return getCreationDateFromObs(lead.obs)||todayISO();

  lead.obs=lead.obs||[];
  lead.obs.push({

    date:isoToDisplay(iso),
    type:"stage_meta",

function getProgramEditionPipelineStats(){

  });
  groups.__none={id:"__none",label:"Sin edicion asignada",program:"",count:0,total:0,weighted:0,leads:[]};
  leads.filter(function(l){return l.pipeline==="P3"&&!l.lost&&!isAssociateExitLead(l);}).forEach(function(l){
    var ids=getLeadProgramEditionIds(l).filter(function(id){return !!getProgramEdition(id);});
    if(!ids.length)ids=["__none"];
    ids.forEach(function(id){
      var g=groups[id]||groups.__none;
      var prob=getProb(l);
      g.count++;
      g.total+=Number(l.importe)||0;
      g.weighted+=(Number(l.importe)||0)*(prob!=null?Number(prob):0)/100;
      g.leads.push(l);
    });
  });
  return Object.keys(groups).map(function(k){return groups[k];}).filter(function(g){return g.count>0||g.id!=="__none";})
    .sort(function(a,b){
      if(a.id==="__none")return 1;

function needsDecision(l){

  if(l.stage>=leadLastStageIdx(l))return false;
  if(isPostponedLead(l)||isAssociateExitLead(l))return false;
  if(!isOverdue(l))return false;
  if(leadHasActiveNextAction(l))return false;
  return true;
}

function leadMatchesPerson(l,person){
  if(!person)return true;
  var nk=normKey(person);
  if(/[\/,&]/.test(nk))return normKey(l.comercial||"")===nk;
  return normKey(l.comercial||"").split(/[\/,&]| y /).some(function(p){
    p=p.trim();
    return p&&(nk===p||nk.indexOf(p)===0||p.indexOf(nk)===0);
  });
}
function pendingDecisions(person){
  return leads.filter(function(l){return needsDecision(l)&&leadMatchesPerson(l,person);}).sort(function(a,b){
    if(b.stage!==a.stage)return b.stage-a.stage;
    return (b.days-getMaxDays(b.pipeline,b.stage))-(a.days-getMaxDays(a.pipeline,a.stage));
  });
}

function serializePipelineStages(){
  var cfg={};
  Object.keys(PIPELINES).forEach(function(pid){
    cfg[pid]=PIPELINES[pid].stages.map(function(s){
      return {label:s.label,short:s.short||s.label,prob:s.prob};
    });
  });
  return cfg;
}

function applyPipelineStagesConfig(cfg){
  if(!cfg || typeof cfg!=="object") return;
  Object.keys(cfg).forEach(function(pid){
    var p=PIPELINES[pid];
    var saved=cfg[pid];
    if(!p || !Array.isArray(saved) || !saved.length) return;
    var oldStages=p.stages.slice();
    p.stages=saved.map(function(s,idx){
      var old=oldStages[idx]||{};
      var label=stageShortLabel(s.label||old.label||("Etapa "+(idx+1)));
      var prob=p.economic ? (s.prob!=null ? Math.min(100,Math.max(0,Number(s.prob)||0)) : (old.prob!=null?old.prob:null)) : null;
      return {id:idx,label:label,short:stageShortLabel(s.short||label),prob:prob};
    });
  });
}

function applyPipelineProbsConfig(cfg){
  if(!cfg || typeof cfg!=="object") return;
  Object.keys(cfg).forEach(function(pid){
    var p=PIPELINES[pid];
    var probs=cfg[pid];
    if(!p || !Array.isArray(probs)) return;
    p.stages.forEach(function(stage,idx){
      if(stage.prob!==null && probs[idx]!=null) stage.prob=Math.min(100,Math.max(0,Number(probs[idx])||0));
    });
  });
}

function normalizeAllStageConfig(){
  Object.keys(PIPELINES).forEach(function(pid){
    if(!stageConfig[pid]) stageConfig[pid]=[];
    PIPELINES[pid].stages.forEach(function(stage,idx){
      stage.id=idx;
      stage.short=stageShortLabel(stage.short||stage.label);
      if(stageConfig[pid][idx]==null) stageConfig[pid][idx]=14;
    });
    stageConfig[pid]=stageConfig[pid].slice(0, PIPELINES[pid].stages.length);
  });
}

function persistPipelineStages(){
  sbPatchConfig("pipelineStages", serializePipelineStages());
  var pipelineProbs={};
  Object.keys(PIPELINES).forEach(function(k){
    pipelineProbs[k]=PIPELINES[k].stages.map(function(s){return s.prob;});
  });
  sbPatchConfig("pipelineProbs", pipelineProbs);
}

function formationMatriculaObjective(label){

function formationMatriculaObjectiveTotal(){
  var f=annualObjectives.formacion||{};
  var legacy=Number(f.matriculasObjetivo)||0;
  var segmented=(Number(f.matriculasFirstLevel)||0)+(Number(f.matriculasNextLevel)||0)+(Number(f.matriculasEsade)||0);
  return segmented||legacy;

function annualObjectiveTotal(area){
  var e=annualObjectives.empresas||{}, f=annualObjectives.formacion||{};
  var assoc=getAssociationBalanceStats();
  var empresas=(Number(assoc.captacionObjetivoInicial)||0)+(Number(e.grupoCompras)||0)+(Number(e.colaboraciones)||0);
  var formacion=Number(f.objetivoAnual)||0;
  if(area==="empresas")return empresas;
  if(area==="formacion")return formacion;
  return empresas+formacion;
}
function objectivePct(amount, area){
  var target=annualObjectiveTotal(area);
  return target>0?Math.round((Number(amount)||0)/target*100):0;
}
function empresaIncomeSegmentIdForConcept(concept){
  var key=normKey(concept);
  if(!key)return null;
  if(key.indexOf("grupo")!==-1&&key.indexOf("compra")!==-1)return "grupoCompras";
  if(key.indexOf("colabor")!==-1)return "colaboraciones";
  if(key.indexOf("fiinca")!==-1||key.indexOf("directivo")!==-1)return "directivoFiinca";
  if(key.indexOf("captacion")!==-1||key.indexOf("asociad")!==-1)return "captacion";
  return null;
}

function getBusinessObjectiveProgress(){

  };

function getAssociationBalanceStats(){
  var baseInicial=Number(annualObjectives.empresas&&annualObjectives.empresas.base)||0;
  var baseUpdatedAt=(annualObjectives.empresas&&annualObjectives.empresas.baseUpdatedAt)||"";
  var captacionObjetivoInicial=Number(annualObjectives.empresas&&annualObjectives.empresas.captacionObjetivoInicial)||0;
  var nuevasAsociadas=leads.reduce(function(sum,l){
    if(isAssociateExitLead(l)||!isWonLead(l)||l.pipeline!=="P1")return sum;
    var details=leadConceptDetails(l);
    if(!details.length)return sum;
    return sum+details.reduce(function(s,d){
      return empresaIncomeSegmentIdForConcept(d.concepto)==="captacion"?s+leadIncomeLineAmount(l,details,d):s;
    },0);
  },0);
  // Solo cuentan las bajas confirmadas: las previstas y comunicadas se ven en el Plan comercial empresas
  var bajasAsociadas=leads.filter(function(l){return isAssociateExitLead(l)&&getBajaMeta(l).estado==="confirmada";}).reduce(function(s,l){return s+getAssociateExitAmount(l);},0);
  var saldoAltasBajas=nuevasAsociadas-bajasAsociadas;
  var saldoActual=baseInicial;
  var gapInicialCaptacion=Math.max(0, captacionObjetivoInicial-baseInicial);
  var captacionObjetivoAjustado=gapInicialCaptacion;
  var captacionNecesariaTotal=gapInicialCaptacion+bajasAsociadas;
  var pctCaptacionInicial=pctValue(saldoActual,captacionObjetivoInicial);
  return {
    baseInicial:baseInicial,
    ingresosActuales:baseInicial,
    baseUpdatedAt:baseUpdatedAt,
    captacionObjetivoInicial:captacionObjetivoInicial,
    gapInicialCaptacion:gapInicialCaptacion,
    nuevasAsociadas:nuevasAsociadas,
    bajasAsociadas:bajasAsociadas,
    saldoAltasBajas:saldoAltasBajas,
    saldoActual:saldoActual,
    captacionNecesariaTotal:captacionNecesariaTotal,
    captacionObjetivoAjustado:captacionObjetivoAjustado,
    pctCaptacionInicial:pctCaptacionInicial
  };
}

function areaForConcept(concept, lead){
  if(hasConcept(conceptosAreaFormacion, concept)||isFormacionConcept(concept))return "formacion";
  if(hasConcept(conceptosAreaEmpresas, concept))return "empresas";
  if(lead&&lead.pipeline==="P3")return "formacion";
  return "empresas";
}
function blankAreaStats(){
  return {active:0,won:0,total:0,weighted:0,wonAmount:0,lostAmount:0};
}
function addLeadToAreaStats(stats, lead, isLost){
  if(!PIPELINES[lead.pipeline]||!PIPELINES[lead.pipeline].economic||lead.importe==null)return;
  if(isAssociateExitLead(lead))return;
  var details=leadConceptDetails(lead);
  if(!details.length)details=[{concepto:lead.concepto||"",matriculas:lead.matriculas}];
  var seen={empresas:false,formacion:false};
  var prob=getProb(lead);
  details.forEach(function(d){
    var area=areaForConcept(d.concepto, lead);
    var amount=details.length>1?conceptLineAmount(d,0):(lead.importe||0);
    if(isLost){
      stats[area].lostAmount+=amount;
      return;
    }
    if(!seen[area]){stats[area].active++;seen[area]=true;}
    stats[area].total+=amount;
    if(prob!=null)stats[area].weighted+=amount*prob/100;
    if(isWonLead(lead)){
      stats[area].wonAmount+=amount;
      if(!stats[area]._wonSeen)stats[area]._wonSeen={};
      if(!stats[area]._wonSeen[lead.id]){stats[area].won++;stats[area]._wonSeen[lead.id]=true;}
    }
  });
}
function getAreaKpiStats(){
  var stats={empresas:blankAreaStats(),formacion:blankAreaStats(),total:blankAreaStats()};
  leads.forEach(function(l){
    if(l.lost)addLeadToAreaStats(stats,l,true);
    else addLeadToAreaStats(stats,l,false);
  });
  ["active","won","total","weighted","wonAmount","lostAmount"].forEach(function(k){
    stats.total[k]=stats.empresas[k]+stats.formacion[k];
  });
  stats.empresas.objective=annualObjectiveTotal("empresas");
  stats.formacion.objective=annualObjectiveTotal("formacion");
  stats.total.objective=annualObjectiveTotal();
  var businessProgress=getBusinessObjectiveProgress();
  stats.empresas.objectiveProgress=businessProgress.amount;
  stats.empresas.pct=businessProgress.pct;
  stats.formacion.pct=objectivePct(stats.formacion.total,"formacion");
  stats.total.objectiveProgress=businessProgress.amount+stats.formacion.total;
  stats.total.pct=pctValue(stats.total.objectiveProgress,stats.total.objective);
  return stats;
}
function getWonIncomeCategoryBreakdown(){
  var byConcept={};
  leads.filter(isWonLead).forEach(function(l){
    if(!PIPELINES[l.pipeline]||!PIPELINES[l.pipeline].economic)return;

      if(!byConcept[key])byConcept[key]={concepto:concept,opps:0,importe:0};

function getEmpresaIncomeBreakdown(){
  var assoc=getAssociationBalanceStats();
  var segments=[
    {id:"captacion",label:"Ingresos actuales",concept:"Captaci\u00f3n",objective:Number(assoc.captacionObjetivoInicial)||0},
    {id:"grupoCompras",label:"Grupo de compras est&aacute;ndar + plus",concept:"Grupo de compras",objective:Number(annualObjectives.empresas&&annualObjectives.empresas.grupoCompras)||0},
    {id:"colaboraciones",label:"Colaboraciones",concept:"Colaboraciones",objective:Number(annualObjectives.empresas&&annualObjectives.empresas.colaboraciones)||0},
    {id:"directivoFiinca",label:"Directivo FIINCA",concept:"Directivo FIINCA",objective:Number(annualObjectives.empresas&&annualObjectives.empresas.directivoFiinca)||0}
  ];
  var byId={};
  segments.forEach(function(seg){
    byId[seg.id]={id:seg.id,label:seg.label,concept:seg.concept,total:0,weighted:0,wonAmount:0,objective:seg.objective,pct:0};
  });
  function segmentForLine(d){
    var id=empresaIncomeSegmentIdForConcept(d&&d.concepto);
    return id?byId[id]:null;
  }
  leads.forEach(function(l){
    if(!PIPELINES[l.pipeline]||!PIPELINES[l.pipeline].economic||l.importe==null||l.lost||isAssociateExitLead(l))return;
    var details=leadConceptDetails(l);
    if(!details.length)details=[{concepto:l.concepto||"",matriculas:l.matriculas}];
    var prob=getProb(l);
    details.forEach(function(d){
      var row=segmentForLine(d);
      if(!row)return;
      var amount=leadIncomeLineAmount(l,details,d);
      row.total+=amount;
      if(prob!=null)row.weighted+=amount*prob/100;
      if(isWonLead(l)){
        row.wonAmount+=amount;
      }
    });
  });
  var rows=segments.map(function(seg){
    var row=byId[seg.id];
    row.progressAmount=seg.id==="captacion"?Number(assoc.saldoActual)||0:row.wonAmount;
    row.pct=pctValue(row.progressAmount,row.objective);
    return row;
  });
  var total={total:0,weighted:0,wonAmount:0,progressAmount:0,objective:annualObjectiveTotal("empresas"),pct:0};
  var objectiveLine={captacion:true,grupoCompras:true,colaboraciones:true};
  rows.forEach(function(row){
    total.total+=row.total;
    total.weighted+=row.weighted;
    total.wonAmount+=row.wonAmount;
    if(objectiveLine[row.id])total.progressAmount+=row.progressAmount;
  });
  total.pct=pctValue(total.progressAmount,total.objective);
  return {rows:rows,total:total,asociadas:assoc};
}

function getActivityKpiStats(){
  var today=todayISO();
  var d7=addDaysISO(today,-7);
  var d30=addDaysISO(today,-30);
  var dormThreshold=addDaysISO(today,-14);
  var g={notas7d:0,notas30d:0,reunionesMes:0,dormidasCount:0,totalActivas:0,notasTotal:0,mediaNotas:0};
  var byP={};
  Object.keys(PIPELINES).forEach(function(pid){
    byP[pid]={notas7d:0,notas30d:0,reunionesMes:0,activas:0,fichasConNota30d:0,notasTotal:0,pctActividad30d:0,mediaNotas:0};
  });
  leads.filter(function(l){return !l.lost&&!isAssociateExitLead(l);}).forEach(function(l){
    var pid=l.pipeline;
    var ps=byP[pid];
    if(!ps)return;
    g.totalActivas++;
    ps.activas++;
    var userNotes=(l.obs||[]).filter(function(o){return o&&o.type==="user"&&String(o.text||"").trim();});
    var latestISO=null;
    var hasIn30d=false;
    userNotes.forEach(function(o){
      var nd=dateOnlyISO(o.date);
      if(!nd)return;
      g.notasTotal++; ps.notasTotal++;
      if(nd>=d7){g.notas7d++;ps.notas7d++;}
      if(nd>=d30){g.notas30d++;ps.notas30d++;hasIn30d=true;}
      if(!o.auto&&isClosedMeetingNote(o.text)&&nd>=d30){g.reunionesMes++;ps.reunionesMes++;}
      if(!latestISO||nd>latestISO)latestISO=nd;
    });
    if(!latestISO||latestISO<dormThreshold)g.dormidasCount++;
    if(hasIn30d)ps.fichasConNota30d++;
  });
  g.mediaNotas=g.totalActivas>0?Math.round(g.notasTotal/g.totalActivas*10)/10:0;
  Object.keys(PIPELINES).forEach(function(pid){
    var ps=byP[pid];
    ps.pctActividad30d=ps.activas>0?Math.round(ps.fichasConNota30d/ps.activas*100):0;
    ps.mediaNotas=ps.activas>0?Math.round(ps.notasTotal/ps.activas*10)/10:0;
  });
  return {global:g,byPipeline:byP};
}

function isMatriculaConcept(concept){
  return !!formacionCategoryLabel(concept)||hasConcept(conceptosConMatriculas, concept)||hasConcept(conceptosAreaFormacion, concept);
}
function isDirectivoFiincaConcept(concept){
  return normKey(concept)==="directivo fiinca";
}
function isGrupoComprasConcept(concept){
  var key=normKey(concept);
  return key.indexOf("grupo")!==-1&&key.indexOf("compra")!==-1;
}
function isQuantityConcept(concept){
  return isMatriculaConcept(concept)||isDirectivoFiincaConcept(concept)||isGrupoComprasConcept(concept);
}
function conceptQuantityLabel(concept){
  if(isGrupoComprasConcept(concept))return "Cantidad";
  return isDirectivoFiincaConcept(concept) ? "Directivos" : "Matr.";
}
function conceptQuantityDefault(concept){
  return isQuantityConcept(concept) ? 1 : null;
}
function getConceptAmount(concept){
  var key=Object.keys(importesConcepto||{}).find(function(k){return normKey(k)===normKey(concept);});
  return key!=null&&importesConcepto[key]!=null&&importesConcepto[key]!=="" ? Number(importesConcepto[key])||0 : 0;
}
function parseConceptDetails(rawConcept, rawMatriculas){
  if(!rawConcept)return [];
  var s=String(rawConcept);
  if(s.charAt(0)==="["){
    try{
      var arr=JSON.parse(s);
      if(Array.isArray(arr))return arr.filter(function(x){return x&&x.concepto;}).map(function(x){
        return {
          concepto:String(x.concepto||""),
          matriculas:x.matriculas!=null&&x.matriculas!==""?Number(x.matriculas):null,
          descuento:x.descuento!=null&&x.descuento!==""?Number(x.descuento)||0:0
        };
      });
    }catch(e){}
  }
  return [{concepto:s,matriculas:rawMatriculas!=null?Number(rawMatriculas):null,descuento:0}];
}
function leadConceptDetails(l){ return parseConceptDetails(l.concepto,l.matriculas); }
function serializeConceptDetails(details){
  details=(details||[]).filter(function(d){return d&&d.concepto;}).map(function(d){
    var item={concepto:d.concepto,matriculas:d.matriculas!=null&&d.matriculas!==""?Number(d.matriculas):null};
    if(d.descuento!=null&&d.descuento!=="")item.descuento=Math.min(100,Math.max(0,Number(d.descuento)||0));
    return item;
  });
  if(details.length===0)return {concepto:null,matriculas:null};
  if(details.length===1&&!(Number(details[0].descuento)||0))return {concepto:details[0].concepto,matriculas:details[0].matriculas};
  return {concepto:JSON.stringify(details),matriculas:details.reduce(function(s,d){return s+(d.matriculas||0);},0)||null};
}
function leadConceptLabel(l){
  var details=leadConceptDetails(l);
  return details.length?details.map(function(d){return d.concepto;}).join(" + "):(l.concepto||"");
}
function conceptoPillHTML(concepto){
  var c=(concepto||"").toLowerCase();
  var bg;
  if(c.indexOf("next level")!==-1)                              bg="#E11D48";
  else if(c.indexOf("first level")!==-1)                        bg="#D97706";
  else if(c.indexOf("esade")!==-1||c.indexOf("b2b")!==-1)       bg="#7C3AED";
  else if(c.indexOf("online")!==-1)                             bg="#0891B2";
  else if(c.indexOf("directivo")!==-1||c.indexOf("fiinca")!==-1)bg="#1E40AF";
  else if(c.indexOf("colabor")!==-1)                            bg="#4F46E5";
  else if(c.indexOf("plus")!==-1)                               bg="#065F46";
  else if(c.indexOf("est")!==-1&&c.indexOf("ndar")!==-1)        bg="#0F766E";
  else if(c.indexOf("compras")!==-1)                            bg="#0D9488";
  else if(c.indexOf("captac")!==-1)                             bg="#059669";
  else if(c.indexOf("fideliz")!==-1)                            return '<span class="cpill" style="background:#F59E0B;color:#1C1100">'+esc(concepto)+'</span>';
  else                                                           bg="#6B7280";
  return '<span class="cpill" style="background:'+bg+'">'+esc(concepto)+'</span>';
}
function leadConceptPillsHTML(lead){
  var details=leadConceptDetails(lead);
  if(details.length) return details.map(function(d){return conceptoPillHTML(d.concepto);}).join("");
  if(lead.concepto) return conceptoPillHTML(lead.concepto);
  return "";
}
function leadMatriculasTotal(l){
  var details=leadConceptDetails(l);
  if(details.length)return details.reduce(function(s,d){return s+(isMatriculaConcept(d.concepto)?(d.matriculas||0):0);},0)||null;
  return isMatriculaConcept(l.concepto)?(l.matriculas||null):null;
}
function directivoFiincaUnitsFromDetails(details){
  var total=0;
  (details||[]).forEach(function(d){
    if(isDirectivoFiincaConcept(d.concepto))total+=(d.matriculas!=null&&d.matriculas!==""?Number(d.matriculas)||0:1);
  });
  return total;
}
function leadDirectivoFiincaUnits(l){
  return directivoFiincaUnitsFromDetails(leadConceptDetails(l));
}
function conceptLineAmount(d, fallback){
  var amount=conceptLineBaseAmount(d);
  if(amount>0)return amount*(1-conceptLineDiscount(d)/100);
  return fallback||0;
}
function conceptLineBaseAmount(d){
  var amount=getConceptAmount(d.concepto);
  if(amount>0)return amount*(isQuantityConcept(d.concepto)?(d.matriculas||0):1);
  return 0;
}
function conceptLineDiscount(d){
  return Math.min(100,Math.max(0,Number(d&&d.descuento)||0));
}
function recalcLeadIncomeFromConcepts(l){
  var details=leadConceptDetails(l);
  if(!details.length)return;
  var hasConfigured=details.some(function(d){return getConceptAmount(d.concepto)>0;});
  if(!hasConfigured)return;
  l.importe=details.reduce(function(s,d){return s+conceptLineAmount(d,0);},0)||null;
  l.matriculas=details.reduce(function(s,d){return s+(d.matriculas||0);},0)||null;
}
function leadMatchesSearch(l,q){
  if(!q)return true;
  var note=latestUserNote(l);
  var hay=[l.company,l.sector,l.contact,l.comercial,l.pipeline,leadConceptLabel(l),getLeadContactoPrevio(l),leadProgramEditionsLabel(l),l.importe,leadMatriculasTotal(l),note&&note.text].join(" ").toLowerCase();
  return hay.indexOf(q.toLowerCase())!==-1;
}

function renderKanban(){
  var pipeline=PIPELINES[activePipeline];
  var pLeads=leads.filter(function(l){return l.pipeline===activePipeline&&!l.lost;});
  var lLeads=leads.filter(function(l){return l.pipeline===activePipeline&&l.lost;});
  var pTotal=pLeads.length;
  var lTotal=lLeads.length;
  var comsMap={};
  var _comExclude=["maria angeles"];

  var comKeys=Object.keys(comsMap).sort();
  var catMap={},noCatCount=0;
  pLeads.concat(lLeads).forEach(function(l){
    var ds=leadConceptDetails(l);

  });

    var ia=conceptosIngreso.findIndex(function(c){return normKey(c)===a;}),ib=conceptosIngreso.findIndex(function(c){return normKey(c)===b;});
    if(ia===-1)ia=999;if(ib===-1)ib=999;
    return ia!==ib?ia-ib:a.localeCompare(b);
  });
  var catSel=categoryFilter.filter(function(k){return k==="__none"?noCatCount>0:!!catMap[k];});
  var catActive=catSel.length>0;
  if(comercialFilter&&comsMap[comercialFilter]){
    pLeads=pLeads.filter(function(l){return normKey(l.comercial||"")===comercialFilter;});
    lLeads=lLeads.filter(function(l){return normKey(l.comercial||"")===comercialFilter;});
  }

    pLeads=pLeads.filter(function(l){return leadHasAnyCategory(l,catSel);});

  var q=kanbanSearch.trim();

  var totalCards=pTotal+lTotal;

  var catItems=catKeys.map(function(k){return {k:k,label:catMap[k]};}).concat(noCatCount?[{k:"__none",label:"Sin categor\xeda"}]:[]);
  var catLabel=!catSel.length?"Todas las categor\xedas":(catSel.length===1?(catSel[0]==="__none"?"Sin categor\xeda":catMap[catSel[0]]):catSel.length+" categor\xedas");
  var catPanel='';

    catPanel='<div style="position:absolute;top:36px;left:0;z-index:60;background:#fff;border:1px solid #B0D1D7;border-radius:6px;box-shadow:0 6px 18px rgba(4,13,23,.18);padding:6px;min-width:250px;max-height:340px;overflow:auto">'
      +catItems.map(function(it){
        return '<label style="display:flex;align-items:center;gap:8px;padding:5px 8px;font-size:12px;color:#212121;cursor:pointer;border-radius:4px"><input type="checkbox" data-k="'+esc(it.k)+'"'+(catSel.indexOf(it.k)!==-1?' checked':'')+' onchange="toggleCategory(this.getAttribute(\'data-k\'))" style="accent-color:#0C5580"> '+esc(it.label)+'</label>';
      }).join('')
      +'<div style="border-top:1px solid #B0D1D7;margin-top:4px;padding-top:6px;display:flex;justify-content:space-between;gap:8px"><button class="btn btn-outline btn-sm" onclick="event.stopPropagation();clearCategories()">Limpiar selecci&oacute;n</button><button class="btn btn-primary btn-sm" onclick="event.stopPropagation();toggleCatMenu(event)">Cerrar</button></div></div>';
  }
  var html='<div class="kanban-tools"><div style="display:flex;align-items:center;gap:6px"><div class="kanban-search"><span class="kanban-search-ico">&#128269;</span>'
    +'<input id="kanban-search" value="'+esc(kanbanSearch)+'" placeholder="Buscar por empresa, contacto, email, comercial, concepto..." oninput="setKanbanSearch(this.value)">'
    +(kanbanSearch?'<button class="kanban-search-clear" onclick="clearKanbanSearch()" title="Limpiar b&uacute;squeda">&times;</button>':'')
    +'</div>'
    +'<select id="comercial-filter" onchange="setComercialFilter(this.value)" style="border:1px solid #B0D1D7;border-radius:4px;padding:4px 10px;font-size:12px;color:#212121;background:#fff;cursor:pointer;height:32px;min-width:160px">'
    +'<option value="">Todos los propietarios</option>'+comOpts+'</select>'
    +(catKeys.length?'<div id="cat-filter-wrap" style="position:relative"><button id="category-filter" type="button" onclick="toggleCatMenu(event)" title="Filtrar por una o varias categor&iacute;as de ingreso" style="border:1px solid '+(catActive?'#0C5580':'#B0D1D7')+';border-radius:4px;padding:4px 10px;font-size:12px;color:'+(catActive?'#0C5580':'#212121')+';font-weight:'+(catActive?'700':'400')+';background:#fff;cursor:pointer;height:32px;min-width:160px;text-align:left;font-family:inherit;display:flex;align-items:center;justify-content:space-between;gap:10px"><span>'+esc(catLabel)+'</span><span style="font-size:9px">&#9660;</span></button>'+catPanel+'</div>':'')
    +'</div><div class="kanban-tool-actions"><button class="btn btn-outline" onclick="openExportCRMModal()" title="Exportar todos los datos del CRM a CSV o Excel">&#8595; Exportar datos</button>'
    +'<div class="kanban-search-count">'+(q||comercialFilter||catActive?visibleTotal+' de '+totalCards+' fichas':'')+'</div></div></div>';
  html+='<div class="kanban'+(activePipeline==="P1"?" uniform-cols":"")+'">';
  allCols.forEach(function(stage){
    var isLost=stage.id==="lost";
    var isPostponed=stage.id==="postponed";
    var isBaja=stage.id==="bajas";
    var isWonCol=activePipeline==="P3"&&!isLost&&!isPostponed&&!isBaja&&stage.prob===100;
    var sl=isLost?lLeads:(isPostponed?pLeads.filter(function(l){return isPostponedLead(l)&&!isAssociateExitLead(l);}):(isBaja?pLeads.filter(isAssociateExitLead):pLeads.filter(function(l){return l.stage===stage.id&&!isPostponedLead(l)&&!isAssociateExitLead(l);})));
    var slTotal=sl.length;
    if(isWonCol&&p3WonEditionFilter.length){

        var ids=getLeadProgramEditionIds(l);

          html+='<button onclick="toggleP3WonEditionFilter(\''+e.id.replace(/\\/g,'\\\\').replace(/'/g,"\\'")+'\''+')" title="'+esc(prog+' \u2013 '+e.name)+'" style="font-size:10px;padding:1px 8px;border-radius:999px;border:1px solid '+(active?'var(--fp)':'var(--fl)')+';background:'+(active?'var(--fp)':'transparent')+';color:'+(active?'#fff':'var(--fd)')+';cursor:pointer;font-family:inherit;white-space:nowrap">'+esc(e.name)+'</button>';

    if(isBaja) html+='<button class="add-btn top-add" onclick="openNewAssociateExit()" title="Registrar baja de asociado desde cero">+</button>';

    sl=sl.slice().sort(function(a,b){var da=getLeadNextContactDate(a),db=getLeadNextContactDate(b);if(da&&db)return da.localeCompare(db);if(da)return -1;if(db)return 1;return 0;});
    sl.forEach(function(lead){

      var cardDraggable = isLost ? '' : 'draggable="true" ondragstart="dragStart('+lead.id+')" ';
      html += '<div class="'+cardClass+'" id="card-'+lead.id+'" '+cardDraggable+'onclick="'+(isBaja?'openAssociateExitModal':'openLead')+'('+lead.id+')">';
      html+='<div class="card-co">'+esc(lead.company)+'</div><div class="card-sec">'+renderEmailLink(lead.sector,'email-link')+'</div>';
      if(isLost&&lead.lostReason) html+='<div class="card-lreason">'+esc(lead.lostReason)+'</div>';

              +(leadDirectivoFiincaUnits(lead)?'<span style="font-size:10px;color:var(--fmu);font-weight:600;vertical-align:middle"> &middot; '+leadDirectivoFiincaUnits(lead)+' dir.</span>':"")

          if(editionLabel) html+='<div class="card-income"><strong>Edici&oacute;n:</strong> '+esc(editionLabel)+'</div>';
        }

        if(nextContact) html+='<div class="card-next'+(isNextContactDue(lead)?' due':'')+'">&#128222; '+(isNextContactDue(lead)?'Contactar hoy/vencido: ':'Pr&oacute;x. contacto: ')+esc(isoToDisplay(nextContact))+'</div>';
        var naCard=getLeadNextAction(lead);
        if(naCard){
          var naCardDue=naCard.dueDate&&naCard.dueDate<todayISO();
          html+='<div class="card-na'+(naCardDue?' due':'')+'">&#9654; '+esc(naCard.text.length>60?naCard.text.slice(0,57)+"…":naCard.text)+(naCard.dueDate?' &middot; '+esc(isoToDisplay(naCard.dueDate)):'')+'</div>';

      if(isLost) html+='<button class="recover-btn" onclick="event.stopPropagation();recoverLead('+lead.id+')">&#8617; Recuperar oportunidad</button>';
      if(activePipeline==='P1'&&!isLost) html+='<button class="rep-p3-btn" onclick="event.stopPropagation();replicateToP3('+lead.id+',event)">&#8594; Duplicar en P3</button>';

  html+='</div>';
  document.getElementById("main-content").innerHTML=html;
}

function toggleCategory(key){

}

function toggleP3WonEditionFilter(id){
  var key=normKey(id);
  var idx=-1;
  p3WonEditionFilter.forEach(function(x,i){if(normKey(x)===key)idx=i;});

function getLeadExportStageLabel(lead){
  if(!lead)return "";
  if(lead.lost)return lead.lostReason ? "Perdida - "+lead.lostReason : "Perdida";
  if(isAssociateExitLead(lead))return "Bajas asociados";
  if(isPostponedLead(lead))return "Aplazadas";
  var pipeline=PIPELINES[lead.pipeline];
  if(!pipeline)return "Sin pipeline";
  var stage=pipeline.stages[lead.stage];
  return stage ? stage.label : "Sin etapa";
}

function excelText(value){
  var text=String(value==null?"":value).replace(/\r?\n/g," ").trim();
  if(/^[=+\-@]/.test(text))text="'"+text;
  return esc(text);
}

function excelCell(value){
  return '<td style="mso-number-format:\'\\@\';">'+excelText(value)+'</td>';
}

function exportPipelineAssignmentsExcel(){
  var rows=leads.slice().sort(function(a,b){
    var pa=String(a.pipeline||""), pb=String(b.pipeline||"");
    if(pa!==pb)return pa.localeCompare(pb,"es",{numeric:true,sensitivity:"base"});
    if(!!a.lost!==!!b.lost)return a.lost?1:-1;
    var sa=Number(a.stage), sb=Number(b.stage);
    if(sa!==sb)return sa-sb;
    return String(a.company||"").localeCompare(String(b.company||""),"es",{sensitivity:"base"});
  });
  if(!rows.length){
    alert("No hay fichas para exportar.");
    return;
  }
  var body=rows.map(function(l){
    var pipeline=PIPELINES[l.pipeline];
    return '<tr>'
      +excelCell(l.pipeline+(pipeline?" - "+pipeline.label:""))
      +excelCell(l.company||"")
      +excelCell(leadConceptLabel(l)||"Sin categor\u00eda de ingreso")
      +excelCell(leadProgramEditionsLabel(l)||"")
      +excelCell(getLeadExportStageLabel(l))
      +excelCell(l.comercial||"Sin asignar")
      +excelCell("")
      +'</tr>';
  }).join("");
  var generatedAt=new Date().toLocaleString("es-ES");

function exportCRMData(format){
  var generatedAt=new Date().toLocaleString("es-ES");
  var dateStr=new Date().toISOString().slice(0,10);

  var sorted=leads.slice().sort(function(a,b){
    var pa=String(a.pipeline||""),pb=String(b.pipeline||"");
    if(pa!==pb)return pa.localeCompare(pb,"es",{numeric:true,sensitivity:"base"});
    return String(a.company||"").localeCompare(String(b.company||""),"es",{sensitivity:"base"});
  });

  function getStatus(l){
    if(l.lost)return "Perdida";
    if(isAssociateExitLead(l))return "Baja asociado";
    if(isWonLead(l))return "Ganada";
    if(isPostponedLead(l))return "Aplazada";
    return "Activa";
  }
  function getProb(l){
    if(l.probCustom!=null)return l.probCustom;
    var p=PIPELINES[l.pipeline];if(!p)return "";
    var s=p.stages[l.stage];return s?(s.prob!==null?s.prob:""):"";
  }
  function getWeighted(l){
    var pr=getProb(l);if(pr===""||pr==null)return "";
    return Math.round((Number(l.importe)||0)*Number(pr)/100);
  }
  function getLastActivity(l){
    var ns=(l.obs||[]).filter(function(o){return o&&o.type==="user"&&String(o.text||"").trim();});
    if(!ns.length)return "";
    return ns.map(function(o){return dateOnlyISO(o.date)||"";}).filter(Boolean).sort().slice(-1)[0]||"";
  }
  function getNotes(l){
    var ns=(l.obs||[]).filter(function(o){return o&&o.type==="user"&&String(o.text||"").trim();});
    ns.sort(function(a,b){return (dateOnlyISO(b.date)||"").localeCompare(dateOnlyISO(a.date)||"");});
    return ns.slice(0,20).map(function(o){return "["+(dateOnlyISO(o.date)||"s/f")+"]: "+String(o.text||"").trim();}).join(" || ").substring(0,3000);
  }
  function getPipelineLabel(l){var p=PIPELINES[l.pipeline];return l.pipeline+(p?" - "+p.label:"");}
  function getConceptInfo(l){
    var ds=leadConceptDetails(l);
    if(!ds.length)return {conceptos:"",matriculas:"",descuento:""};
    return {
      conceptos:ds.map(function(d){return d.concepto;}).join("; "),
      matriculas:ds.map(function(d){return d.concepto+": "+(d.matriculas||0);}).join("; "),
      descuento:ds.map(function(d){return d.concepto+": "+(d.descuento||0)+"%";}).join("; ")
    };
  }
  function countNotes(l){return (l.obs||[]).filter(function(o){return o&&o.type==="user"&&String(o.text||"").trim();}).length;}

  var oppCols=["ID_Ficha","Pipeline","Nombre_Cuenta","Estado","Etapa_Actual","Probabilidad_pct",
    "Importe_Potencial_EUR","Importe_Ponderado_EUR","Responsable_Comercial",
    "Categoria_Ingreso","Concepto_Ingreso_Detalle","Programas_Formativos",
    "Conceptos_P3","Matriculas_P3","Descuento_P3",
    "Motivo_Perdida","Num_Actividades","Fecha_Ultima_Actividad","Notas_Historial"];

  var oppRows=sorted.map(function(l){
    var ci=getConceptInfo(l);
    return [l.id||"",getPipelineLabel(l),l.company||"",getStatus(l),
      getLeadExportStageLabel(l),getProb(l),
      Number(l.importe)||0,getWeighted(l),l.comercial||"",
      leadConceptLabel(l)||"",ci.conceptos,leadProgramEditionsLabel(l)||"",
      ci.conceptos,ci.matriculas,ci.descuento,
      l.lostReason||"",countNotes(l),getLastActivity(l),getNotes(l)];
  });

  var actCols=["ID_Actividad","ID_Ficha_Relacionada","Empresa","Pipeline",
    "Tipo_Actividad","Fecha","Descripcion","Responsable"];
  var actRows=[];var actId=1;
  sorted.forEach(function(l){
    (l.obs||[]).forEach(function(o){
      if(!o||!String(o.text||"").trim()||o.type==="next_action")return;
      var tipo="Nota";
      if(o.type==="postpone")tipo="Aplazamiento";
      else if(o.type==="associate_exit")tipo="Baja";
      else if(o.auto==="next_action")tipo="Pr\xf3xima acci\xf3n";
      else if(typeof isClosedMeetingNote==="function"&&isClosedMeetingNote(o.text))tipo="Reuni\u00f3n";
      actRows.push([actId++,l.id||"",l.company||"",getPipelineLabel(l),
        tipo,dateOnlyISO(o.date)||"",String(o.text||"").trim().substring(0,1000),l.comercial||""]);
    });
  });

  if(format==="csv"){
    function toCSV(cols,rows){
      function esc2(v){var s=String(v==null?"":v).replace(/"/g,'""');if(/[,"\n]/.test(s))s='"'+s+'"';return s;}
      return [cols.join(",")].concat(rows.map(function(r){return r.map(esc2).join(",");})).join("\r\n");
    }
    function dl(content,name){
      var b=new Blob(["\ufeff",content],{type:"text/csv;charset=utf-8"});
      var u=URL.createObjectURL(b);var a=document.createElement("a");
      a.href=u;a.download=name;document.body.appendChild(a);a.click();document.body.removeChild(a);
      setTimeout(function(){URL.revokeObjectURL(u);},1000);
    }
    dl(toCSV(oppCols,oppRows),"Dynamics_Oportunidades_"+dateStr+".csv");
    setTimeout(function(){dl(toCSV(actCols,actRows),"Dynamics_Actividades_"+dateStr+".csv");},800);

  }else{
    function th2(v){return '<th style="background:#0C5580;color:#fff;font-weight:700;padding:5px 8px;border:1px solid #B0D1D7;white-space:nowrap;font-size:10pt">'+esc(v)+'</th>';}
    function td2(v){return '<td style="mso-number-format:\'\\@\';padding:4px 7px;border:1px solid #E5E7EB;font-size:9pt;vertical-align:top">'+excelText(v)+'</td>';}
    function tdN2(v){return '<td style="padding:4px 7px;border:1px solid #E5E7EB;font-size:9pt;text-align:right">'+esc(String(v==null?"":v))+'</td>';}
    var numIdx=[5,6,7,16];
    var html2='<!DOCTYPE html><html><head><meta charset="UTF-8">'
      +'<style>body{font-family:Calibri,Arial,sans-serif}table{border-collapse:collapse;width:100%;margin-bottom:40px}tr:nth-child(even){background:#F8FAFC}'
      +'.sect{margin-top:24px;margin-bottom:8px;font-size:14pt;font-weight:700;color:#0C5580}'
      +'.meta{color:#757575;font-size:10pt;margin-bottom:16px}</style></head><body>'
      +'<div class="meta">Exportaci&oacute;n CRM FIN &rarr; Microsoft Dynamics 365 &nbsp;&middot;&nbsp; '+excelText(generatedAt)+'</div>'
      +'<div class="sect">Oportunidades &amp; Cuentas ('+oppRows.length+' registros)</div>'
      +'<table><thead><tr>'+oppCols.map(th2).join("")+'</tr></thead><tbody>'
      +oppRows.map(function(r){return '<tr>'+r.map(function(v,i){return numIdx.indexOf(i)!==-1?tdN2(v):td2(v);}).join("")+'</tr>';}).join("")
      +'</tbody></table>'
      +'<div class="sect">Actividades &amp; Notas ('+actRows.length+' registros)</div>'
      +'<table><thead><tr>'+actCols.map(th2).join("")+'</tr></thead><tbody>'
      +actRows.map(function(r){return '<tr>'+r.map(function(v,i){return i===0?tdN2(v):td2(v);}).join("")+'</tr>';}).join("")
      +'</tbody></table></body></html>';
    var b2=new Blob(["\ufeff",html2],{type:"application/vnd.ms-excel;charset=utf-8"});
    var u2=URL.createObjectURL(b2);var a2=document.createElement("a");
    a2.href=u2;a2.download="Dynamics_CRM_FIN_"+dateStr+".xls";
    document.body.appendChild(a2);a2.click();document.body.removeChild(a2);
    setTimeout(function(){URL.revokeObjectURL(u2);},1000);
  }
}

function colOver(sid){
  var el=document.getElementById("col-"+sid);
  if(el){el.classList.remove("over","over-lost");el.classList.add(sid==="lost"?"over-lost":"over");}
}
function colLeave(sid){
  var el=document.getElementById("col-"+sid);
  if(el)el.classList.remove("over","over-lost");
}
function colDrop(sid){
  colLeave(sid);
  if(dragId==null)return;
  if(sid==="lost"){ var tmp=dragId; dragId=null; openLostModal(tmp); }
  else if(sid==="postponed"){ var postponedId=dragId; dragId=null; openPostponeModal(postponedId); }
  else if(sid==="bajas"){ var bajaId=dragId; dragId=null; openAssociateExitModal(bajaId); }
  else{
    var l=getLead(dragId);
    if(l){
      var nextStage=Number(sid);
      if(l.stage!==nextStage){
        l.stage=nextStage;
        l.days=0;
        stampLeadStageEntry(l,todayISO());
      }
      clearPostponedFlag(l);
      clearAssociateExitFlag(l);
      var _l=l;
      sbPatch("leads",l.id,{stage:l.stage,days:l.days,obs:l.obs});
    }
    dragId=null; refresh();
    setTimeout(function(){if(_l)checkAndTriggerAutomations(_l);},100);
  }
}

  if(mode==="pdf"){
    var pw=window.open("","_blank");
    if(!pw){alert("El navegador ha bloqueado la ventana emergente. Permite ventanas emergentes para este sitio e int\xe9ntalo de nuevo.");return;}
    pw.document.open();
    pw.document.write(html.replace("</body>",'<script>window.addEventListener("load",function(){setTimeout(function(){window.focus();window.print();},500);});<\/script></body>'));
    pw.document.close();
    return;
  }
  var blob=new Blob([html],{type:"text/html;charset=utf-8"});
  var a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download=(isFl?"Plan_comercial_FL_NL_Feb2027_FIN_":"Plan_comercial_empresas_FIN_"+pcEj()+"_")+iso+".html";
  // Hist\xf3rico: cada descarga deja un resumen de las cifras clave (se ve en Config)
  if(!isFl)try{
    var hs=(planCfg.historial||[]).slice();
    hs.push(Object.assign({fecha:iso},window.__planSnap||{}));
    planCfg.historial=hs.slice(-40);
    sbPatchConfig("planComercial",planCfg);
  }catch(e){}
  document.body.appendChild(a);
  a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},2000);
}

function addPricingConcept(){
  var name=((document.getElementById("pricing-new-concept")||{}).value||"").trim();
  if(!name)return;
  var amount=((document.getElementById("pricing-new-amount")||{}).value||"").trim();
  var mat=!!((document.getElementById("pricing-new-mat")||{}).checked);
  if(!hasConcept(conceptosIngreso,name))conceptosIngreso.push(name);
  if(mat&&!hasConcept(conceptosConMatriculas,name))conceptosConMatriculas.push(name);
  if(amount!=="")importesConcepto[name]=Number(amount)||0;
  sbPatchConfig("conceptosIngreso", conceptosIngreso);
  sbPatchConfig("conceptosConMatriculas", conceptosConMatriculas);
  sbPatchConfig("importesConcepto", importesConcepto);
  renderPricing();
}

// Live setters - save immediately and update ponderado inline without re-rendering the modal
function refreshPonderado(id){
  var l=getLead(id); if(!l)return;
  var imp=document.getElementById("lead-importe-"+id);
  if(imp)imp.value=l.importe||"";
  var el=document.getElementById("lead-pond-"+id); if(!el)return;
  var p=getProb(l);
  el.textContent=(l.importe&&p!=null)?fmt(l.importe*p/100):"-";
}
function refreshLeadHeader(id){
  var l=getLead(id); if(!l)return;
  var co=document.getElementById("lead-h-company-"+id);
  var sub=document.getElementById("lead-h-sub-"+id);
  if(co)co.textContent=l.company||"";
  if(sub)sub.innerHTML=renderLeadSubline(l);
}
function refreshActiveDataView(){
  syncLeadStageDays(false);
  renderKPIs();
  if(currentView==="kanban")renderKanban();
  if(currentView==="dashboard")renderDashboard();
}
function liveSetCompany(id,val){
  var l=getLead(id);if(!l)return;
  l.company=val;
  refreshLeadHeader(id);
  if(currentView==="kanban")renderKanban();
  sbPatch("leads",id,{company:l.company});
}
function liveSetSector(id,val){
  var l=getLead(id);if(!l)return;
  l.sector=val;
  refreshLeadHeader(id);
  if(currentView==="kanban")renderKanban();
  sbPatch("leads",id,{sector:l.sector});

function liveSetContactParts(id){
  var l=getLead(id);if(!l)return;
  var name=(document.getElementById("lead-contact-name-"+id)||{}).value||"";

  var l=getLead(id);if(!l||l.pipeline!=="P3")return;

function saveLeadProgramEditionIds(id,ids){
  var l=getLead(id);if(!l||l.pipeline!=="P3")return;
  setLeadProgramEditionsMeta(l,ids);
  refreshActiveDataView();
  if(selectedLeadId===id)renderLeadModal(id);
  sbPatch("leads",id,{obs:l.obs});
}
function liveSetProgramEditionLine(id,idx,val){
  var l=getLead(id);if(!l||l.pipeline!=="P3")return;
  var ids=getLeadProgramEditionIds(l);
  if(!ids.length)ids=[""];
  ids[idx]=val||"";
  saveLeadProgramEditionIds(id,ids);
}
function addLeadProgramEdition(id){
  var l=getLead(id);if(!l||l.pipeline!=="P3")return;
  var ids=getLeadProgramEditionIds(l);
  var used=ids.map(normKey);
  var next=(programEditions.find(function(e){return used.indexOf(normKey(e.id))===-1;})||{}).id||"";
  ids.push(next);
  saveLeadProgramEditionIds(id,ids);
}
function removeLeadProgramEdition(id,idx){
  var l=getLead(id);if(!l||l.pipeline!=="P3")return;
  var ids=getLeadProgramEditionIds(l);
  ids.splice(idx,1);

function addObs(id){
  var inp=document.getElementById("obs-input-"+id);
  var txt=inp?inp.value.trim():"";
  var l=getLead(id);
  if(!txt){
    var naOnlyTxt=((document.getElementById("na-text-"+id)||{}).value||"").trim();
    var naOnlyDate=(document.getElementById("na-date-"+id)||{}).value||"";
    if(!naOnlyTxt){showSaveError("Escribe una nota o define una pr\xf3xima acci\xf3n.");return;}
    if(!naOnlyDate||naOnlyDate<todayISO()){showSaveError(!naOnlyDate?"Indica el plazo de la pr\xf3xima acci\xf3n.":"El plazo de la pr\xf3xima acci\xf3n no puede ser una fecha pasada.");return;}
    if(l)setLeadNextAction(id,naOnlyTxt,naOnlyDate,"Pr\xf3xima acci\xf3n definida: \xab"+naOnlyTxt+"\xbb con plazo "+isoToDisplay(naOnlyDate)+".");
    return;
  }
  var naTxt="",naDate="",prevObs=null,prevNC=null;
  if(l){
    naTxt=((document.getElementById("na-text-"+id)||{}).value||"").trim();
    naDate=(document.getElementById("na-date-"+id)||{}).value||"";
    if(!naTxt||!naDate||naDate<todayISO()){
      var naBox=document.getElementById("na-new-"+id);
      if(naBox)naBox.classList.add("err");
      var naIn=document.getElementById("na-text-"+id);
      if(naIn&&!naTxt)naIn.focus();
      showSaveError(!naTxt||!naDate?"Antes de guardar la nota, indica la pr\xf3xima acci\xf3n y su plazo.":"El plazo de la pr\xf3xima acci\xf3n no puede ser una fecha pasada.");
      return;
    }
    prevObs=(l.obs||[]).slice();
    prevNC=l.nextContactDate;
    applyNextActionToObs(l,naTxt,naDate);
  }
  var obsAuthor=l&&l.comercial?l.comercial:"Sin asignar";
  var obsEntry={author:obsAuthor,date:nowStr(),type:"user",text:txt};
  if(naTxt){obsEntry.nextAction=naTxt;obsEntry.nextActionDue=naDate;}
  if(l){l.obs.push(obsEntry);}
  if(inp)inp.value="";
  var addedDiv=null;
  var list=document.getElementById("obs-list-"+id);
  if(list){
    addedDiv=document.createElement("div");
    addedDiv.className="obs-e";
    addedDiv.innerHTML='<div class="obs-meta"><span class="obs-auth">'+esc(obsAuthor)+'</span><span>'+nowStr()+'</span></div><div class="obs-txt">'+esc(txt)+'</div>';
    list.appendChild(addedDiv);
    list.scrollTop=list.scrollHeight;
  }
  if(l){
    refreshActiveDataView();
    if(selectedLeadId===id)renderLeadModal(id);
    sbPatch("leads",id,{obs:l.obs}).then(function(res){
      if(!Array.isArray(res)||res.length===0){
        l.obs=prevObs;l.nextContactDate=prevNC;
        if(addedDiv&&addedDiv.parentNode)addedDiv.parentNode.removeChild(addedDiv);
        if(inp)inp.value=txt;
        showSaveError("Error al guardar la nota. Inténtalo de nuevo.");
      }
    }).catch(function(){
      l.obs=prevObs;l.nextContactDate=prevNC;
      if(addedDiv&&addedDiv.parentNode)addedDiv.parentNode.removeChild(addedDiv);
      if(inp)inp.value=txt;
      showSaveError("Sin conexión. La nota no se guardó — el texto está de nuevo en el cuadro.");
    });
  }
}
