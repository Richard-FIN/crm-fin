function replicateToP3(leadId, evt){
  evt.stopPropagation();
  var existing=document.getElementById('rep-p3-popup');
  if(existing){existing.remove();return;}
  var lead=getLead(leadId);
  if(!lead)return;
  var stages=PIPELINES['P3'].stages;
  var popup=document.createElement('div');
  popup.id='rep-p3-popup';
  popup.style.cssText='position:fixed;z-index:9999;background:#fff;border:1px solid #B0D1D7;border-radius:8px;box-shadow:0 4px 24px rgba(0,0,0,.18);padding:18px 20px;min-width:270px;';
  var cx=Math.min(evt.clientX,window.innerWidth-290);
  var cy=Math.min(evt.clientY+8,window.innerHeight-320);
  popup.style.left=cx+'px';popup.style.top=cy+'px';
  var h='<div style="font-size:12px;font-weight:700;color:#0C5580;margin-bottom:6px">Duplicar en P3</div>'
    +'<div style="font-size:11px;color:#757575;margin-bottom:12px">'+esc(lead.company)+' &rarr; P3 Formaci\xf3n<br>Selecciona la fase de destino:</div>';
  stages.forEach(function(s){
    h+='<button onclick="doReplicateToP3('+leadId+','+s.id+')" style="display:block;width:100%;text-align:left;background:#EEF5F7;border:1px solid #B0D1D7;border-radius:5px;padding:8px 12px;margin-bottom:6px;cursor:pointer;font-size:12px;font-family:inherit;">'
      +'<span style="color:#0C5580;font-weight:700">'+esc(s.short)+'</span>'
      +'<span style="color:#9E9E9E;font-size:10px;margin-left:8px;">'+s.prob+'%</span>'
      +'</button>';
  });
  h+='<button onclick="document.getElementById(\'rep-p3-popup\').remove()" style="width:100%;background:none;border:none;color:#9E9E9E;font-size:11px;cursor:pointer;margin-top:2px;padding:4px;font-family:inherit;">Cancelar</button>';
  popup.innerHTML=h;
  document.body.appendChild(popup);
  setTimeout(function(){
    document.addEventListener('click',function _cp(e){
      var p=document.getElementById('rep-p3-popup');
      if(p&&!p.contains(e.target)){p.remove();document.removeEventListener('click',_cp);}
    });
  },120);
}
function doReplicateToP3(leadId, stageId){
  var p=document.getElementById('rep-p3-popup');if(p)p.remove();
  var src=getLead(leadId);if(!src)return;
  var stageLabel=(PIPELINES['P3'].stages[stageId]||{}).short||'Etapa '+stageId;
  var sysNote={author:'Sistema',date:nowStr(),type:'system',
    text:'Ficha replicada desde P1 → P3 \xb7 Etapa de destino: '+stageLabel};
  // Copiar obs del origen excluyendo stage_meta (son etapas del P1, no aplican)
  var srcObs=(src.obs||[]).filter(function(o){return o.type!=='stage_meta';});
  var newLead={
    pipeline:'P3',
    company:src.company,
    sector:src.sector||'',
    stage:stageId,
    days:0,
    comercial:src.comercial||'',
    importe:src.importe!=null?src.importe:null,
    probCustom:null,
    concepto:src.concepto||null,
    matriculas:src.matriculas!=null?src.matriculas:null,
    contact:src.contact||'',
    lost:false,
    lostReason:'',
    obs:[sysNote].concat(srcObs)
  };
  stampLeadStageEntry(newLead,todayISO());
  sbPost('leads',leadToDb(newLead)).then(function(rows){
    var saved=Array.isArray(rows)?rows[0]:rows;
    if(saved&&saved.id){
      newLead.id=saved.id;
      leads.push(newLead);
      _repToast('Ficha replicada en P3 – '+stageLabel);
    } else {
      alert('Error al replicar la ficha en P3.');
    }
  }).catch(function(){alert('Error de conexi\xf3n al replicar la ficha.');});
}
function _repToast(msg){
  var t=document.createElement('div');
  t.style.cssText='position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:#059669;color:#fff;padding:10px 22px;border-radius:6px;font-size:13px;font-weight:600;z-index:10000;box-shadow:0 3px 12px rgba(0,0,0,.2);font-family:inherit;pointer-events:none;';
  t.textContent=msg;
  document.body.appendChild(t);
  setTimeout(function(){t.style.transition='opacity .4s';t.style.opacity='0';setTimeout(function(){if(t.parentNode)t.remove();},400);},3000);
}

  };
  if(newLead.pipeline==="P3"){
    setLeadContactoPrevioMeta(newLead, ((document.getElementById("nl-contacto-previo")||{}).value||CONTACTO_PREVIO_CON));
    setLeadProgramEditionsMeta(newLead, getNewLeadProgramEditionIds());
  }
  if(naTxt){

    pushNextActionActivity(newLead,"Pr\xf3xima acci\xf3n definida: \xab"+naTxt+"\xbb con plazo "+isoToDisplay(naDate)+".");
  }
  stampLeadStageEntry(newLead,todayISO());
  closeModal();
  sbPost("leads", leadToDb(newLead)).then(function(rows){
    var saved=Array.isArray(rows)?rows[0]:rows;

function editEq(i){
  var row=document.getElementById("eq-row-"+i);
  if(!row)return;
  var cur=comerciales[i];
  row.innerHTML='<input class="eq-inp" id="eq-inp-'+i+'" value="'+esc(cur)+'" onblur="saveEq('+i+')" onkeydown="if(event.key===\'Enter\')saveEq('+i+')">'
    +'<button class="btn btn-outline btn-sm" onclick="saveEq('+i+')">&#10003; OK</button>';
  var inp=document.getElementById("eq-inp-"+i);
  if(inp)inp.focus();
}
function saveEq(i){
  var inp=document.getElementById("eq-inp-"+i);
  if(inp&&inp.value.trim()){
    var oldNombre=comerciales[i];
    var newNombre=inp.value.trim();
    comerciales[i]=newNombre;
    // PATCH by nombre
    fetch(SB_URL+"/rest/v1/comerciales?nombre=eq."+encodeURIComponent(oldNombre),{
      method:"PATCH",headers:sbHeaders({"Prefer":"return=representation"}),
      body:JSON.stringify({nombre:newNombre})
    });
  }
  renderEquipoModal();
}
function removeEq(i){
  var nombre=comerciales[i];
  comerciales.splice(i,1);
  fetch(SB_URL+"/rest/v1/comerciales?nombre=eq."+encodeURIComponent(nombre),{method:"DELETE",headers:sbHeaders()});
  renderEquipoModal();
}
function addEq(){
  var inp=document.getElementById("eq-new");
  if(inp&&inp.value.trim()){
    var nombre=inp.value.trim();
    comerciales.push(nombre);
    sbPost("comerciales",{nombre:nombre});
  }
  renderEquipoModal();
}

function buildP1EvolutionHTML(p1,sinceDays,cutoffISO){
  function obsDateToISO(d){
    var p=(d||"").split(" ")[0].split("/");
    return p.length===3?(p[2]+"-"+p[1]+"-"+p[0]):"";
  }
  function stgLabel(pipeline,stageId){
    var pp=PIPELINES[pipeline];if(!pp)return "—";
    var s=pp.stages[Number(stageId)];return s?s.label:"Etapa "+(Number(stageId)+1);
  }
  function toTitleCase(s){
    return (s||"").toLowerCase().replace(/(^|\s)\S/g,function(c){return c.toUpperCase();});
  }

  var allP1=leads.filter(function(l){return l.pipeline==="P1";});
  var events=[];

  allP1.forEach(function(lead){
    var latestNote=latestUserNote(lead);
    var noteDate=latestNote?(isoToDisplay(obsDateToISO(latestNote.date))||"—"):"—";
    var nextContactISO=getLeadNextContactDate(lead);
    var nextContact=nextContactISO?isoToDisplay(nextContactISO):"—";

    var meta=(lead.obs||[]).filter(function(o){return o&&o.type==="stage_meta"&&o.enteredAt;})
      .sort(function(a,b){return (a.enteredAt||"").localeCompare(b.enteredAt||"");});
    meta.forEach(function(entry,idx){

          dateISO:entry.enteredAt,

// ============================================================
// INFORME GLOBAL — Funnel por comercial
// ============================================================
function generateGlobalReport(){
  var dInput=window.prompt("\xbfCu\xe1ntos d\xedas atr\xe1s analizar?\n(Dejar en blanco para ver todos los registros)","");
  if(dInput===null)return;
  var sinceDays=dInput.trim()===""?0:Math.min(Math.max(1,Math.round(Number(dInput)||0)),365);

  // Abrir la ventana inmediatamente para que el navegador la reconozca como gesto del usuario
  var w=window.open("","_blank");
  if(!w){alert("El navegador ha bloqueado la ventana emergente. Permite ventanas emergentes para este sitio e inténtalo de nuevo.");return;}

  try {
  var today=new Date();
  var dd=pad(today.getDate()),mm=pad(today.getMonth()+1),yyyy=today.getFullYear();
  var dateStr=dd+"/"+mm+"/"+yyyy;
  var todayISO=yyyy+"-"+mm+"-"+dd;
  var cutoffISO=sinceDays>0?addDaysISO(todayISO,-sinceDays):null;

  // Categorizar etapa: lead / oportunidad / caliente / won / otra
  function catStage(l){
    if(isWonLead(l))return "won";
    if(isPostponedLead(l))return "aplazada";
    var p=PIPELINES[l.pipeline];if(!p)return "otra";
    var s=p.stages[l.stage];
    var lbl=s?normKey(s.label):"";
    if(lbl.indexOf("lead")!==-1||lbl.indexOf("cualificada")!==-1||lbl.indexOf("asiste")!==-1)return "lead";
    if(lbl.indexOf("oportunidad")!==-1)return "oportunidad";
    if(lbl.indexOf("caliente")!==-1||lbl.indexOf("cliente")!==-1||lbl.indexOf("comprometido")!==-1||lbl.indexOf("ficha enviada")!==-1)return "caliente";
    return "otra";
  }

  // Solo fichas activas (no perdidas); las "bajas de asociada" sí cuentan como actividad
  var activas=leads.filter(function(l){
    if(l.lost)return false;
    if(!cutoffISO)return true;
    var meta=(l.obs||[]).filter(function(o){return o&&o.type==="stage_meta"&&o.enteredAt;})
      .sort(function(a,b){return b.enteredAt.localeCompare(a.enteredAt);});
    var lastEntry=meta.length?meta[0].enteredAt:"0000-00-00";
    return lastEntry>=cutoffISO;
  });

  // Agrupar por comercial
  var byComercial={};
  function ensureComercial(name){
    if(!byComercial[name])byComercial[name]={lead:0,oportunidad:0,caliente:0,won:0,aplazada:0,otra:0,
      eurLead:0,eurOportunidad:0,eurCaliente:0,eurWon:0};
  }
  function normalizeComercial(name){
    var n=(name||"Sin asignar").trim();
    if(n==="MA"||normKey(n)==="ma")return "Mar\xeda \xc1ngeles";
    return n;
  }
  activas.forEach(function(l){
    var com=normalizeComercial(l.comercial);
    ensureComercial(com);
    var cat=catStage(l);
    var eur=Number(l.importe)||0;
    byComercial[com][cat]=(byComercial[com][cat]||0)+1;
    if(cat==="lead")byComercial[com].eurLead+=eur;
    else if(cat==="oportunidad")byComercial[com].eurOportunidad+=eur;
    else if(cat==="caliente")byComercial[com].eurCaliente+=eur;
    else if(cat==="won")byComercial[com].eurWon+=eur;
  });

  var _excluidos=["julen/gonza"];
  var comerciales=Object.keys(byComercial)
    .filter(function(c){return _excluidos.indexOf(normKey(c))===-1;})
    .sort(function(a,b){return a.localeCompare(b,"es");});

  // Totales globales

    // Header
    +'<header style="background:#0C5580;padding:16px 36px;display:flex;justify-content:space-between;align-items:center">'

    +'</div></header>'
    // Body

    +'</div>'

  w.document.write(html);

  } catch(e){

  progBoxes+='<label style="display:flex;align-items:center;gap:8px;padding:6px 0;cursor:pointer">'
    +'<input type="checkbox" name="prog" value="__none__" checked style="width:16px;height:16px;cursor:pointer">'
    +'<span style="font-size:14px;color:#757575;font-style:italic">Sin categor\xeda asignada</span></label>';

  var formHTML='<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Informe P3</title>'
    +'<style>*{box-sizing:border-box}body{font-family:\'Helvetica Neue\',Helvetica,Arial,sans-serif;background:#EEF5F7;margin:0;padding:28px}'
    +'h2{color:#1F4E79;font-size:18px;font-weight:700;margin:0 0 6px}'
    +'.sub{color:#757575;font-size:12px;margin:0 0 20px}'
    +'h3{color:#0C5580;font-size:11px;font-weight:700;margin:0 0 10px;text-transform:uppercase;letter-spacing:.05em}'
    +'.card{background:#fff;border:1px solid #B0D1D7;border-radius:6px;padding:16px 20px;margin-bottom:14px}'
    +'input[type=number]{border:1px solid #B0D1D7;border-radius:4px;padding:7px 10px;font-size:14px;width:80px;color:#212121}'
    +'button{background:#0C5580;color:#fff;border:none;border-radius:4px;padding:11px 30px;font-size:14px;font-weight:700;cursor:pointer;margin-top:4px}'
    +'button:hover{background:#1F4E79}</style></head><body>'
    +'<h2>Informe Pipeline P3 — Venta Formaci\xf3n</h2>'
    +'<p class="sub">Selecciona los par\xe1metros del informe</p>'
    +'<div class="card"><h3>Comerciales</h3>'+comBoxes+'</div>'
    +'<div class="card"><h3>Categor\xeda de ingreso</h3>'+progBoxes+'</div>'
    +'<div class="card"><h3>Per\xedodo de evoluci\xf3n</h3>'
    +'<label style="display:flex;align-items:center;gap:10px;font-size:14px;color:#212121">'
    +'\xdaltimos\xa0<input type="number" id="sinceDays" value="7" min="1" max="365">\xa0d\xedas</label></div>'
    +'<button onclick="doGenerate()">Generar informe →</button>'
    +'<script>function doGenerate(){'
    +'var cbs=document.querySelectorAll("input[name=com]:checked");'
    +'var selComs=Array.from(cbs).map(function(c){return c.value;});'
    +'var pbs=document.querySelectorAll("input[name=prog]:checked");'
    +'var selProgs=Array.from(pbs).map(function(c){return c.value;});'
    +'var days=Math.min(Math.max(1,parseInt(document.getElementById("sinceDays").value)||7),365);'
    +'window.opener._p3ReportGenerate({sinceDays:days,selectedComs:selComs,selectedProgs:selProgs});}'
    +'<\/script></body></html>';

  w.document.write(formHTML);
  w.document.close();

  window._p3ReportGenerate=function(params){
    var sinceDays=params.sinceDays||7;
    var selectedComs=params.selectedComs||[];
    var selectedProgs=params.selectedProgs||[];
    var today=new Date();
    var dd=pad(today.getDate()),mm=pad(today.getMonth()+1),yyyy=today.getFullYear();
    var dateStr=dd+"/"+mm+"/"+yyyy;
    var todayISO=yyyy+"-"+mm+"-"+dd;
    var cutoffISO=addDaysISO(todayISO,-sinceDays);

    function fmtEur(n){var s=String(Math.round(n||0)).replace(/\B(?=(\d{3})+(?!\d))/g,".");return "€"+s;}

    function getLeadProgram(l){
      var lIds=getLeadProgramEditionIds(l);
      if(!lIds.length)return "—";
      var progs=(trainingEditionPrograms||[]).filter(function(prog){
        var pIds=programEditions.filter(function(e){return normKey(e.program)===normKey(prog);}).map(function(e){return e.id;});
        return lIds.some(function(id){return pIds.indexOf(id)!==-1;});
      });
      return progs.length?progs.join(", "):"—";
    }

    var p3=leads.filter(function(l){
      if(l.pipeline!=='P3'||l.lost)return false;
      if(selectedComs.length&&selectedComs.indexOf(normKey(l.comercial||''))===-1)return false;
      if(selectedProgs.length){
        var lProg=getLeadProgram(l);
        var progKey=lProg==='—'?'__none__':lProg;
        if(selectedProgs.indexOf(progKey)===-1)return false;
      }
      return true;
    });

    var stages=PIPELINES.P3.stages;
    var stagePalette=["#0C5580","#0891B2","#D97706","#EA580C","#059669"];

    function rptRow(l){
      var nextDate=getLeadNextContactDate(l);
      var nextStr=nextDate?isoToDisplay(nextDate):"—";
      var overdue=nextDate&&nextDate<todayISO;
      var note=latestUserNote(l);
      var noteTxt=note?note.text:"—";
      var noteDate=note&&note.date?note.date:"—";
      var createdISO=getCreationDateFromObs(l.obs)||dateOnlyISO(l.createdAt);
      var createdStr=createdISO?isoToDisplay(createdISO):"—";
      var prog=getLeadProgram(l);
      var eur=Number(l.importe)||0;
      return '<tr>'
        +'<td style="font-weight:600;color:#0C5580">'+esc(l.company)+'</td>'
        +'<td style="white-space:nowrap;color:#212121">'+esc(l.comercial||"—")+'</td>'
        +'<td style="white-space:nowrap;color:#0891B2;font-size:11px">'+esc(prog)+'</td>'
        +'<td style="text-align:right;font-variant-numeric:tabular-nums;font-weight:600;color:#0C5580">'+fmtEur(eur)+'</td>'
        +'<td style="white-space:nowrap;color:#757575">'+esc(createdStr)+'</td>'
        +'<td style="white-space:nowrap;color:#757575">'+esc(noteDate)+'</td>'
        +'<td style="white-space:nowrap;'+(overdue?'color:#BC262E;font-weight:700':'color:#0C5580')+'">'+esc(nextStr)+(overdue?' ⚠':'')+'</td>'
        +'<td style="color:#757575;font-size:11px;font-style:italic">'+esc(noteTxt)+'</td>'
        +'</tr>';
    }

    function rptRowLost(l){
      var note=latestUserNote(l);
      var noteTxt=note?note.text:"—";
      var noteDate=note&&note.date?note.date:"—";
      var createdISO=getCreationDateFromObs(l.obs)||dateOnlyISO(l.createdAt);
      var createdStr=createdISO?isoToDisplay(createdISO):"—";
      var prog=getLeadProgram(l);
      var eur=Number(l.importe)||0;
      return '<tr>'
        +'<td style="font-weight:600;color:#BC262E">'+esc(l.company)+'</td>'
        +'<td style="white-space:nowrap;color:#212121">'+esc(l.comercial||"—")+'</td>'
        +'<td style="white-space:nowrap;color:#0891B2;font-size:11px">'+esc(prog)+'</td>'
        +'<td style="text-align:right;font-variant-numeric:tabular-nums;color:#757575">'+fmtEur(eur)+'</td>'
        +'<td style="white-space:nowrap;color:#757575">'+esc(createdStr)+'</td>'
        +'<td style="white-space:nowrap;color:#757575">'+esc(noteDate)+'</td>'
        +'<td style="white-space:nowrap;color:#BC262E;font-style:italic">'+esc(l.lostReason||"—")+'</td>'
        +'<td style="color:#757575;font-size:11px;font-style:italic">'+esc(noteTxt)+'</td>'
        +'</tr>';
    }

    function rptSectionLost(count,rows){
      var hdrs=['Empresa','Responsable','Programa','Importe','F. apertura','F. \xfalt. nota','Motivo descarte','\xdaltima nota'];
      var wds=["14%","8%","10%","7%","8%","8%","12%",""];
      return '<div class="stage-block">'
        +'<div class="stage-hdr" style="background:#BC262E">'
        +'<span style="color:#fff;font-size:13px;font-weight:700">Descartadas</span>'
        +'<span style="color:rgba(255,255,255,.8);font-size:11px">'+count+' ficha'+(count!==1?'s':'')+'</span>'
        +'</div>'
        +'<table style="background:#fff;border:1px solid #B0D1D7;border-top:none">'
        +'<thead><tr>'
        +hdrs.map(function(h,i){var w=wds[i]||'';return '<th class="th"'+(w?' style="width:'+w+'"':'')+'>'+h+'</th>';}).join('')
        +'</tr></thead>'
        +'<tbody>'+rows+'</tbody>'
        +'</table></div>';
    }

    function rptSection(title,count,color,rows){
      var hdrs=['Empresa','Responsable','Programa','Importe','F. apertura','F. \xfalt. nota','Pr\xf3x. contacto','\xdaltima nota'];
      var wds=["14%","8%","10%","7%","8%","8%","9%",""];
      return '<div class="stage-block">'
        +'<div class="stage-hdr" style="background:'+color+'">'
        +'<span style="color:#fff;font-size:13px;font-weight:700">'+esc(title)+'</span>'
        +'<span style="color:rgba(255,255,255,.8);font-size:11px">'+count+' ficha'+(count!==1?'s':'')+'</span>'
        +'</div>'
        +'<table style="background:#fff;border:1px solid #B0D1D7;border-top:none">'
        +'<thead><tr>'
        +hdrs.map(function(h,i){var w=wds[i]||'';return '<th class="th"'+(w?' style="width:'+w+'"':'')+'>'+h+'</th>';}).join('')
        +'</tr></thead>'
        +'<tbody>'+rows+'</tbody>'
        +'</table></div>';
    }

    var sectionsHTML='',totalActive=0,totalEurActivo=0;
    stages.forEach(function(stage,idx){
      var sl=p3.filter(function(l){return l.stage===stage.id&&!isPostponedLead(l);});
      if(!sl.length)return;
      if(stage.prob<100){totalActive+=sl.length;sl.forEach(function(l){totalEurActivo+=Number(l.importe)||0;});}
      sl.sort(function(a,b){return (a.comercial||'').localeCompare(b.comercial||'',"es");});
      var color=stagePalette[Math.min(idx,stagePalette.length-1)];
      sectionsHTML+=rptSection(stage.label+' ('+stage.prob+'%)',sl.length,color,sl.map(rptRow).join(''));
    });

    var postponedLeads=p3.filter(isPostponedLead);

    var p3Lost=leads.filter(function(l){
      if(l.pipeline!=='P3'||!l.lost)return false;
      if(selectedComs.length&&selectedComs.indexOf(normKey(l.comercial||''))===-1)return false;
      if(selectedProgs.length){
        var lProg=getLeadProgram(l);
        var pk=lProg==='—'?'__none__':lProg;
        if(selectedProgs.indexOf(pk)===-1)return false;
      }
      return true;
    });
    p3Lost.sort(function(a,b){return (a.comercial||'').localeCompare(b.comercial||'',"es");});

    var progCounts={};
    (trainingEditionPrograms||[]).forEach(function(p){progCounts[p]=0;});
    p3.filter(function(l){return !isPostponedLead(l);}).forEach(function(l){
      var prog=getLeadProgram(l);
      if(prog!=='—'&&progCounts.hasOwnProperty(prog))progCounts[prog]++;
    });

    function kpiCard(label,color,value){
      return '<div style="background:#fff;border:1px solid #B0D1D7;border-top:3px solid '+color
        +';border-radius:5px;padding:12px 16px;min-width:110px;text-align:center">'
        +'<div style="font-size:22px;font-weight:700;color:'+color+'">'+value+'</div>'
        +'<div style="font-size:10px;color:#757575;text-transform:uppercase;letter-spacing:.04em;margin-top:3px">'+label+'</div>'
        +'</div>';
    }
    var kpiHTML='<div style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:20px">'
      +kpiCard('Fichas activas','#0C5580',totalActive)
      +kpiCard('Aplazadas','#78716C',postponedLeads.length)
      +kpiCard('Descartadas','#BC262E',p3Lost.length)
      +kpiCard('Importe potencial','#1F4E79',fmtEur(totalEurActivo));
    (trainingEditionPrograms||[]).forEach(function(prog){
      kpiHTML+=kpiCard(prog,'#0891B2',progCounts[prog]||0);
    });
    kpiHTML+='</div>';

    var p3StageRows='';
    stages.forEach(function(stage){
      if(stage.prob===100)return;
      var sl=p3.filter(function(l){return l.stage===stage.id&&!isPostponedLead(l);});
      if(!sl.length)return;
      var eurTotal=0;sl.forEach(function(l){eurTotal+=Number(l.importe)||0;});
      var weighted=Math.round(eurTotal*(stage.prob/100));
      p3StageRows+='<tr>'
        +'<td style="color:#0C5580;font-weight:600">'+esc(stage.label)+'</td>'
        +'<td style="text-align:center;font-size:11px;color:#757575">'+stage.prob+'%</td>'
        +'<td style="text-align:right;font-weight:700;color:#0C5580;font-variant-numeric:tabular-nums">'+fmtEur(eurTotal)+'</td>'
        +'<td style="text-align:right;font-weight:700;color:#059669;font-variant-numeric:tabular-nums">'+fmtEur(weighted)+'</td>'
        +'</tr>';
    });
    var funnelHTML=p3StageRows?'<div style="margin-bottom:20px">'
      +'<div style="font-size:10px;font-weight:700;color:#757575;text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px">Euros potenciales por etapa</div>'
      +'<table style="background:#fff;border:1px solid #B0D1D7;border-radius:5px;overflow:hidden;max-width:500px">'
      +'<thead><tr><th class="th" style="width:48%">Etapa</th><th class="th" style="width:10%;text-align:center">Prob.</th>'
      +'<th class="th" style="width:21%;text-align:right">Importe</th><th class="th" style="width:21%;text-align:right">Ponderado</th>'
      +'</tr></thead><tbody>'+p3StageRows+'</tbody></table></div>':'';

    function buildP3EvolutionHTML(){
      function obsDateToISO(d){var p=(d||'').split(' ')[0].split('/');return p.length===3?(p[2]+'-'+p[1]+'-'+p[0]):'';}
      function stgLabel(stageId){var s=PIPELINES.P3.stages[Number(stageId)];return s?s.label:'Etapa '+(Number(stageId)+1);}
      function toTitleCase(s){return (s||'').toLowerCase().replace(/(^|\s)\S/g,function(c){return c.toUpperCase();});}

      var allP3=leads.filter(function(l){
        if(l.pipeline!=='P3')return false;
        if(selectedComs.length&&selectedComs.indexOf(normKey(l.comercial||''))===-1)return false;
        if(selectedProgs.length){
          var lProg=getLeadProgram(l);
          var pk=lProg==='—'?'__none__':lProg;
          if(selectedProgs.indexOf(pk)===-1)return false;
        }
        return true;
      });
      var events=[];

      allP3.forEach(function(lead){
        var latestNote=latestUserNote(lead);
        var noteDate=latestNote?(isoToDisplay(obsDateToISO(latestNote.date))||'—'):'—';
        var nextContactISO=getLeadNextContactDate(lead);
        var nextContact=nextContactISO?isoToDisplay(nextContactISO):'—';
        var prog=getLeadProgram(lead);

        var meta=(lead.obs||[]).filter(function(o){return o&&o.type==='stage_meta'&&o.enteredAt;})
          .sort(function(a,b){return (a.enteredAt||'').localeCompare(b.enteredAt||'');});

        meta.forEach(function(entry,idx){
          if((entry.enteredAt||'')>=cutoffISO){
            var prev=idx>0?meta[idx-1]:null;
            events.push({
              kind:prev?'stage':'new',
              dateISO:entry.enteredAt,
              company:lead.company,
              comercial:lead.comercial||'—',
              programa:prog,
              noteDate:noteDate,
              nextContact:nextContact,
              from:prev?stgLabel(prev.stage):null,
              to:stgLabel(entry.stage)
            });
          }
        });

        var poEntries=(lead.obs||[]).filter(function(o){
          if(!o||o.type!=='postponed')return false;
          var iso=obsDateToISO(o.date);return iso&&iso>=cutoffISO;
        });
        if(poEntries.length){
          poEntries.sort(function(a,b){return obsDateToISO(b.date).localeCompare(obsDateToISO(a.date));});
          var po=poEntries[0];
          var poISO=obsDateToISO(po.date);
          var prevMeta=meta.filter(function(m){return (m.enteredAt||'')<poISO;});
          var fromStage=prevMeta.length?stgLabel(prevMeta[prevMeta.length-1].stage):'—';
          events.push({
            kind:'postponed',
            dateISO:poISO,
            company:lead.company,
            comercial:lead.comercial||'—',
            programa:prog,
            noteDate:noteDate,
            nextContact:nextContact,
            from:fromStage,
            to:'Aplazada'+(po.nextContactDate?' (hasta '+isoToDisplay(po.nextContactDate)+')':" ")
          });
        }

        if(lead.lost){
          var lostEntries=(lead.obs||[]).filter(function(o){
            if(!o||o.type!=='alert')return false;
            var iso=obsDateToISO(o.date);
            return iso&&iso>=cutoffISO&&/Marcada como perdida/i.test(String(o.text||''));
          });
          lostEntries.forEach(function(o){
            events.push({
              kind:'lost',
              dateISO:obsDateToISO(o.date),
              company:lead.company,
              comercial:lead.comercial||'—',
              programa:prog,
              noteDate:noteDate,
              nextContact:nextContact,
              from:null,
              to:'Perdida'+(lead.lostReason?' ('+lead.lostReason+')':" ")
            });
          });
        }
      });

      if(!events.length){
        return '<div style="background:#fff;border:1px solid #B0D1D7;border-radius:5px;padding:18px 20px;margin-bottom:24px;color:#757575;font-size:12px;font-style:italic">'
          +'Sin cambios de etapa en los \xfaltimos '+sinceDays+' d\xedas.</div>';
      }

      events.sort(function(a,b){
        var c=(a.comercial||'').localeCompare(b.comercial||'',"es");
        return c!==0?c:(b.dateISO||'').localeCompare(a.dateISO||'');
      });

      var rows=events.map(function(ev){
        var badge,desc;
        if(ev.kind==='new'){
          badge='<span style="background:#059669;color:#fff;border-radius:3px;padding:2px 7px;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.04em">Nueva ficha</span>';
          desc='<span style="color:#757575;font-style:italic">(nueva)</span>&nbsp;<span style="color:#0C5580;font-weight:700">→</span>&nbsp;<span style="font-weight:600;color:#059669">'+esc(ev.to)+'</span>';
        }else if(ev.kind==='postponed'){
          badge='<span style="background:#78716C;color:#fff;border-radius:3px;padding:2px 7px;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.04em">Aplazada</span>';
          desc='<span style="color:#757575">'+esc(ev.from)+'</span>&nbsp;<span style="color:#78716C;font-weight:700">→</span>&nbsp;<span style="font-weight:600;color:#78716C">'+esc(ev.to)+'</span>';
        }else if(ev.kind==='lost'){
          badge='<span style="background:#BC262E;color:#fff;border-radius:3px;padding:2px 7px;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.04em">Perdida</span>';
          desc='<span style="color:#757575">—</span>&nbsp;<span style="color:#BC262E;font-weight:700">→</span>&nbsp;<span style="font-weight:600;color:#BC262E">'+esc(ev.to)+'</span>';
        }else{
          badge='<span style="background:#0C5580;color:#fff;border-radius:3px;padding:2px 7px;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.04em">Avance</span>';
          desc='<span style="color:#757575">'+esc(ev.from)+'</span>&nbsp;<span style="color:#0C5580;font-weight:700">→</span>&nbsp;<span style="font-weight:600;color:#059669">'+esc(ev.to)+'</span>';
        }
        return '<tr>'
          +'<td style="font-weight:600;color:#0C5580;font-size:11px">'+esc(toTitleCase(ev.company))+'</td>'
          +'<td style="white-space:nowrap;color:#212121">'+esc(ev.comercial)+'</td>'
          +'<td style="white-space:nowrap;color:#0891B2;font-size:11px">'+esc(ev.programa)+'</td>'
          +'<td style="white-space:nowrap">'+badge+'</td>'
          +'<td style="white-space:nowrap;color:#757575;font-size:11px">'+esc(ev.noteDate||'—')+'</td>'
          +'<td style="white-space:nowrap;color:#0C5580;font-size:11px;font-weight:600">'+esc(ev.nextContact||'—')+'</td>'
          +'<td>'+desc+'</td>'
          +'</tr>';
      }).join('');

      return '<div class="stage-block" style="margin-bottom:28px">'
        +'<div class="stage-hdr" style="background:#1F4E79">'
        +'<span style="color:#fff;font-size:13px;font-weight:700">Evoluci\xf3n del pipeline P3 — \xfaltimos '+sinceDays+' d\xedas</span>'
        +'<span style="color:rgba(255,255,255,.8);font-size:11px">Desde '+isoToDisplay(cutoffISO)+' \xb7 '+events.length+' movimiento'+(events.length!==1?'s':'')+'</span>'
        +'</div>'
        +'<table style="background:#fff;border:1px solid #B0D1D7;border-top:none">'
        +'<thead><tr>'
        +'<th class="th" style="width:17%">Empresa</th>'
        +'<th class="th" style="width:10%">Responsable</th>'
        +'<th class="th" style="width:11%">Programa</th>'
        +'<th class="th" style="width:9%">Tipo</th>'
        +'<th class="th" style="width:10%">Fecha \xfalt. nota</th>'
        +'<th class="th" style="width:10%">Fecha pr\xf3x. acci\xf3n</th>'
        +'<th class="th">Movimiento</th>'
        +'</tr></thead>'
        +'<tbody>'+rows+'</tbody>'
        +'</table>'
        +'</div>';
    }

    var evolutionHTML=buildP3EvolutionHTML();
    var comLabel=selectedComs.length?selectedComs.map(function(nk){return p3ComMap[nk]||nk;}).join(', '):'Todos';

    var xlRows=[];
    stages.forEach(function(stage){
      var sl=p3.filter(function(l){return l.stage===stage.id&&!isPostponedLead(l);});
      sl.forEach(function(l){
        var createdISO=getCreationDateFromObs(l.obs)||dateOnlyISO(l.createdAt);
        var note=latestUserNote(l);
        var nextDate=getLeadNextContactDate(l);
        xlRows.push({
          'Empresa':l.company||'',
          'Comercial':l.comercial||'',
          'Programa':getLeadProgram(l),
          'Importe':Number(l.importe)||0,
          'Etapa':stage.label,
          'Prob.':stage.prob+'%',
          'Estado':'Activo',
          'F. apertura':createdISO?isoToDisplay(createdISO):'',
          'F. ult. nota':note&&note.date?note.date:'',
          'Prox. contacto':nextDate?isoToDisplay(nextDate):'',
          'Motivo descarte':'',
          'Ultima nota':note?note.text:''
        });
      });
    });
    postponedLeads.forEach(function(l){
      var createdISO=getCreationDateFromObs(l.obs)||dateOnlyISO(l.createdAt);
      var note=latestUserNote(l);
      var nextDate=getLeadNextContactDate(l);
      var stg=null;for(var _si=0;_si<stages.length;_si++){if(stages[_si].id===l.stage){stg=stages[_si];break;}}
      xlRows.push({
        'Empresa':l.company||'',
        'Comercial':l.comercial||'',
        'Programa':getLeadProgram(l),
        'Importe':Number(l.importe)||0,
        'Etapa':stg?stg.label:'',
        'Prob.':stg?stg.prob+'%':'',
        'Estado':'Aplazada',
        'F. apertura':createdISO?isoToDisplay(createdISO):'',
        'F. ult. nota':note&&note.date?note.date:'',
        'Prox. contacto':nextDate?isoToDisplay(nextDate):'',
        'Motivo descarte':'',
        'Ultima nota':note?note.text:''
      });
    });
    p3Lost.forEach(function(l){
      var createdISO=getCreationDateFromObs(l.obs)||dateOnlyISO(l.createdAt);
      var note=latestUserNote(l);
      var stg=null;for(var _si=0;_si<stages.length;_si++){if(stages[_si].id===l.stage){stg=stages[_si];break;}}
      xlRows.push({
        'Empresa':l.company||'',
        'Comercial':l.comercial||'',
        'Programa':getLeadProgram(l),
        'Importe':Number(l.importe)||0,
        'Etapa':stg?stg.label:'',
        'Prob.':'',
        'Estado':'Descartada',
        'F. apertura':createdISO?isoToDisplay(createdISO):'',
        'F. ult. nota':note&&note.date?note.date:'',
        'Prox. contacto':'',
        'Motivo descarte':l.lostReason||'',
        'Ultima nota':note?note.text:''
      });
    });
    var xlJson=JSON.stringify(xlRows).replace(/<\/script/gi,'<\\/script');
    var xlFileName='P3_Formacion_'+dateStr.replace(/\//g,'-')+'.xlsx';

    try{
      var html='<!DOCTYPE html><html><head><meta charset="UTF-8">'
        +'<title>Informe P3 — Venta Formaci\xf3n</title>'
        +'<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"><\/script>'
        +'<style>'
        +'*{box-sizing:border-box}body{font-family:\'Helvetica Neue\',Helvetica,Arial,sans-serif;font-size:12px;color:#212121;background:#EEF5F7;margin:0;padding:0}'
        +'.wrap{max-width:1100px;margin:0 auto;padding:24px}'
        +'.hdr{background:#0C5580;color:#fff;padding:16px 24px;display:flex;justify-content:space-between;align-items:center}'
        +'.hdr-title{font-size:16px;font-weight:700}'
        +'.hdr-meta{font-size:11px;opacity:.8;text-align:right}'
        +'.section-title{font-size:10px;font-weight:700;color:#757575;text-transform:uppercase;letter-spacing:.05em;margin:20px 0 8px}'
        +'.stage-block{margin-bottom:20px}'
        +'.stage-hdr{display:flex;justify-content:space-between;align-items:center;padding:9px 14px;border-radius:4px 4px 0 0}'
        +'table{width:100%;border-collapse:collapse}'
        +'.th{background:#EEF5F7;color:#0C5580;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:7px 10px;text-align:left;border-bottom:1px solid #B0D1D7}'
        +'td{padding:7px 10px;border-bottom:1px solid #EEF5F7;vertical-align:top}'
        +'tr:last-child td{border-bottom:none}'
        +'tr:hover td{background:#F8FAFC}'
        +'</style></head><body>'
        +'<div class="hdr">'
        +'<div class="hdr-title">Informe P3 — Venta Formaci\xf3n</div>'
        +'<div class="hdr-meta">'+dateStr+'<br>Comerciales: '+esc(comLabel)+'<br>\xdaltimos '+sinceDays+' d\xedas</div>'
        +'<button onclick="exportXl()" style="background:#059669;color:#fff;border:none;border-radius:4px;padding:9px 18px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap;flex-shrink:0" title="Exportar todas las fichas a Excel">&#8595; Exportar Excel</button>'
        +'</div>'
        +'<div class="wrap">'
        +'<div class="section-title">Resumen</div>'
        +kpiHTML
        +funnelHTML
        +'<div class="section-title">Evoluci\xf3n reciente</div>'
        +evolutionHTML
        +'<div class="section-title">Fichas por etapa</div>'
        +sectionsHTML;

      if(postponedLeads.length){
        var postponedRows=postponedLeads.map(rptRow).join('');
        html+=rptSection('Aplazadas',postponedLeads.length,'#78716C',postponedRows);
      }

      if(p3Lost.length){
        html+='<div class="section-title">Descartadas</div>';
        html+=rptSectionLost(p3Lost.length,p3Lost.map(rptRowLost).join(''));
      }

      html+='<div style="margin-top:32px;padding-top:16px;border-top:1px solid #B0D1D7;font-size:10px;color:#757575;text-align:center">'
        +'Fundaci\xf3n Industrial Navarra \xb7 fundacionindustrialnavarra.com \xb7 '+dateStr
        +'</div></div>'
        +'<script>var _xlData='+xlJson+';var _xlFile="'+xlFileName+'";'
        +'function exportXl(){'
        +'if(typeof XLSX==="undefined"){alert("La librer\xeda de Excel a\xfan no se ha cargado. Espera un momento e int\xe9ntalo de nuevo.");return;}'
        +'var wb=XLSX.utils.book_new();'
        +'var ws=XLSX.utils.json_to_sheet(_xlData);'
        +'ws["!cols"]=[{wch:32},{wch:14},{wch:24},{wch:12},{wch:26},{wch:8},{wch:10},{wch:13},{wch:13},{wch:15},{wch:55}];'
        +'XLSX.utils.book_append_sheet(wb,ws,"P3 Formaci\xf3n");'
        +'XLSX.writeFile(wb,_xlFile);'
        +'}<\/script>'
        +'</body></html>';

      w.document.open();
      w.document.write(html);
      w.document.close();
    }catch(e){
      w.document.write('<pre style="color:red;padding:20px">ERROR: '+String(e)+'\n\n'+(e.stack||'')+'</pre>');
      w.document.close();
      throw e;
    }
  };
}

function p3xlDrawChart(spec){
  var W=760,S=2;
  var n=spec.categories.length;
  var showLegend=!spec.signColors&&spec.series.length>1;
  var mc=document.createElement("canvas").getContext("2d");
  mc.font="11px Arial";
  var legendRows=1;
  if(showLegend){
    var lx=0;
    spec.series.forEach(function(s){
      var iw=15+mc.measureText(s.name).width+22;
      if(lx+iw>W-200){legendRows++;lx=0;}
      lx+=iw;
    });
  }
  var padT=46,padB=showLegend?(40+18*legendRows):42,padR=48;
  var perCat=spec.stacked?36:(spec.series.length>1?48:34);
  var H=Math.max(300,Math.min(620,padT+padB+Math.max(n,1)*perCat));
  var cv=document.createElement("canvas");
  cv.width=W*S;cv.height=H*S;
  var g=cv.getContext("2d");
  g.scale(S,S);
  g.fillStyle="#FFFFFF";g.fillRect(0,0,W,H);
  g.textBaseline="middle";g.textAlign="left";
  g.font="bold 14px Arial";g.fillStyle="#0C5580";g.fillText(spec.title,20,22);
  g.font="12px Arial";
  var mw=0;
  spec.categories.forEach(function(c){mw=Math.max(mw,g.measureText(c).width);});
  var padL=Math.min(240,Math.ceil(mw)+30);
  var px=padL,py=padT,pw=W-padL-padR,ph=H-padT-padB;
  var maxV=0,minV=0;
  spec.categories.forEach(function(c,i){
    if(spec.stacked){
      var t=0;spec.series.forEach(function(s){t+=s.values[i]||0;});
      maxV=Math.max(maxV,t);
    }else{
      spec.series.forEach(function(s){var v=s.values[i]||0;maxV=Math.max(maxV,v);minV=Math.min(minV,v);});
    }
  });
  g.fillStyle="#EEF5F7";g.fillRect(px,py,pw,ph);
  if(maxV===0&&minV===0){
    g.fillStyle="#757575";g.font="italic 12px Arial";g.textAlign="center";
    g.fillText("Sin datos para los filtros seleccionados",px+pw/2,py+ph/2);
    return {data:cv.toDataURL("image/png"),w:W,h:H};
  }
  var range=maxV-minV;
  var e=Math.pow(10,Math.floor(Math.log10(range/4)));
  var f=(range/4)/e;
  var step=Math.max(1,(f<=1?1:f<=2?2:f<=5?5:10)*e);
  var lo=Math.floor(minV/step)*step,hi=Math.ceil(maxV/step)*step;
  if(hi===lo)hi=lo+step;
  function X(v){return px+(v-lo)/(hi-lo)*pw;}
  g.font="11px Arial";g.textAlign="center";
  for(var t=lo;t<=hi+1e-9;t+=step){
    var x=X(t);
    g.strokeStyle="#B0D1D7";g.lineWidth=0.6;g.beginPath();g.moveTo(x,py);g.lineTo(x,py+ph);g.stroke();
    g.fillStyle="#040D17";g.fillText(String(Math.round(t)),x,py+ph+14);
  }
  if(lo<0){g.strokeStyle="#040D17";g.lineWidth=1;g.beginPath();g.moveTo(X(0),py);g.lineTo(X(0),py+ph);g.stroke();}
  var band=ph/n;
  var light={"#B0D1D7":1,"#AAAAAA":1,"#EEF5F7":1,"#FCE4D6":1};
  spec.categories.forEach(function(c,i){
    var cy=py+band*(i+0.5);
    g.font="12px Arial";g.fillStyle="#040D17";g.textAlign="right";
    var lbl=c;
    while(g.measureText(lbl).width>padL-18&&lbl.length>3)lbl=lbl.slice(0,-2);
    if(lbl!==c)lbl=lbl.replace(/\s+$/,"")+"…";
    g.fillText(lbl,px-8,cy);
    var bh=Math.min(band*0.68,30);
    if(spec.stacked){
      var cum=0,tot=0;
      spec.series.forEach(function(s){
        var v=s.values[i]||0;
        if(v<=0)return;
        var x0=X(cum),x1=X(cum+v);
        g.fillStyle=s.color;g.fillRect(x0,cy-bh/2,x1-x0,bh);
        if(x1-x0>=18){g.font="bold 11px Arial";g.textAlign="center";g.fillStyle=light[s.color]?"#040D17":"#FFFFFF";g.fillText(String(v),(x0+x1)/2,cy);}
        cum+=v;tot+=v;
      });
      if(tot>0){g.font="bold 11px Arial";g.textAlign="left";g.fillStyle="#040D17";g.fillText(String(tot),X(cum)+6,cy);}
    }else{
      var ns=spec.series.length,sh=bh/ns;
      spec.series.forEach(function(s,k){
        var v=s.values[i]||0;
        var y=cy-bh/2+sh*k;
        var color=spec.signColors?(v>=0?"#2E7D32":"#C62828"):s.color;
        var x0=X(0),x1=X(v);
        g.fillStyle=color;g.fillRect(Math.min(x0,x1),y+1,Math.abs(x1-x0),sh-2);
        var txt=spec.signColors?((v>0?"+":(v<0?"−":""))+Math.abs(v)):String(v);
        g.font="bold 11px Arial";g.fillStyle="#040D17";
        if(v<0){g.textAlign="right";g.fillText(txt,x1-6,y+sh/2);}
        else{g.textAlign="left";g.fillText(txt,x1+6,y+sh/2);}
      });
    }
  });
  if(showLegend){
    g.font="11px Arial";g.textAlign="left";
    var lx2=px,ly=py+ph+36;
    spec.series.forEach(function(s){
      var iw=15+g.measureText(s.name).width+22;
      if(lx2+iw>W-16&&lx2>px){lx2=px;ly+=18;}
      g.fillStyle=s.color;g.fillRect(lx2,ly-5,10,10);
      g.fillStyle="#040D17";g.fillText(s.name,lx2+15,ly);
      lx2+=iw;
    });
  }
  return {data:cv.toDataURL("image/png"),w:W,h:H};
}

      if(!done.length)return;
      recStats.done++;

        if(!rel.length){libre++;opts.push(label+": sin ficha");return;}

    });

        });
      });

      ws.mergeCells(tRow,1,tRow,nCols);

      tc.value="Total: "+nEmpresas+" empresa"+(nEmpresas!==1?"s":"")+" \xb7 "+nFichas+" ficha"+(nFichas!==1?"s":"")+(nPerdidas?" ("+nPerdidas+" perdida"+(nPerdidas!==1?"s":"")+")":"")+" \xb7 una empresa con varias categor\xedas o fichas ocupa una sola fila";

      tc.alignment={vertical:"middle",horizontal:"left",indent:1};

      ws.getRow(tRow).height=22;
      var fRow=tRow+2;
      ws.mergeCells(fRow,1,fRow,nCols);
      var fc=ws.getCell(fRow,1);
      fc.value="Fundaci\xf3n Industrial Navarra \xb7 fundacionindustrialnavarra.com";
      fc.font={name:"Arial",size:9,italic:true,color:{argb:C.gray}};
      ws.autoFilter={from:{row:5,column:1},to:{row:5,column:nCols}};
      ws.pageSetup={orientation:"landscape",paperSize:9,fitToPage:true,fitToWidth:1,fitToHeight:0};
      try{
        p3xlAddPlanSheet(wb,imgId,{C:C,params:params,dateStr:dateStr,catNames:catNames,stageNames:stageNames,edNames:edNames,comNames:comNames});
      }catch(planErr){
        console.error(planErr);
        alert("El Excel se generar\xe1 sin la hoja de plan comercial por un error: "+planErr.message);

      try{
        p3xlAddChartsSheet(wb,imgId,{C:C,rows:rows,params:params,days:days,cutoffISO:cutoffISO,dateStr:dateStr,nEmpresas:nEmpresas,filtersText:filtersText});
      }catch(chartErr){
        console.error(chartErr);
        alert("El Excel se generar\xe1 sin la hoja de gr\xe1ficos por un error: "+chartErr.message);
      }
      wb.xlsx.writeBuffer().then(function(buf){
        var blob=new Blob([buf],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
        var a=document.createElement("a");
        a.href=URL.createObjectURL(blob);
        a.download="P3_Formacion_Comercial_"+isoNow+".xlsx";
        document.body.appendChild(a);
        a.click();
        setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},2000);
        try{if(formWin)formWin.close();}catch(e){}
      }).catch(function(err){alert("No se pudo generar el Excel: "+err.message);});
    });
  };

function generateP1Report(){
  var dInput=window.prompt("Evoluci\xf3n del pipeline: \xbfcu\xe1ntos d\xedas atr\xe1s analizar?\n(Dejar en blanco = \xfaltimos 7 d\xedas)","7");

  var stagePalette=["#64748B","#0891B2","#0C5580","#D97706","#EA580C","#7C3AED","#059669"];

  function rptRow(l,showTipo){

    var noteTxt=note?note.text:"—";
    var noteDate=note&&note.date?note.date:"—";
    var createdISO=getCreationDateFromObs(l.obs)||dateOnlyISO(l.createdAt);
    var createdStr=createdISO?isoToDisplay(createdISO):"—";
    var tipoCell="";
    if(showTipo){
      var _details=leadConceptDetails(l);
      var _con=normLbl1((_details.length?_details[0].concepto:l.concepto)||"");
      var _lbl,_bg,_tx;
      if(_con.indexOf("fideliz")!==-1){_lbl="Fidelizada";_bg="#F59E0B";_tx="#1C1100";}
      else{_lbl="Ganada";_bg="#059669";_tx="#fff";}

    }
    return '<tr>'

      +tipoCell
      +'<td style="color:#757575;font-size:11px;font-style:italic">'+esc(noteTxt)+'</td>'
      +'</tr>';
  }

  function rptSection(title,count,color,rows,showTipo){
    var hdrs=showTipo?['Empresa','Responsable','F. apertura','F. \xfalt. nota','Pr\xf3x. contacto','Tipo','\xdaltima nota']:['Empresa','Responsable','F. apertura','F. \xfalt. nota','Pr\xf3x. contacto','\xdaltima nota'];
    var wds=showTipo?["15%","8%","9%","9%","11%","8%",""]:["17%","9%","9%","9%","12%",""];
    return '<div class="stage-block">'
      +'<div class="stage-hdr" style="background:'+color+'">'
      +'<span style="color:#fff;font-size:13px;font-weight:700">'+esc(title)+'</span>'
      +'<span style="color:rgba(255,255,255,.8);font-size:11px">'+count+' ficha'+(count!==1?"s":"")+'</span>'
      +'</div>'
      +'<table style="background:#fff;border:1px solid #B0D1D7;border-top:none">'
      +'<thead><tr>'
      +hdrs.map(function(h,i){
        var w=wds[i]||"";
        return '<th class="th"'+(w?' style="width:'+w+'"':'')+'>'+h+'</th>';
      }).join("")
      +'</tr></thead>'
      +'<tbody>'+rows+'</tbody>'
      +'</table>'
      +'</div>';
  }

  function _p1IsBaja(l){var o=Array.isArray(l.obs)?l.obs:[];return o.some(function(x){return x&&x.type==="associate_exit";});}
  var _bajasExcl=leads.filter(function(l){return l.pipeline==="P1"&&!l.lost&&_p1IsBaja(l);});
  var p1=leads.filter(function(l){return l.pipeline==="P1"&&!l.lost&&!_p1IsBaja(l);});
  var stages=PIPELINES.P1.stages;

  var numGrande=0,numPequena=0,eurColaboraciones=0,eurGrupoCompras=0,numTramitacion=0;

    if(!stg)return;
    if(stg.prob===90)numTramitacion++;
    if(stg.prob!==100)return;
    var details=leadConceptDetails(l);
    if(!details.length)details=[{concepto:l.concepto||"",matriculas:l.matriculas}];
    var isGrande=false,isPequena=false;
    details.forEach(function(d){
      var c=normLbl1(d.concepto||"");
      var amount=leadIncomeLineAmount(l,details,d);
      if(c.indexOf("grande")!==-1)isGrande=true;
      else if(c.indexOf("peque")!==-1)isPequena=true;
      if(c.indexOf("colabor")!==-1)eurColaboraciones+=amount;
      if(c.indexOf("compras")!==-1)eurGrupoCompras+=amount;
    });
    if(isGrande)numGrande++;
    if(isPequena)numPequena++;

  stages.forEach(function(stage,idx){

// INFORME ACTIVIDAD COMERCIAL — Gonzalo & Julen

function p3ActBuild(N,ganadas,reun){
    var today=new Date();
    var dd=pad(today.getDate()),mm=pad(today.getMonth()+1),yyyy=today.getFullYear();
    var dateStr=dd+"/"+mm+"/"+yyyy;
    var todayISO=yyyy+"-"+mm+"-"+dd;

    var cutA=addDaysISO(todayISO,-N);
    var cutB=addDaysISO(todayISO,-2*N);
    var endBISO=addDaysISO(cutA,-1);

    function isoDisp(iso){return iso.split("-").reverse().join("/");}
    var labelA=isoDisp(cutA)+" — "+isoDisp(todayISO);
    var labelB=isoDisp(cutB)+" — "+isoDisp(endBISO);

    function obsISO(s){
      if(!s)return null;
      var p=s.split('/');if(p.length<3)return null;
      return p[2].split(' ')[0]+'-'+p[1]+'-'+p[0];
    }

    var targets=[{key:"gonzal",label:"Gonzalo"},{key:"julen",label:"Julen"}];

    function getTargetIdx(comercial){
      var nk=normKey(comercial||"");
      if(nk.indexOf("gonza")!==-1&&nk.indexOf("julen")!==-1)return -1;
      for(var i=0;i<targets.length;i++){if(nk.indexOf(targets[i].key)!==-1)return i;}
      return -1;
    }

    // Classify a lead's current stage into a phase group
    // Returns: "prospecto" | "lead" | "oportunidad" | "caliente" | "ganada" | null (lost/skip)
    function phaseGroup(l){
      if(l.lost)return null;
      var pid=l.pipeline;
      var p=PIPELINES[pid];if(!p)return null;
      if(isWonLead(l))return "ganada";
      if(isPostponedLead(l)){
        // classify aplazadas by their current stage too
        var ps=p.stages[Number(l.stage)];
        var pp=ps?ps.prob||0:0;
        if(pp<=15)return "prospecto";
        if(pp<65)return "lead";
        if(pp<85)return "oportunidad";
        return "caliente";
      }
      var s=p.stages[Number(l.stage)];if(!s)return null;
      var prob=s.prob||0;
      if(prob<=15)return "prospecto";
      if(prob<65)return "lead";
      if(prob<85)return "oportunidad";
      if(prob<100)return "caliente";
      return "ganada";
    }

    // Count notes (user obs) per phase per person for a period
    // Returns array[targets] of {prospecto, lead, oportunidad, caliente, ganada}
    function computeNotes(fromISO, toISO, pipFilter){
      var res=targets.map(function(){return {prospecto:0,lead:0,oportunidad:0,caliente:0,ganada:0};});
      leads.forEach(function(l){
        var tIdx=getTargetIdx(l.comercial);
        if(tIdx===-1)return;
        var pid=l.pipeline;
        if(pipFilter?pid!==pipFilter:(pid!=="P1"&&pid!=="P3"))return;
        var phase=phaseGroup(l);
        if(!phase)return;
        var count=(l.obs||[]).filter(function(o){
          if(!o||o.type!=="user"||!String(o.text||"").trim())return false;
          var iso=obsISO(o.date||"");
          return iso&&iso>=fromISO&&iso<=toISO;
        }).length;
        if(count>0)res[tIdx][phase]+=count;
      });
      return res;
    }

    var nB=computeNotes(cutB,endBISO,null);
    var nA_P1=computeNotes(cutA,todayISO,"P1");
    var nB_P1=computeNotes(cutB,endBISO,"P1");

    var PHASES=[

       descP3:"Acciones para conseguir confirmaci\xf3n de matr\xedcula"},
      {key:"ganada",label:"Ganada / Cierre",color:"#059669",

       descP1:"Asociaci\xf3n formalizada o empresa asociada fidelizada tras una visita de retenci\xf3n",

    function deltaHtml(a,b){

    function renderSection(title, secSub, pA, pB, pipMode){

      var cg='border-left:2px solid #D0E4EC;';
      var ct='border-left:2px solid #B0D1D7;';
      var s='<div class="section">'
        +'<div class="sec-hdr"><span>'+esc(title)+'</span><span class="sec-sub">'+secSub+'</span></div>'
        +'<table><thead>'
        +'<tr>'
        +'<th rowspan="2" style="width:26%;vertical-align:bottom;">Fase del embudo</th>'
        +'<th colspan="3" style="'+cg+'border-bottom:1px solid #B0D1D7;color:#0C5580;">Gonzalo</th>'

          var rP1j=reun.julen.P1||0, rP3j=reun.julen.P3||0, rMj=reun.julen.Mix||0, rFj=reun.julen.Fid||0;
          var gR=pipMode==='P1'?(rP1g+rFg):pipMode==='P3'?rP3g:(rP1g+rP3g+rMg+rFg);
          var jR=pipMode==='P1'?(rP1j+rFj):pipMode==='P3'?rP3j:(rP1j+rP3j+rMj+rFj);
          var tR=gR+jR;
          var reunLbl=pipMode==='P1'?'Reuniones realizadas (solo P1)':pipMode==='P3'?'Reuniones realizadas (solo P3)':'Reuniones realizadas (total)';
          function reunSub(lbl,desc,vg,vj,color,pad){

        +'<td><span class="prev">'+tB+'</span></td>'
        +'<td>'+deltaHtml(tA,tB)+'</td>'

      s+='</tbody></table></div>';
      return s;
    }

  return {

function reportDateValue(s){
  var m=String(s||"").match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if(!m)return 0;
  return Number(m[3]+pad(m[2])+pad(m[1]))||0;
}
function reportISOValue(iso){
  return Number(String(iso||"").replace(/-/g,""))||0;
}
function inferActivityYear(month, noteDate){
  var base=dateOnlyISO(noteDate)||todayISO();
  var parts=String(base).split("-");
  var year=Number(parts[0])||new Date().getFullYear();
  var baseMonth=Number(parts[1])||1;
  if(month<baseMonth-2)year++;
  return year;
}
function collectReportDateCandidates(text,noteDate){
  var raw=String(text||"");
  var out=[];
  function push(year,month,day,index){
    year=Number(year);month=Number(month);day=Number(day);
    if(!year||!month||!day||month<1||month>12||day<1||day>31)return;
    if(year<100)year+=2000;
    out.push({iso:year+"-"+pad(month)+"-"+pad(day),index:index||0});
  }
  raw.replace(/\b(\d{4})-(\d{1,2})-(\d{1,2})\b/g,function(match,y,m,d,idx){push(y,m,d,idx);return match;});
  raw.replace(/\b(\d{1,2})[\/\-](\d{1,2})(?:[\/\-](\d{2,4}))?\b/g,function(match,d,m,y,idx){
    push(y||inferActivityYear(Number(m),noteDate),m,d,idx);
    return match;
  });
  raw.replace(/\b(\d{1,2})(?:\s+de)?\s+(enero|febrero|marzo|abril|mayo|junio|julio|agosto|septiembre|setiembre|octubre|noviembre|diciembre)\b/gi,function(match,d,monthName,idx){
    var m=monthNameToNumber(monthName);
    push(inferActivityYear(m,noteDate),m,d,idx);
    return match;
  });
  if(/\bmanana\b|\bma\u00f1ana\b/i.test(normKey(raw))){
    var base=dateOnlyISO(noteDate)||todayISO();
    var next=addDaysISO(base,1);
    if(next)out.push({iso:next,index:0});
  }
  return out;
}
function getFutureReportDateFromNote(text,noteDate){
  var today=todayISO();
  var candidates=collectReportDateCandidates(text,noteDate)
    .filter(function(c){return c.iso>=today;})
    .sort(function(a,b){
      if(a.iso!==b.iso)return a.iso.localeCompare(b.iso);
      return a.index-b.index;
    });
  return candidates.length?candidates[0].iso:"";
}
function daysBetweenISO(a,b){
  var da=localDateFromISO(a), db=localDateFromISO(b);
  if(!da||!db)return null;
  return Math.round((db-da)/86400000);
}
function collectFutureVwReportDates(activeLeads){
  var today=todayISO();
  var seen={};
  activeLeads.forEach(function(l){
    if(l.pipeline!=="P1")return;
    getLeadReportObservations(l).forEach(function(o){
      if(!isP1VwNavarraInviteNote(o.text))return;
      var raw=String(o.text||"");
      collectReportDateCandidates(o.text,o.date).forEach(function(c){
        var ctx=normKey(raw.slice(Math.max(0,(c.index||0)-40),(c.index||0)+55));
        if(c.iso>=today&&(/\bvw\b|volkswagen|jornad/.test(ctx)))seen[c.iso]=true;
      });
    });
  });
  return Object.keys(seen).sort();
}
function inferNearbyFutureVwDate(noteDate,futureVwDates){
  var base=dateOnlyISO(noteDate)||todayISO();
  for(var i=0;i<futureVwDates.length;i++){
    var diff=daysBetweenISO(base,futureVwDates[i]);
    if(diff!=null&&diff>=0&&diff<=45)return futureVwDates[i];
  }
  return "";
}
function classifyCommercialActivityNote(text){
  var k=normKey(text);
  if(!k)return null;
  if(/\bvisit|visita|visitamos|visitar|planta/.test(k))return "Visita";
  if(/reunion|reunimos|reunir|teams|videollamada/.test(k))return "Reuni\u00f3n";
  if(/\bcita\b|\bcitas\b|agend|cerramos|cerrada|quedamos|vernos|por confirmar/.test(k))return "Cita";
  return null;
}
function isP1VwNavarraInviteNote(text){
  var k=normKey(text);
  var mentionsVw=/\bvw\b|volkswagen/.test(k);
  var mentionsJornada=/jornad/.test(k);
  var inviteContext=/invit|asist|acud|viene|vendr|confirm|apunt|inscrit|convoc|acept|visit|ver[eé]|qued|plaza/.test(k);
  return mentionsVw && (mentionsJornada || inviteContext);
}
function getCommercialActivityReport(activeLeads){
  var activity=[];
  var vwInvites=[];
  var futureVwDates=collectFutureVwReportDates(activeLeads);
  var activityBestByLead={};
  var vwBestByLead={};
  activeLeads.forEach(function(l){
    var p=PIPELINES[l.pipeline];
    var st=p&&p.stages?p.stages[l.stage]:null;
    getLeadReportObservations(l).forEach(function(o){
      var type=classifyCommercialActivityNote(o.text);
      var futureDate=getFutureReportDateFromNote(o.text,o.date);
      if(type&&futureDate){
        activityBestByLead[l.id]={lead:l, obs:o, type:type, pipeline:p, stage:st, eventDateISO:futureDate};
      }
      if(l.pipeline==="P1" && isP1VwNavarraInviteNote(o.text)){
        if(!futureDate){
          var hasPastVwDate=collectReportDateCandidates(o.text,o.date).some(function(c){
            if(c.iso>=todayISO())return false;
            var ctx=normKey(String(o.text||"").slice(Math.max(0,(c.index||0)-40),(c.index||0)+55));
            return /\bvw\b|volkswagen|jornad/.test(ctx);
          });
          if(!hasPastVwDate)futureDate=inferNearbyFutureVwDate(o.date,futureVwDates);
        }
        if(futureDate)vwBestByLead[l.id]={lead:l, obs:o, pipeline:p, stage:st, eventDateISO:futureDate};
      }
    });
  });
  Object.keys(activityBestByLead).forEach(function(id){activity.push(activityBestByLead[id]);});
  Object.keys(vwBestByLead).forEach(function(id){vwInvites.push(vwBestByLead[id]);});
  activity.sort(function(a,b){
    if(a.eventDateISO!==b.eventDateISO)return a.eventDateISO.localeCompare(b.eventDateISO);
    return reportDateValue(b.obs.date)-reportDateValue(a.obs.date);
  });
  vwInvites.sort(function(a,b){

function normalizeReportIncomeCategories(opts){

  });

function reportIncomeCategoriesLabel(categories){
  categories=categories||[];
  return categories.length?categories.join(", "):"";

function leadMatchesIncomeCategories(lead, categories){
  categories=categories||[];
  if(!categories.length)return true;
  var keys=categories.map(normKey).filter(Boolean);
  if(!keys.length)return true;
  return leadConceptDetails(lead).some(function(d){return keys.indexOf(normKey(d.concepto))!==-1;});
}
function leadMatchesIncomeCategory(lead, category){
  return leadMatchesIncomeCategories(lead, category?[category]:[]);
}
function reportNumericAmount(value){
  var n=Number(value);
  return isFinite(n)?n:0;
}
function reportLeadAmount(lead, selectedCategories){
  if(!lead)return 0;
  var leadAmount=reportNumericAmount(lead.importe);
  var details=leadConceptDetails(lead);
  var keys=(selectedCategories||[]).map(normKey).filter(Boolean);
  if(!details.length)return keys.length?0:leadAmount;
  var matching=keys.length?details.filter(function(d){return keys.indexOf(normKey(d.concepto))!==-1;}):details;
  if(!matching.length)return 0;
  if(!keys.length&&details.length<2)return leadAmount||conceptLineAmount(details[0],0);
  var sum=matching.reduce(function(s,d){return s+reportNumericAmount(conceptLineAmount(d,0));},0);
  if(sum>0)return sum;
  if(leadAmount>0)return leadAmount;
  return 0;
}
function reportLeadAmountLabel(lead, selectedCategories){
  var amount=reportLeadAmount(lead, selectedCategories);
  return amount>0?fmt(amount):"-";
}
function reportLeadContactoPrevioLabel(lead){

}

function leadHasPrevioContacto(lead){

    if(c&&!hasConcept(labels,c))labels.push(c);
  }
  var details=leadConceptDetails(lead);
  if(selectedCategories&&selectedCategories.length){
    selectedCategories.forEach(function(c){
      if(details.some(function(d){return normKey(d.concepto)===normKey(c);}))add(c);
    });
  }else{
    details.forEach(function(d){add(d.concepto);});
  }
  if(!labels.length)add("Sin categor\u00eda");
  return labels;
}
function leadReportStageInfo(lead){
  var p=PIPELINES[lead&&lead.pipeline]||{id:"ZZ",label:"Sin pipeline",stages:[]};
  var stageIndex=Number(lead&&lead.stage);
  if(!isFinite(stageIndex))stageIndex=999;
  var st=p.stages[stageIndex];
  var pipelineIds=Object.keys(PIPELINES);
  var pipelineOrder=pipelineIds.indexOf(p.id);
  if(pipelineOrder<0)pipelineOrder=99;
  if(lead&&lead.lost){
    var lostLabel=lead.lostReason?("Perdida - "+lead.lostReason):"Perdida";
    return {key:"lost|"+p.id+"|"+lostLabel,label:(p.label?p.label+" \u00b7 ":"")+lostLabel,sort:99999};
  }
  if(lead&&isPostponedLead(lead)){
    return {key:p.id+"|postponed",label:(p.label?p.label+" \u00b7 ":"")+"Aplazadas",sort:pipelineOrder*100+p.stages.length};
  }
  if(lead&&isAssociateExitLead(lead)){
    return {key:p.id+"|bajas",label:(p.label?p.label+" \u00b7 ":"")+"Bajas asociados",sort:pipelineOrder*100+p.stages.length+1};
  }
  var label=st?st.label:"Sin etapa";
  return {
    key:p.id+"|"+stageIndex+"|"+label,
    label:(p.label?p.label+" \u00b7 ":"")+label,
    sort:pipelineOrder*100+stageIndex
  };
}
function compareLeadsByKanbanOrder(a,b){
  var ia=leadReportStageInfo(a), ib=leadReportStageInfo(b);
  if(ia.sort!==ib.sort)return ia.sort-ib.sort;
  var pa=String(a&&a.pipeline||""), pb=String(b&&b.pipeline||"");
  if(pa!==pb)return pa.localeCompare(pb,"es",{numeric:true,sensitivity:"base"});
  var ca=String(a&&a.company||""), cb=String(b&&b.company||"");
  if(ca!==cb)return ca.localeCompare(cb,"es",{sensitivity:"base"});
  return (Number(a&&a.id)||0)-(Number(b&&b.id)||0);
}

  // TRACEABILITY
  if(opts.traceability){
    writeReport("<h2>&Uacute;ltima nota por ficha</h2>");
    var traceGroups={};
    reportLeads.forEach(function(l){
      var latestObs=getLatestLeadReportObservation(l);

      var owner=String(l.comercial||"Sin asignar").trim()||"Sin asignar";
      if(!traceGroups[owner])traceGroups[owner]={categories:{},leadIds:{},noteCount:0,importe:0};
      traceGroups[owner].leadIds[l.id]=true;
      traceGroups[owner].noteCount++;
      if(PIPELINES[l.pipeline]&&PIPELINES[l.pipeline].economic)traceGroups[owner].importe+=reportLeadAmount(l,incomeCategories);
      leadReportCategoryLabels(l,incomeCategories).forEach(function(category){
        if(!traceGroups[owner].categories[category])traceGroups[owner].categories[category]=[];
        traceGroups[owner].categories[category].push({lead:l,note:latestObs});
      });
    });
    var owners=Object.keys(traceGroups).sort(function(a,b){
      if(a==="Sin asignar")return 1;
      if(b==="Sin asignar")return -1;
      return a.localeCompare(b,"es",{sensitivity:"base"});
    });
    if(owners.length===0){
      writeReport("<p style='color:#757575;font-size:11px'>No hay notas para las categor&iacute;as seleccionadas.</p>");
    }
    owners.forEach(function(owner){
      var group=traceGroups[owner];
      var categoryNames=Object.keys(group.categories).sort(function(a,b){
        var ia=incomeCategories.indexOf(a), ib=incomeCategories.indexOf(b);
        if(ia!==-1||ib!==-1)return (ia===-1?999:ia)-(ib===-1?999:ib);
        return a.localeCompare(b,"es",{sensitivity:"base"});
      });
      var uniqueLeadCount=Object.keys(group.leadIds).length;

          var info=leadReportStageInfo(item.lead);
          if(!stageGroups[info.key])stageGroups[info.key]={info:info,entries:[]};
          stageGroups[info.key].entries.push(item);
        });
        Object.keys(stageGroups).sort(function(a,b){
          var ia=stageGroups[a].info, ib=stageGroups[b].info;
          if(ia.sort!==ib.sort)return ia.sort-ib.sort;
          return ia.label.localeCompare(ib.label,"es",{sensitivity:"base"});
        }).forEach(function(stageKey){
          var stageGroup=stageGroups[stageKey];
          stageGroup.entries.sort(function(a,b){
            return String(a.lead.company||"").localeCompare(String(b.lead.company||""),"es",{sensitivity:"base"});

// Ejercicio del plan: todos los a\xf1os del plan (rotulos, tramos, bajas, ganadas) salen de aqu\xed. Los tramos se guardan como d\xeda-mes.
function pcEj(){var y=parseInt(planCfg.ejercicio);return (y>=2000&&y<=2100)?y:2026;}
function pcMD(s){s=String(s||"");return s.length>=10?s.slice(5):s;}
function pcExcFecha(){return pcEj()+"-"+(pcMD(planCfg.fechaExcepcion)||"12-31");}
// A\xf1o en que una ficha pas\xf3 a Ganada (\xfaltima entrada en la etapa final). Sin historial, el a\xf1o de creaci\xf3n; sin nada, el ejercicio.
function pcWonYear(l){
  var last=PIPELINES.P1.stages.length-1;
  var e=normalizeObsArray(l&&l.obs).filter(function(o){return o&&o.type==="stage_meta"&&Number(o.stage)===last&&o.enteredAt;});
  var d=e.length?dateOnlyISO(e[e.length-1].enteredAt):(getCreationDateFromObs(l&&l.obs)||dateOnlyISO(l&&l.createdAt)||"");
  var y=parseInt(String(d).slice(0,4));
  return y>=2000?y:pcEj();
}
// Sustituye en los rotulos del plan el a\xf1o por el ejercicio (no toca fechas ni a\xf1os de datos, que van entre > <, / o -)
function pcYearLabels(h){
  var ej=pcEj();
  h=String(h);
  // 1) a\xf1os escritos a fuego en los r\xf3tulos (una sola pasada, para no convertir dos veces)
  if(ej!==2026)h=h.replace(/(?<![>\/\d-])(2026|2027)(?![\d\/-])/g,function(m){return m==="2026"?String(ej):String(ej+1);});
  // 2) marcadores {EJ} y {EJ1}
  return h.split("{EJ}").join(String(ej)).split("{EJ1}").join(String(ej+1));
}
// Cuota que se cobra en el a\xf1o seg\xfan la fecha en que se asocia la empresa (tramos editables en Config)
function pcTramos(){
  var t=(planCfg.tramos&&planCfg.tramos.length===3)?planCfg.tramos:[{hasta:"08-31",pct:100},{hasta:"10-31",pct:50},{hasta:"12-31",pct:0}];

function setPlanReparto(i,val){

function pcPct(iso){
  var t=pcTramos();
  for(var i=0;i<t.length;i++){if(iso<=t[i].hasta)return Number(t[i].pct)||0;}
  return 0;
}
// \xdaltimo d\xeda en que todav\xeda se cobra algo de cuota (fin del \xfaltimo tramo con porcentaje > 0)
function pcLimite(){
  var last="";
  pcTramos().forEach(function(x){if((Number(x.pct)||0)>0)last=x.hasta;});
  return last||todayISO();
}
// Ciclo de venta introducido a mano en Config: dias medios por etapa (Cualificada -> Ganada)
function pcCicloData(){
  var c=planCfg.ciclo||{};
  var e={1:Number(c.e1)||0,2:Number(c.e2)||0,3:Number(c.e3)||0,4:Number(c.e4)||0};
  var ok=e[1]>0&&e[2]>0&&e[3]>0&&e[4]>0;
  var sum=e[1]+e[2]+e[3]+e[4];
  return {ok:ok,e:e,sum:ok?sum:0,total:Number(c.total)>0?Number(c.total):(ok?sum:0)};
}
// Dias que faltan para ganar: lo que resta de la etapa actual + las etapas siguientes
// Si la ficha ya super\xf3 el tiempo medio de su fase se asume que necesita todav\xeda la mitad de ese tiempo (no que termina al instante).
function pcRemaining(l,cd){
  var avg=cd.e[l.stage],d=l.days||0;
  var rem=d<avg?avg-d:avg/2;
  for(var s=l.stage+1;s<=4;s++)rem+=cd.e[s];
  return rem;
}
// Posibilidad real de cierre de una candidata. Las marcadas "sin cuota 2026" se asocian sin pagar este a\xf1o (se les pasa la cuota en enero):
// no aportan a 2026 y su plazo para cerrar es fechaExcepcion.
function pcCierre(l,cd,today){
  var exc=(planCfg.excepciones||[]).indexOf(l.id)!==-1;
  var limit=exc?pcExcFecha():pcLimite();
  var left=Math.max(0,Math.round((new Date(limit)-new Date(today))/864e5));
  var rem=pcRemaining(l,cd);
  var est=needsDecision(l);
  var timing=rem<=left?"a":(rem<=left*1.5?"j":"f");
  var prob=timing==="a"?(est?"media":"alta"):timing==="j"?(est?"baja":"media"):"baja";
  var over2=(l.days||0)>2*cd.e[l.stage];   // lleva m\xe1s del doble del tiempo medio en su fase
  if(over2)prob="baja";
  return {exc:exc,left:left,rem:rem,date:addDaysISO(today,Math.round(rem)),prob:prob,timing:timing,est:est,over2:over2};
}

function renderPlanComercial(){
  var today=todayISO();
  planCfg.fechaCorte=pcLimite();
  var pctNow=pcPct(today);
  var assoc=getAssociationBalanceStats();
  var fun=pcFunnel();
  var nG=fun.filter(function(l){return pcCat(l)==="grande";}).length,nP=fun.length-nG;
  var obj=Number(planCfg.funnelObjetivo)||30;
  var fState=fun.length<obj*0.8?["Por debajo del objetivo","red"]:fun.length>obj*1.2?["Por encima del objetivo","warn"]:["En rango","ok"];
  // Presupuesto 2026
  var gap=Math.max(0,Number(assoc.gapInicialCaptacion)||0);
  var cg=pcCuota("grande"),cp=pcCuota("pequena");
  var pP=Math.min(100,Math.max(0,Number(planCfg.pctPequena)||0))/100;
  var avg=pP*cp+(1-pP)*cg;
  var needG=gap?Math.ceil(gap/cg):0,needP=gap?Math.ceil(gap/cp):0,needM=gap?Math.ceil(gap/avg):0;
  var daysLeft=Math.max(0,Math.round((new Date(planCfg.fechaCorte)-new Date(today))/864e5));
  var late=fun.filter(function(l){return l.stage>=3;}).sort(function(a,b){return b.stage-a.stage;});
  var lateFee=late.reduce(function(s,l){return s+pcFee(l);},0);
  var lateW=late.reduce(function(s,l){var p=getProb(l);return s+pcFee(l)*((p!=null&&p!=="")?Number(p)/100:0);},0);
  // El sem\xe1foro solo cuenta las candidatas no estancadas: una ficha parada 100+ d\xedas no es una cierre realista.
  var lateLive=late.filter(function(l){return !needsDecision(l);});
  var liveFee=lateLive.reduce(function(s,l){return s+pcFee(l);},0);
  var liveW=lateLive.reduce(function(s,l){var p=getProb(l);return s+pcFee(l)*((p!=null&&p!=="")?Number(p)/100:0);},0);
  var pState=gap<=0?["Objetivo alcanzado","ok"]:(liveW*pctNow/100>=gap?["Cubierto con fichas al d\xeda","ok"]:liveFee*pctNow/100>=gap?["Posible si cierran casi todas","warn"]:["Insuficiente con fichas al d\xeda","red"]);
  // Con los datos de ciclo de venta (Config) se eval\xfaa la posibilidad real de cierre de cada ficha del funnel
  var cd=pcCicloData();
  var cands=[];
  if(cd.ok){
    fun.forEach(function(l){
      var c=pcCierre(l,cd,today);
      if(l.stage>=3||c.exc||c.prob!=="baja")cands.push({l:l,c:c});
    });
    var rank={alta:0,media:1,baja:2};
    cands.sort(function(a,b){return rank[a.c.prob]-rank[b.c.prob]||b.l.stage-a.l.stage||a.c.rem-b.c.rem;});
  }else{
    late.forEach(function(l){cands.push({l:l,c:null});});
  }
  // Lo que cada candidata aporta a 2026: cuota x % que se cobra en la fecha de cierre estimada (o % de excepci\xf3n)
  cands.forEach(function(x){

var FLNL_NUEVAS=[{f:"2026-11-02",n:14},{f:"2026-11-16",n:27}];
// Empresas con nombres distintos en P1 y P3 que son la misma (nombre normalizado -> nombre de referencia)
var FLNL_ALIAS={"troquelados josa":"troqueleria josa","mancomunidad comarca pamplona":"mancomunidad"};
function flnlKey(n){var k=normKey(n);return FLNL_ALIAS[k]||k;}
function flnlNum(x,d){var n=parseFloat(String(x).replace(",","."));return isNaN(n)?d:n;}
function flnlFmt(x,dec){var m=Math.pow(10,dec==null?1:dec);return String(Math.round(x*m)/m).replace(".",",");}
function flnlOwner(c){var k=normKey(c||"");if(!k)return "Sin asignar";if(k==="ma"||k.indexOf("maria angeles")===0)return "MA";return c;}
function flnlMonday(iso){var d=localDateFromISO(iso);return addDaysISO(iso,-((d.getDay()+6)%7));}
function flnlDays(iso){var a=localDateFromISO(todayISO()),b=localDateFromISO(iso);return Math.round((b-a)/86400000);}
function flnlEstado(iso){
  var d=flnlDays(iso);
  if(d<0)return pcChip("Vencido hace "+(-d)+" d","red");
  if(d===0)return pcChip("Vence hoy","warn");
  return pcChip("Quedan "+d+" d",d<=14?"warn":"mu");
}
function flnlData(){
  var c=flnlCfg,today=todayISO();
  var lim=c.limApl||"2026-11-06";
  var pend=String(c.pendientes||"").split(",").map(normKey).filter(Boolean);
  var progs=[
    {k:"fl",name:"First Level",obj:flnlNum(c.plazasFL,25),ratio:flnlNum(c.ratioFL,2.25),sept:flnlNum(c.septFL,0)},
    {k:"nl",name:"Next Level",obj:flnlNum(c.plazasNL,25),ratio:flnlNum(c.ratioNL,1.9),sept:flnlNum(c.septNL,0)}
  ];
  var prob={com:flnlNum(c.pCom,70),tem:flnlNum(c.pTem,30),cua:flnlNum(c.pCua,15),pro:flnlNum(c.pPro,5),apl:flnlNum(c.pApl,15),rec:flnlNum(c.pRec,15)};
  var baja=flnlNum(c.baja,8);
  var D={c:c,today:today,lim:lim,prob:prob,baja:baja,p:{},carga:{},cargaSeen:{},lostAll:0,lostSin:0};
  var lostIds={};
  progs.forEach(function(pr){
    var o={k:pr.k,name:pr.name,obj:pr.obj,ratio:pr.ratio,sept:pr.sept,price:getConceptAmount(pr.name),
      st:{com:[],tem:[],cua:[],pro:[],apl:[]},sepWon:{},matr:[],active:{}};
    leads.forEach(function(l){
      if(l.pipeline!=="P3")return;
      var det=leadConceptDetails(l).filter(function(d){return formacionCategoryLabel(d.concepto)===pr.name;});
      if(!det.length)return;
      if(l.lost){
        if(!lostIds[l.id]){
          lostIds[l.id]=1;D.lostAll++;
          if(!String(l.lostReason||"").trim()||/sin feedback|sin motivo/i.test(String(l.lostReason)))D.lostSin++;
        }
        return;
      }
      var plz=det.reduce(function(s,d){return s+(Number(d.matriculas)>0?Number(d.matriculas):0);},0)||pr.ratio;
      var eds=getLeadProgramEditionIds(l).map(getProgramEdition).filter(function(e){return e&&e.program===pr.name;});
      var owner=flnlOwner(l.comercial);
      var rec={l:l,id:l.id,company:l.company||"",owner:owner,plazas:plz,date:getLeadNextContactDate(l),
        pend:pend.indexOf(normKey(owner))!==-1,created:getCreationDateFromObs(l.obs)||dateOnlyISO(l.createdAt)};
      if(Number(l.stage)===4){
        if(eds.some(function(e){return /septiembre 2026/i.test(e.name);}))o.sepWon[flnlKey(l.company)]=l.company;
        if(eds.some(function(e){return /febrero 2027/i.test(e.name);}))o.matr.push(rec);
        return;
      }
      var key=isPostponedLead(l)?"apl":["pro","cua","tem","com"][Number(l.stage)||0];
      rec.key=key;
      o.st[key].push(rec);
      o.active[flnlKey(l.company)]=1;
      if(key!=="apl"&&!D.cargaSeen[l.id]){
        D.cargaSeen[l.id]=1;
        var ow=D.carga[owner]=D.carga[owner]||{com:0,tem:0,cua:0,pro:0,tot:0};
        ow[key]++;ow.tot++;
      }
    });
    // Prevision ponderada
    function row(key,label,p,list,exclPend){
      var use=list.filter(function(r){return !(exclPend&&r.pend);});
      return {key:key,label:label,prob:p,tot:list.length,n:use.length,excl:list.length-use.length,emp:use.length*p/100};
    }
    o.aplOk=o.st.apl.filter(function(r){return r.date&&r.date<=lim;});
    var recs=Object.keys(o.sepWon).filter(function(k){return !o.active[k];}).map(function(k){return o.sepWon[k];});
    o.recList=recs;
    o.rows=[
      row("com","Comprometido",prob.com,o.st.com,false),
      row("tem","Contacto templado",prob.tem,o.st.tem,false),
      row("cua","Cualificada",prob.cua,o.st.cua,true),
      row("pro","Prospecto identificado",prob.pro,o.st.pro,true),
      row("apl","Aplazadas con opciones",prob.apl,o.aplOk.filter(function(r){return !r.pend;}),false),
      {key:"rec",label:"Recurrentes de septiembre",prob:prob.rec,tot:recs.length,n:recs.length,excl:0,emp:recs.length*prob.rec/100}
    ];
    o.aplOk=o.aplOk;
    o.emp=o.rows.reduce(function(s,r){return s+r.emp;},0);
    o.plazasPrev=o.emp*o.ratio;
    o.bajaPl=o.plazasPrev*baja/100;
    o.fin=o.plazasPrev-o.bajaPl;
    o.inc=Math.min(o.fin,o.obj)*o.price;
    o.falta=Math.max(0,o.obj-o.fin);
    o.faltaEmp=o.ratio?o.falta/o.ratio:0;
    o.faltaEur=o.falta*o.price;
    o.margen=Math.ceil(o.obj/(1-baja/100));
    o.mLo=Math.floor(o.obj/(1-baja/100));
    o.empNec=o.ratio?Math.round(o.margen/o.ratio):0;
    o.ingObj=o.obj*o.price;
    var plz2=function(arr){return arr.reduce(function(s,r){return s+r.plazas;},0);};
    o.plCom=plz2(o.st.com);
    o.plMatr=plz2(o.matr);
    o.nAct=o.st.com.length+o.st.tem.length+o.st.cua.length+o.st.pro.length;
    D.p[pr.k]=o;
  });
  // Orden de ataque: las mismas prioridades del Excel del plan comercial de formacion (First Level y Next Level)
  D.prio=flnlPrioridades();
  // Trabajo por propietario (una ficha cuenta una vez, aunque lleve los dos programas): activas, aplazadas, matriculadas y perdidas.
  // "No asociada" = empresa sin ficha de asociada (P1 en Asociada) ni de onboarding (P2) con ese nombre.
  var asocK={};
  leads.forEach(function(l){
    if(l.lost)return;
    if((l.pipeline==="P1"&&Number(l.stage)===5&&!isAssociateExitLead(l))||l.pipeline==="P2")asocK[flnlKey(l.company)]=1;
  });
  D.trab={};
  var seenT={};
  leads.forEach(function(l){
    if(l.pipeline!=="P3"||seenT[l.id])return;
    if(!leadConceptDetails(l).some(function(d){var x=formacionCategoryLabel(d.concepto);return x==="First Level"||x==="Next Level";}))return;
    seenT[l.id]=1;
    var t=D.trab[flnlOwner(l.comercial)]=D.trab[flnlOwner(l.comercial)]||{act:0,apl:0,won:0,lost:0,lostNo:0};
    if(l.lost){t.lost++;if(!asocK[flnlKey(l.company)])t.lostNo++;}
    else if(Number(l.stage)===4)t.won++;
    else if(isPostponedLead(l))t.apl++;
    else t.act++;
  });
  // Generacion de demanda Next Level: fichas nuevas desde la fecha base
  D.nuevasNL=D.p.nl.st.cua.concat(D.p.nl.st.tem,D.p.nl.st.com).filter(function(r){return r.created&&r.created>=c.base;}).length;
  D.cuaExistNL=D.p.nl.st.cua.filter(function(r){return !r.created||r.created<c.base;}).length;
  D.total=D.p.fl.inc+D.p.nl.inc;
  D.dias=flnlDays(c.arranque);
  D.sem=Math.max(0,Math.ceil(D.dias/7));
  return D;
}
function flnlSnap(D){
  var wk=flnlMonday(D.today),h=(flnlCfg.historial||[]).slice();
  if(window.__flnlSnapDone===wk||h.some(function(x){return x.w===wk;})){window.__flnlSnapDone=wk;return;}
  window.__flnlSnapDone=wk;
  h.push({w:wk,prev:Math.round(D.total),plFL:Math.round(D.p.fl.fin*10)/10,plNL:Math.round(D.p.nl.fin*10)/10,
    comFL:D.p.fl.st.com.length,comNL:D.p.nl.st.com.length,matFL:Math.round(D.p.fl.plMatr),matNL:Math.round(D.p.nl.plMatr)});
  flnlCfg.historial=h.slice(-40);
  try{sbPatchConfig("planFLNL",flnlCfg);}catch(e){}
}
function flnlSet(k,v){
  if(k==="arranque"||k==="base"||k==="limApl"||k==="pendientes")flnlCfg[k]=String(v||"").trim();
  else flnlCfg[k]=flnlNum(v,flnlCfg[k]);
  try{sbPatchConfig("planFLNL",flnlCfg);}catch(e){}
  renderPlanFLNL();
}
window.flnlSet=flnlSet;

    stages:PIPELINES.P3.stages.map(function(s,i){return String(i);}).concat(["post","lost"]),
    eds:programEditions.map(function(e){return e.id;}).concat(["__none__"]),showEd:true,includeAll:true}});
}

function flnlVerdict(P){

function flnlLoadDocx(cb){
  if(window.docx){cb();return;}
  var s=document.createElement("script");
  s.src="https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.umd.js";
  s.onload=cb;
  s.onerror=function(){alert("No se pudo cargar la librer\xeda de Word (necesita conexi\xf3n a internet). Int\xe9ntalo de nuevo.");};
  document.head.appendChild(s);
}

}
